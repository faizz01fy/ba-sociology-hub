<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Chettan+2:wght@800&family=Manjari:wght@700&display=swap" rel="stylesheet">
<style>
  body { background: #010617; padding: 20px; }
  .b1 { font-family: 'Baloo Chettan 2'; font-size: 104px; font-weight: 800; color: white; -webkit-text-stroke: 1.5px white; line-height: 1.05; }
  .b2 { font-family: 'Baloo Chettan 2'; font-size: 122px; font-weight: 800; color: #ffb703; -webkit-text-stroke: 2.5px #ffb703; line-height: 1.0; margin-top: -6px; }
  .m1 { font-family: 'Manjari'; font-size: 104px; font-weight: 700; color: white; -webkit-text-stroke: 1.5px white; line-height: 1.05; }
  .m2 { font-family: 'Manjari'; font-size: 122px; font-weight: 700; color: #ffb703; -webkit-text-stroke: 2.5px #ffb703; line-height: 1.0; margin-top: -6px; }
</style>
<style id="hub-universal-protection">
*, *::before, *::after {
  -webkit-touch-callout: none !important;
  -webkit-user-select: none !important;
  -khtml-user-select: none !important;
  -moz-user-select: none !important;
  -ms-user-select: none !important;
  user-select: none !important;
}
img {
  -webkit-user-drag: none !important;
  user-drag: none !important;
}
@media print {
  html, body {
    display: none !important;
    visibility: hidden !important;
  }
}
a[download], button[download], [download], .btn-download, .download, #downloadBtn, #saveBtn, .save {
  display: none !important;
}
</style>
</head>
<body>
  <div style="margin-bottom: 40px;">
    <div style="color: grey;">BALOO CHETTAN 2:</div>
    <div class="b1">എന്റെ ഗുരുനാഥനെ</div>
    <div class="b2">ഓർക്കുമ്പോൾ</div>
  </div>
  <div>
    <div style="color: grey;">MANJARI:</div>
    <div class="m1">എന്റെ ഗുരുനാഥനെ</div>
    <div class="m2">ഓർക്കുമ്പോൾ</div>
  </div>
<script id="hub-universal-protection-script">
(function() {
  window.addEventListener('contextmenu', function(e) { e.preventDefault(); e.stopPropagation(); return false; }, true);
  window.addEventListener('keydown', function(e) {
    var k = e.key ? e.key.toLowerCase() : '';
    if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'u', 'c', 'a', 'x'].indexOf(k) !== -1) {
      e.preventDefault(); e.stopPropagation(); return false;
    }
    if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'j', 'c'].indexOf(k) !== -1)) {
      e.preventDefault(); e.stopPropagation(); return false;
    }
  }, true);
  window.addEventListener('dragstart', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('copy', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('cut', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('selectstart', function(e) { e.preventDefault(); return false; }, true);
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; }, true);
})();
</script>
</body>
</html>
