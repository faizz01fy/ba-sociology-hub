<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manjari:wght@700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    position: relative;
    background: #02091d;
    font-family: 'Manjari', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Deep navy gradient background on the left */
  .left-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 720px;
    height: 720px;
    background: radial-gradient(circle at 40% 40%, #082467 0%, #031033 60%, #010617 100%);
    z-index: 2;
    mask-image: linear-gradient(to right, black 80%, transparent 100%);
    -webkit-mask-image: linear-gradient(to right, black 80%, transparent 100%);
  }

  /* Subtle golden ambient stage glow bleeding from right */
  .ambient-glow {
    position: absolute;
    top: 200px;
    left: 180px;
    width: 500px;
    height: 400px;
    background: radial-gradient(circle, rgba(255, 170, 30, 0.07) 0%, transparent 70%);
    z-index: 3;
    pointer-events: none;
  }

  /* Right artwork container */
  .artwork-container {
    position: absolute;
    top: 0;
    right: 0;
    width: 720px;
    height: 720px;
    overflow: hidden;
    z-index: 1;
  }
  .artwork-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* Vignette & feathered transition into deep navy */
  .artwork-vignette {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to right, #02091d 0%, rgba(2, 9, 29, 0.92) 14%, rgba(2, 9, 29, 0.45) 30%, rgba(2, 9, 29, 0) 50%);
    pointer-events: none;
  }

  /* Content Overlay */
  .content {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 720px;
    z-index: 10;
    pointer-events: none;
  }

  /* Header Branding */
  .header {
    position: absolute;
    top: 40px;
    left: 180px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo-icon {
    width: 75px;
    height: 56px;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
  }
  .brand-text {
    font-family: 'Montserrat', sans-serif;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 2.2px;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
  }
  .brand-text span {
    color: #ffb703;
  }

  /* Main Title */
  .title-area {
    position: absolute;
    top: 130px;
    left: 35px;
    width: 670px;
  }
  .title-line-1 {
    font-family: 'Manjari', sans-serif;
    font-size: 92px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.1;
    letter-spacing: -0.5px;
    text-shadow: 0 4px 18px rgba(0, 0, 0, 0.85), 0 2px 4px rgba(0, 0, 0, 0.95);
    white-space: nowrap;
  }
  .title-line-2 {
    font-family: 'Manjari', sans-serif;
    font-size: 98px;
    font-weight: 700;
    background: linear-gradient(180deg, #ffe675 0%, #ffb703 45%, #f57c00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.9));
    line-height: 1.1;
    letter-spacing: -0.5px;
    margin-top: -8px;
    white-space: nowrap;
  }

  /* Author Line */
  .author-container {
    position: absolute;
    top: 435px;
    left: 35px;
    width: 640px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .author-decor {
    height: 1.5px;
    width: 50px;
    background: linear-gradient(90deg, transparent, #ffc837);
  }
  .author-decor.right {
    background: linear-gradient(90deg, #ffc837, transparent);
  }
  .author-text {
    font-family: 'Manjari', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    letter-spacing: 0.5px;
  }

  /* Module · Chapter Pill Badge */
  .badge-container {
    position: absolute;
    top: 510px;
    left: 165px;
    width: 400px;
    height: 56px;
    border-radius: 9999px;
    background: linear-gradient(180deg, #ffe28a 0%, #ffb703 45%, #e67e22 100%);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.65), inset 0 1px 2px rgba(255, 255, 255, 0.7);
    border: 2px solid #fff3a8;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .badge-text {
    font-family: 'Montserrat', sans-serif;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2.2px;
    color: #030e28;
    text-shadow: 0 1px 1px rgba(255, 255, 255, 0.35);
  }

  /* Bottom Ribbon */
  .ribbon-svg {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 680px;
    height: 110px;
    z-index: 12;
  }
  .subject-container {
    position: absolute;
    bottom: 15px;
    left: 115px;
    z-index: 15;
    display: flex;
    align-items: center;
  }
  .subject-text {
    font-family: 'Manjari', sans-serif;
    font-size: 31px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
  }
</style>
<style id="hub-universal-protection">
*, *::before, *::after {
  -webkit-touch-callout: none !important;
  -webkit-user-select: none !important;
  -khtml-user-select: none !important;
  -moz-user-select: none !important;
  -ms-user-select: none !important;
  user-select: none !important;
}
img {
  -webkit-user-drag: none !important;
  user-drag: none !important;
}
@media print {
  html, body {
    display: none !important;
    visibility: hidden !important;
  }
}
a[download], button[download], [download], .btn-download, .download, #downloadBtn, #saveBtn, .save {
  display: none !important;
}
</style>
</head>
<body>
  <!-- Navy Background -->
  <div class="left-bg"></div>
  <div class="ambient-glow"></div>

  <!-- Right Artwork -->
  <div class="artwork-container">
    <img src="file:///C:/Users/HP/OneDrive/Desktop/Projects/PDF python/assets/reference/chapter1_artwork.png" class="artwork-img">
    <div class="artwork-vignette"></div>
  </div>

  <!-- Vector Bottom Ribbon -->
  <svg class="ribbon-svg" viewBox="0 0 680 110" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="ribbonFill" x1="0" y1="55" x2="680" y2="55" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#021644"/>
        <stop offset="35%" stop-color="#062878"/>
        <stop offset="80%" stop-color="#021545"/>
        <stop offset="100%" stop-color="#010a26" stop-opacity="0.9"/>
      </linearGradient>
      <linearGradient id="goldEdge" x1="0" y1="0" x2="680" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#ffe885"/>
        <stop offset="35%" stop-color="#ffd54f"/>
        <stop offset="75%" stop-color="#ffb300"/>
        <stop offset="100%" stop-color="#e67e22"/>
      </linearGradient>
      <linearGradient id="flourishGold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fff59d"/>
        <stop offset="50%" stop-color="#ffca28"/>
        <stop offset="100%" stop-color="#f57f17"/>
      </linearGradient>
    </defs>

    <!-- Base Ribbon Body -->
    <path d="M 0 110 L 0 24 C 40 20, 80 14, 150 14 C 260 14, 420 32, 560 25 C 610 22, 650 15, 680 0 L 680 110 Z" fill="url(#ribbonFill)"/>

    <!-- Gold Edge Trim -->
    <path d="M 0 24 C 40 20, 80 14, 150 14 C 260 14, 420 32, 560 25 C 610 22, 650 15, 680 0" stroke="url(#goldEdge)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 0 26 C 40 22, 80 16, 150 16 C 260 16, 420 34, 560 27 C 610 24, 650 17, 680 2" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.2" stroke-linecap="round" fill="none"/>

    <!-- Kerala Gold Floral Flourish (Bottom Left) -->
    <g transform="translate(18, 38) scale(0.72)">
      <path d="M 35 35 C 35 20, 45 10, 50 0 C 55 10, 65 20, 65 35 C 55 45, 45 45, 35 35 Z" fill="url(#flourishGold)"/>
      <path d="M 20 30 C 15 15, 25 5, 35 0 C 35 15, 30 25, 20 30 Z" fill="url(#flourishGold)"/>
      <path d="M 80 30 C 85 15, 75 5, 65 0 C 65 15, 70 25, 80 30 Z" fill="url(#flourishGold)"/>
      <path d="M 10 45 C 5 35, 10 25, 20 25 C 22 35, 18 42, 10 45 Z" fill="url(#flourishGold)"/>
      <path d="M 90 45 C 95 35, 90 25, 80 25 C 78 35, 82 42, 90 45 Z" fill="url(#flourishGold)"/>
      <path d="M 0 60 C 15 50, 30 52, 45 60 C 30 65, 15 65, 0 60 Z" fill="url(#flourishGold)"/>
      <path d="M 100 60 C 85 50, 70 52, 55 60 C 70 65, 85 65, 100 60 Z" fill="url(#flourishGold)"/>
      <circle cx="50" cy="38" r="5" fill="#fff9c4"/>
      <circle cx="50" cy="50" r="4" fill="#ffb300"/>
    </g>
  </svg>

  <div class="content">
    <!-- Header Branding -->
    <div class="header">
      <!-- Gold Book Icon -->
      <svg class="logo-icon" viewBox="0 0 74 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bookGold" x1="0" y1="0" x2="74" y2="56" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffe28a"/>
            <stop offset="35%" stop-color="#ffb703"/>
            <stop offset="100%" stop-color="#e67e22"/>
          </linearGradient>
        </defs>
        <!-- Open book cover and spine -->
        <path d="M 37 16 C 31 11, 20 7, 5 9 L 5 46 C 20 44, 31 48, 37 52 C 43 48, 54 44, 69 46 L 69 9 C 54 7, 43 11, 37 16 Z" fill="url(#bookGold)"/>
        <!-- Inner page cuts -->
        <path d="M 34 20 C 28 16, 18 13, 9 14 L 9 42 C 18 41, 28 44, 34 47 Z" fill="#02091d"/>
        <path d="M 40 20 C 46 16, 56 13, 65 14 L 65 42 C 56 41, 46 44, 40 47 Z" fill="#02091d"/>
        <!-- Page lines -->
        <path d="M 21 19 C 26 22, 30 28, 32 35" stroke="url(#bookGold)" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 53 19 C 48 22, 44 28, 42 35" stroke="url(#bookGold)" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Spine notch -->
        <polygon points="37,14 34,2 40,2" fill="url(#bookGold)"/>
      </svg>

      <div class="brand-text">ACADEMIC <span>HUB</span></div>
    </div>

    <!-- Main Title -->
    <div class="title-area">
      <div class="title-line-1">എന്റെ ഗുരുനാഥനെ</div>
      <div class="title-line-2">ഓർക്കുമ്പോൾ</div>
    </div>

    <!-- Author -->
    <div class="author-container">
      <div class="author-decor"></div>
      <div class="author-text">കലാമണ്ഡലം ഹൈദരാലി</div>
      <div class="author-decor right"></div>
    </div>

    <!-- Module · Chapter Badge -->
    <div class="badge-container">
      <div class="badge-text">MODULE 1 • CHAPTER 1</div>
    </div>

    <!-- Subject Ribbon Text -->
    <div class="subject-container">
      <div class="subject-text">മലയാള സാഹിത്യാനുശീലനം</div>
    </div>
  </div>
<script id="hub-universal-protection-script">
(function() {
  window.addEventListener('contextmenu', function(e) { e.preventDefault(); e.stopPropagation(); return false; }, true);
  window.addEventListener('keydown', function(e) {
    var k = e.key ? e.key.toLowerCase() : '';
    if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'u', 'c', 'a', 'x'].indexOf(k) !== -1) {
      e.preventDefault(); e.stopPropagation(); return false;
    }
    if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'j', 'c'].indexOf(k) !== -1)) {
      e.preventDefault(); e.stopPropagation(); return false;
    }
  }, true);
  window.addEventListener('dragstart', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('copy', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('cut', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('selectstart', function(e) { e.preventDefault(); return false; }, true);
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; }, true);
})();
</script>
</body>
</html>
