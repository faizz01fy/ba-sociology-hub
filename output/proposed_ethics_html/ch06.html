<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@700;800;900&family=Gayathri:wght@700;900&family=Manjari:wght@700;900&family=Noto+Sans+Malayalam:wght@700;900&family=Orbitron:wght@800;900&family=Outfit:wght@700;800;900&family=Space+Grotesk:wght@700;800;900&family=Syne:wght@800&family=Cinzel:wght@700&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: linear-gradient(135deg, #1F1304 0%, #3D2608 50%, #5E3B0E 100%);
      font-family: 'Gayathri', 'Outfit', sans-serif;
      color: #FFFFFF;
      position: relative;
    }

    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
      z-index: 1;
    }

    .top-bar {
      position: absolute;
      top: 26px;
      left: 45px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }
    .channel-tag {
      background: rgba(0, 0, 0, 0.92);
      border: 2px solid #E5A93C;
      padding: 8px 24px;
      border-radius: 30px;
      font-family: 'Orbitron', 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1.8px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(14px);
      box-shadow: 0 0 24px #E5A93C77;
    }
    .channel-tag .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #E5A93C;
      box-shadow: 0 0 16px #E5A93C;
    }
    .syllabus-badge {
      background: rgba(0, 0, 0, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      padding: 8px 20px;
      border-radius: 30px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: #00E5FF;
      letter-spacing: 0.6px;
      backdrop-filter: blur(10px);
    }

    .content-panel {
      position: absolute;
      top: 92px;
      left: 45px;
      width: 740px;
      z-index: 10;
    }
    .module-badge {
      display: inline-block;
      font-family: 'Orbitron', 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2.2px;
      color: #00E5FF;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 2px 14px rgba(0,0,0,0.95);
    }

    .title-malayalam {
      font-size: 78px;
      font-weight: 900;
      line-height: 1.10;
      background: linear-gradient(90deg, #FFD700 0%, #FF9100 50%, #00F0FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: 
        drop-shadow(0 4px 18px rgba(0, 0, 0, 0.99))
        drop-shadow(0 0 30px #FFD70088);
      margin-bottom: 14px;
      letter-spacing: -0.5px;
    }

    .title-english-box {
      margin-bottom: 18px;
      border-left: 8px solid #00E5FF;
      padding: 10px 20px;
      background: rgba(3, 7, 20, 0.75);
      border-radius: 0 18px 18px 0;
      backdrop-filter: blur(14px);
      box-shadow: 0 6px 26px rgba(0, 0, 0, 0.85);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }
    .title-english-main {
      font-family: 'Orbitron', 'Space Grotesk', sans-serif;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 1.6px;
      line-height: 1.14;
      background: linear-gradient(90deg, #00E5FF 0%, #76FF03 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: 
        drop-shadow(0 3px 15px rgba(0, 0, 0, 0.98))
        drop-shadow(0 0 24px #00E5FF77);
      margin-bottom: 6px;
    }
    .title-english-sub {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: #F8FAFC;
      letter-spacing: 0.8px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }

    .features-row {
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .feature-pill {
      background: rgba(0, 0, 0, 0.92);
      border: 2px solid #E5A93C88;
      padding: 9px 20px;
      border-radius: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 800;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.85);
    }
    .feature-pill span {
      color: #E5A93C;
      font-weight: 900;
    }

    .right-showcase {
      position: absolute;
      top: 40px;
      right: 38px;
      width: 445px;
      height: 625px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    .picture-frame {
      width: 440px;
      height: 545px;
      border-radius: 26px;
      overflow: hidden;
      border: 4px solid #E5A93C;
      box-shadow: 
        0 0 45px #E5A93CAA,
        0 20px 65px rgba(0, 0, 0, 0.98);
      position: relative;
      background: #000000;
    }
    .picture-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      filter: brightness(1.18) contrast(1.20) saturate(1.28);
    }

    .corner-tag {
      position: absolute;
      bottom: 18px;
      right: 18px;
      background: rgba(0, 0, 0, 0.92);
      border: 2px solid #00E5FF;
      padding: 7px 18px;
      border-radius: 24px;
      font-family: 'Orbitron', 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #00E5FF;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
