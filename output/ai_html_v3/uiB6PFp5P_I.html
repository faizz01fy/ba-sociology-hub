    /* Ambient atmospheric glow on right edge */
    .ambient-glow {
      position: absolute;
      top: -100px;
      right: -100px;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, #06D6A033 0%, transparent 70%);
      filter: blur(60px);
      z-index: 2;
      pointer-events: none;
    }

    /* Subtle high-tech grid overlay */
    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 3;
    }

    /* Top Left Channel Banner Pill */
    .top-bar {
      position: absolute;
      top: 36px;
      left: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }
    .channel-tag {
      background: rgba(0, 0, 0, 0.75);
      border: 1.5px solid #06D6A0;
      padding: 8px 18px;
      border-radius: 30px;
      font-family: 'Orbitron', 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }
    .channel-tag .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #06D6A0;
      box-shadow: 0 0 12px #06D6A0;
    }
    .syllabus-badge {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 30px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #118AB2;
      letter-spacing: 0.5px;
      backdrop-filter: blur(10px);
    }

    /* Main Left Content Panel */
    .content-panel {
      position: absolute;
      top: 115px;
      left: 56px;
      width: 680px;
      z-index: 10;
    }
    .module-badge {
      display: inline-block;
      font-family: 'Orbitron', 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2.5px;
      color: #118AB2;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-shadow: 0 2px 15px rgba(0,0,0,0.9);
    }
    .title-malayalam {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.15;
      color: #FFFFFF;
      text-shadow: 0 4px 25px rgba(0, 0, 0, 0.95), 0 0 40px rgba(0,0,0,0.8);
      margin-bottom: 22px;
      letter-spacing: -0.5px;
    }
    .title-english {
      font-family: 'Outfit', 'Space Grotesk', sans-serif;
      font-size: 25px;
      font-weight: 700;
      color: #06D6A0;
      line-height: 1.25;
      text-shadow: 0 2px 15px rgba(0,0,0,0.95);
      margin-bottom: 30px;
      border-left: 4.5px solid #118AB2;
      padding-left: 16px;
    }
    .features-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .feature-pill {
      background: rgba(0, 0, 0, 0.8);
