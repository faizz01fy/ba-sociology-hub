<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@700;800;900&family=Gayathri:wght@700&family=Manjari:wght@700&family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@700;800&family=Cinzel:wght@700;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: #000;
    font-family: 'Anek Malayalam', 'Outfit', sans-serif;
  }

  .canvas {
    position: relative;
    width: 1280px;
    height: 720px;
    background: linear-gradient(135deg, #08122E 0%, #10245E 50%, #18368C 100%);
    display: flex;
  }

  /* Left 715px Typography Section */
  .left-content {
    position: relative;
    width: 715px;
    height: 720px;
    padding: 38px 30px 38px 45px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 10;
  }

  /* Top Badges Header */
  .header-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .univ-badge {
    background: rgba(0, 0, 0, 0.65);
    border: 1.5px solid rgba(255, 255, 255, 0.22);
    border-radius: 8px;
    padding: 6px 14px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px;
    font-weight: 800;
    color: #E2E8F0;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .mod-badge {
    background: #00D2FF;
    color: #030712;
    padding: 6px 15px;
    border-radius: 8px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    box-shadow: 0 0 20px #00D2FF66;
  }
  .topic-tag {
    background: rgba(255, 255, 255, 0.08);
    border: 1.5px solid #00FF9988;
    color: #00FF99;
    padding: 6px 14px;
    border-radius: 8px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.2px;
  }

  /* Main Title Area (Ultra-Zoomed) */
  .title-area {
    margin-top: auto;
    margin-bottom: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .mal-title {
    font-family: 'Anek Malayalam', sans-serif;
    font-size: 76px;
    font-weight: 900;
    line-height: 1.06;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, #00D2FF 0%, #00FF99 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 18px #00D2FF77) drop-shadow(0 2px 5px rgba(0,0,0,0.95));
  }
  .eng-box {
    display: inline-block;
    background: rgba(0, 0, 0, 0.70);
    border-left: 6px solid #00D2FF;
    padding: 10px 18px;
    border-radius: 0 10px 10px 0;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .eng-main {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #00F0FF 0%, #FFE600 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 10px #00F0FF66);
    line-height: 1.15;
  }
  .eng-sub {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 19px;
    font-weight: 700;
    color: #CBD5E1;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  /* Bottom Channel Bar */
  .bottom-bar {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand-pill {
    background: rgba(0, 0, 0, 0.75);
    border: 1.5px solid rgba(255, 255, 255, 0.18);
    border-radius: 999px;
    padding: 7px 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    font-weight: 800;
    color: #FFF;
    letter-spacing: 1px;
  }
  .brand-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #00FF88;
    box-shadow: 0 0 10px #00FF88;
  }
  .tagline {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #00D2FF;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Right 565px Full-Bleed Photo Section */
  .right-photo-wrap {
    position: absolute;
    top: 0;
    bottom: 0;
    right: 0;
    width: 565px;
    height: 720px;
    overflow: hidden;
    border-left: 5px solid #00D2FF;
    box-shadow: -25px 0 65px #00D2FF88;
  }
  .right-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }
  .photo-gradient-fade {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 140px;
    background: linear-gradient(90deg, rgba(5,14,36,0.95) 0%, rgba(5,14,36,0.50) 50%, transparent 100%);
    pointer-events: none;
  }
  .photo-badge {
    position: absolute;
    bottom: 25px;
    right: 25px;
    background: rgba(0, 0, 0, 0.85);
    border: 2px solid #00FF99;
    color: #00FF99;
    padding: 7px 16px;
    border-radius: 8px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    box-shadow: 0 4px 20px rgba(0,0,0,0.8);
  }
</style>
</head>
