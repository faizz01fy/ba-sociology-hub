<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@700;800;900&family=Gayathri:wght@700;900&family=Manjari:wght@700;900&family=Noto+Sans+Malayalam:wght@700;900&family=Orbitron:wght@800;900&family=Outfit:wght@700;900&family=Space+Grotesk:wght@700&family=Syne:wght@800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: linear-gradient(135deg, #051329 0%, #0B2447 50%, #19376D 100%);
      font-family: 'Anek Malayalam', 'Space Grotesk', sans-serif;
      color: #FFFFFF;
      position: relative;
    }
    
    /* Background subtle grid */
    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Top Left Channel Banner Pill */
    .top-bar {
      position: absolute;
      top: 36px;
      left: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }
    .channel-tag {
      background: rgba(0, 0, 0, 0.6);
      border: 1.5px solid #3A86FF;
      padding: 8px 18px;
      border-radius: 30px;
      font-family: 'Orbitron', 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
    }
    .channel-tag .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3A86FF;
      box-shadow: 0 0 10px #3A86FF;
    }
    .syllabus-badge {
      background: rgba(11, 36, 71, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 30px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #FFBE0B;
      letter-spacing: 0.5px;
    }

    /* Main Left Content Panel */
    .content-panel {
      position: absolute;
      top: 110px;
      left: 56px;
      width: 660px;
      z-index: 10;
    }
    .module-badge {
      display: inline-block;
      font-family: 'Orbitron', 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2.5px;
      color: #FFBE0B;
      text-transform: uppercase;
      margin-bottom: 14px;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    .title-malayalam {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.14;
      color: #FFFFFF;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 0 35px rgba(0,0,0,0.6);
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }
    .title-english {
      font-family: 'Outfit', 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #3A86FF;
      line-height: 1.25;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      margin-bottom: 26px;
      border-left: 4px solid #FFBE0B;
      padding-left: 14px;
    }
    .features-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .feature-pill {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 6px 14px;
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #E2E8F0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .feature-pill span {
      color: #3A86FF;
    }

    /* Right Artwork Container */
    .art-container {
      position: absolute;
      top: 50px;
      right: 30px;
      width: 580px;
      height: 620px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    /* Bottom Status Bar */
    .bottom-bar {
      position: absolute;
      bottom: 26px;
      left: 56px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      color: #94A3B8;
      z-index: 10;
    }
    .bottom-bar .hub-url {
      color: #FFFFFF;
      font-weight: 800;
      letter-spacing: 0.8px;
    }
    .bottom-bar .sep {
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>

  <div class="top-bar">
    <div class="channel-tag">
      <div class="dot"></div>
      ACADEMIC HUB
    </div>
    <div class="syllabus-badge">CALICUT UNIVERSITY FYUGP</div>
    <div class="syllabus-badge" style="color: #3A86FF;">MIND & COMPUTATION</div>
  </div>

  <div class="content-panel">
    <div class="module-badge">MODULE 03 · CHAPTER 4</div>
    <h1 class="title-malayalam">ഫങ്ഷണലിസവും<br>കമ്പ്യൂട്ടേഷണൽ മൈൻഡും</h1>
    <div class="title-english">Hilary Putnam · Multiple Realizability</div>
    <div class="features-row">
      <div class="feature-pill"><span>✓</span> സിലബസ് വിശകലനം</div>
      <div class="feature-pill"><span>✓</span> സമഗ്ര മാസ്റ്റർക്ലാസ്</div>
      <div class="feature-pill"><span>✓</span> പരീക്ഷാ ടിപ്പുകൾ</div>
    </div>
  </div>

  <div class="art-container">
    
        <svg viewBox="0 0 600 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="funcGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#3A86FF" stop-opacity="0.7"/>
              <stop offset="100%" stop-color="#000" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="300" cy="300" r="260" fill="url(#funcGlow)"/>

          <!-- Central Abstract Mental State (Software) -->
          <rect x="180" y="80" width="240" height="90" rx="16" fill="rgba(255,255,255,0.15)" stroke="#FFBE0B" stroke-width="4"/>
          <text x="300" y="120" fill="#FFBE0B" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">COGNITIVE FUNCTION</text>
          <text x="300" y="148" fill="#FFFFFF" font-family="monospace" font-size="14" text-anchor="middle">State X: [Belief &amp; Intent]</text>

          <!-- Diverging Arrows to Multiple Substrates -->
          <line x1="240" y1="170" x2="130" y2="280" stroke="#FFBE0B" stroke-width="4"/>
          <polygon points="125,285 140,270 145,280" fill="#FFBE0B"/>

          <line x1="300" y1="170" x2="300" y2="280" stroke="#FFBE0B" stroke-width="4"/>
          <polygon points="300,288 293,272 307,272" fill="#FFBE0B"/>

          <line x1="360" y1="170" x2="470" y2="280" stroke="#FFBE0B" stroke-width="4"/>
          <polygon points="475,285 455,280 460,270" fill="#FFBE0B"/>

          <!-- Substrate 1: Biological Brain -->
          <g transform="translate(60, 300)">
            <rect x="0" y="0" width="140" height="150" rx="14" fill="rgba(0,0,0,0.6)" stroke="#3A86FF" stroke-width="3"/>
            <circle cx="70" cy="60" r="32" fill="#3A86FF" opacity="0.3"/>
            <text x="70" y="65" fill="#FFF" font-family="sans-serif" font-size="28" text-anchor="middle">🧠</text>
            <text x="70" y="125" fill="#3A86FF" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">ORGANIC</text>
          </g>

          <!-- Substrate 2: Silicon Microchip -->
          <g transform="translate(230, 300)">
            <rect x="0" y="0" width="140" height="150" rx="14" fill="rgba(0,0,0,0.6)" stroke="#3A86FF" stroke-width="3"/>
            <rect x="35" y="30" width="70" height="60" rx="4" fill="#000" stroke="#FFBE0B" stroke-width="3"/>
            <circle cx="70" cy="60" r="12" fill="#FFBE0B"/>
            <text x="70" y="125" fill="#FFBE0B" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">SILICON AI</text>
          </g>

          <!-- Substrate 3: Mechanical / Synthetic -->
          <g transform="translate(400, 300)">
            <rect x="0" y="0" width="140" height="150" rx="14" fill="rgba(0,0,0,0.6)" stroke="#3A86FF" stroke-width="3"/>
            <circle cx="70" cy="60" r="30" fill="none" stroke="#FFF" stroke-width="3" stroke-dasharray="6 6"/>
            <text x="70" y="66" fill="#FFF" font-family="sans-serif" font-size="24" text-anchor="middle">⚙️</text>
            <text x="70" y="125" fill="#FFF" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">SYNTHETIC</text>
          </g>

          <text x="300" y="495" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">MULTIPLE REALIZABILITY</text>
        </svg>
        
  </div>

  <div class="bottom-bar">
    <span class="hub-url">🌐 academichubfaiz.in</span>
    <span class="sep">|</span>
    <span>PHILOSOPHY OF ARTIFICIAL INTELLIGENCE</span>
    <span class="sep">|</span>
    <span>100% FREE STUDY PORTAL</span>
  </div>
</body>
</html>
