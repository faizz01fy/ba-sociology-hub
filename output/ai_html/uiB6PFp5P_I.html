<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@700;800;900&family=Gayathri:wght@700;900&family=Manjari:wght@700;900&family=Noto+Sans+Malayalam:wght@700;900&family=Orbitron:wght@800;900&family=Outfit:wght@700;900&family=Space+Grotesk:wght@700&family=Syne:wght@800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: linear-gradient(135deg, #021B1A 0%, #063130 50%, #0B4745 100%);
      font-family: 'Gayathri', 'Poppins', sans-serif;
      color: #FFFFFF;
      position: relative;
    }
    
    /* Background subtle grid */
    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Top Left Channel Banner Pill */
    .top-bar {
      position: absolute;
      top: 36px;
      left: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }
    .channel-tag {
      background: rgba(0, 0, 0, 0.6);
      border: 1.5px solid #06D6A0;
      padding: 8px 18px;
      border-radius: 30px;
      font-family: 'Orbitron', 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
    }
    .channel-tag .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #06D6A0;
      box-shadow: 0 0 10px #06D6A0;
    }
    .syllabus-badge {
      background: rgba(6, 49, 48, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 30px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #118AB2;
      letter-spacing: 0.5px;
    }

    /* Main Left Content Panel */
    .content-panel {
      position: absolute;
      top: 110px;
      left: 56px;
      width: 660px;
      z-index: 10;
    }
    .module-badge {
      display: inline-block;
      font-family: 'Orbitron', 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2.5px;
      color: #118AB2;
      text-transform: uppercase;
      margin-bottom: 14px;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    .title-malayalam {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.14;
      color: #FFFFFF;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 0 35px rgba(0,0,0,0.6);
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }
    .title-english {
      font-family: 'Outfit', 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #06D6A0;
      line-height: 1.25;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      margin-bottom: 26px;
      border-left: 4px solid #118AB2;
      padding-left: 14px;
    }
    .features-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .feature-pill {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 6px 14px;
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #E2E8F0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .feature-pill span {
      color: #06D6A0;
    }

    /* Right Artwork Container */
    .art-container {
      position: absolute;
      top: 50px;
      right: 30px;
      width: 580px;
      height: 620px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    /* Bottom Status Bar */
    .bottom-bar {
      position: absolute;
      bottom: 26px;
      left: 56px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      color: #94A3B8;
      z-index: 10;
    }
    .bottom-bar .hub-url {
      color: #FFFFFF;
      font-weight: 800;
      letter-spacing: 0.8px;
    }
    .bottom-bar .sep {
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>

  <div class="top-bar">
    <div class="channel-tag">
      <div class="dot"></div>
      ACADEMIC HUB
    </div>
    <div class="syllabus-badge">CALICUT UNIVERSITY FYUGP</div>
    <div class="syllabus-badge" style="color: #06D6A0;">EPISTEMIC VECTORS</div>
  </div>

  <div class="content-panel">
    <div class="module-badge">MODULE 03 · EXTENDED</div>
    <h1 class="title-malayalam">എഐയും അറിവിന്റെ<br>വിജ്ഞാനശാസ്ത്രവും</h1>
    <div class="title-english">Epistemic Dimensions · Reliabilism in AI</div>
    <div class="features-row">
      <div class="feature-pill"><span>✓</span> സിലബസ് വിശകലനം</div>
      <div class="feature-pill"><span>✓</span> സമഗ്ര മാസ്റ്റർക്ലാസ്</div>
      <div class="feature-pill"><span>✓</span> പരീക്ഷാ ടിപ്പുകൾ</div>
    </div>
  </div>

  <div class="art-container">
    
        <svg viewBox="0 0 600 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="vecGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#06D6A0" stop-opacity="0.7"/>
              <stop offset="100%" stop-color="#000" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="300" cy="300" r="260" fill="url(#vecGlow)"/>

          <!-- High-Dimensional Vector Hyperspace Grid -->
          <g stroke="#06D6A0" stroke-width="1.5" opacity="0.3">
            <line x1="100" y1="150" x2="500" y2="150"/>
            <line x1="100" y1="250" x2="500" y2="250"/>
            <line x1="100" y1="350" x2="500" y2="350"/>
            <line x1="100" y1="450" x2="500" y2="450"/>
            <line x1="150" y1="100" x2="150" y2="500"/>
            <line x1="250" y1="100" x2="250" y2="500"/>
            <line x1="350" y1="100" x2="350" y2="500"/>
            <line x1="450" y1="100" x2="450" y2="500"/>
          </g>

          <!-- Vector Arrows & Clusters -->
          <g stroke="#118AB2" stroke-width="3" fill="none">
            <line x1="300" y1="300" x2="430" y2="170"/>
            <line x1="300" y1="300" x2="180" y2="210"/>
            <line x1="300" y1="300" x2="230" y2="420"/>
            <line x1="300" y1="300" x2="420" y2="390"/>
          </g>

          <!-- Truth Clustered Nodes -->
          <circle cx="430" cy="170" r="14" fill="#06D6A0"/>
          <circle cx="180" cy="210" r="12" fill="#118AB2"/>
          <circle cx="230" cy="420" r="16" fill="#06D6A0"/>
          <circle cx="420" cy="390" r="15" fill="#FFFFFF"/>

          <!-- Center Origin -->
          <circle cx="300" cy="300" r="18" fill="#FFFFFF" stroke="#06D6A0" stroke-width="4"/>
          <text x="300" y="306" fill="#000" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ORIGIN</text>

          <text x="430" y="145" fill="#06D6A0" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">TRUE CLUSTER</text>
          <text x="230" y="455" fill="#06D6A0" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">RELIABILISM</text>
        </svg>
        
  </div>

  <div class="bottom-bar">
    <span class="hub-url">🌐 academichubfaiz.in</span>
    <span class="sep">|</span>
    <span>PHILOSOPHY OF ARTIFICIAL INTELLIGENCE</span>
    <span class="sep">|</span>
    <span>100% FREE STUDY PORTAL</span>
  </div>
</body>
</html>
