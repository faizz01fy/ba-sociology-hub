<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@700;800;900&family=Gayathri:wght@700;900&family=Manjari:wght@700;900&family=Noto+Sans+Malayalam:wght@700;900&family=Orbitron:wght@800;900&family=Outfit:wght@700;900&family=Space+Grotesk:wght@700&family=Syne:wght@800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: linear-gradient(135deg, #021B14 0%, #062D24 50%, #0A3D31 100%);
      font-family: 'Manjari', 'Syne', sans-serif;
      color: #FFFFFF;
      position: relative;
    }
    
    /* Background subtle grid */
    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Top Left Channel Banner Pill */
    .top-bar {
      position: absolute;
      top: 36px;
      left: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }
    .channel-tag {
      background: rgba(0, 0, 0, 0.6);
      border: 1.5px solid #00FF88;
      padding: 8px 18px;
      border-radius: 30px;
      font-family: 'Orbitron', 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
    }
    .channel-tag .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00FF88;
      box-shadow: 0 0 10px #00FF88;
    }
    .syllabus-badge {
      background: rgba(6, 45, 36, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 30px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #00D4FF;
      letter-spacing: 0.5px;
    }

    /* Main Left Content Panel */
    .content-panel {
      position: absolute;
      top: 110px;
      left: 56px;
      width: 660px;
      z-index: 10;
    }
    .module-badge {
      display: inline-block;
      font-family: 'Orbitron', 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2.5px;
      color: #00D4FF;
      text-transform: uppercase;
      margin-bottom: 14px;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    .title-malayalam {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.14;
      color: #FFFFFF;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 0 35px rgba(0,0,0,0.6);
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }
    .title-english {
      font-family: 'Outfit', 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #00FF88;
      line-height: 1.25;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      margin-bottom: 26px;
      border-left: 4px solid #00D4FF;
      padding-left: 14px;
    }
    .features-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .feature-pill {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 6px 14px;
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #E2E8F0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .feature-pill span {
      color: #00FF88;
    }

    /* Right Artwork Container */
    .art-container {
      position: absolute;
      top: 50px;
      right: 30px;
      width: 580px;
      height: 620px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    /* Bottom Status Bar */
    .bottom-bar {
      position: absolute;
      bottom: 26px;
      left: 56px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      color: #94A3B8;
      z-index: 10;
    }
    .bottom-bar .hub-url {
      color: #FFFFFF;
      font-weight: 800;
      letter-spacing: 0.8px;
    }
    .bottom-bar .sep {
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>

  <div class="top-bar">
    <div class="channel-tag">
      <div class="dot"></div>
      ACADEMIC HUB
    </div>
    <div class="syllabus-badge">CALICUT UNIVERSITY FYUGP</div>
    <div class="syllabus-badge" style="color: #00FF88;">GOFAI VS NEURAL NETS</div>
  </div>

  <div class="content-panel">
    <div class="module-badge">MODULE 01 · CHAPTER 2</div>
    <h1 class="title-malayalam">സിംബോളിക് AI vs<br>കണക്ഷനിസം</h1>
    <div class="title-english">Symbolic Logic vs Deep Learning</div>
    <div class="features-row">
      <div class="feature-pill"><span>✓</span> സിലബസ് വിശകലനം</div>
      <div class="feature-pill"><span>✓</span> സമഗ്ര മാസ്റ്റർക്ലാസ്</div>
      <div class="feature-pill"><span>✓</span> പരീക്ഷാ ടിപ്പുകൾ</div>
    </div>
  </div>

  <div class="art-container">
    
        <svg viewBox="0 0 600 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#00FF88" stop-opacity="0.7"/>
              <stop offset="100%" stop-color="#00FF88" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="300" cy="300" r="260" fill="url(#glow2)"/>
          
          <!-- Top Down Symbolic Logic Tree -->
          <g transform="translate(40, 50)">
            <!-- Root -->
            <rect x="80" y="50" width="90" height="40" rx="8" fill="rgba(0,0,0,0.6)" stroke="#00FF88" stroke-width="3"/>
            <text x="125" y="75" fill="#00FF88" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">RULE A</text>
            
            <line x1="125" y1="90" x2="70" y2="150" stroke="#00FF88" stroke-width="3"/>
            <line x1="125" y1="90" x2="180" y2="150" stroke="#00FF88" stroke-width="3"/>
            
            <rect x="25" y="150" width="90" height="40" rx="8" fill="rgba(0,0,0,0.6)" stroke="#00FF88" stroke-width="3"/>
            <text x="70" y="175" fill="#00FF88" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">IF TRUE</text>
            
            <rect x="135" y="150" width="90" height="40" rx="8" fill="rgba(0,0,0,0.6)" stroke="#00FF88" stroke-width="3"/>
            <text x="180" y="175" fill="#00FF88" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">IF FALSE</text>

            <line x1="70" y1="190" x2="40" y2="250" stroke="#00FF88" stroke-width="3"/>
            <line x1="70" y1="190" x2="100" y2="250" stroke="#00FF88" stroke-width="3"/>
            <circle cx="40" cy="250" r="14" fill="#00FF88"/>
            <circle cx="100" cy="250" r="14" fill="#00FF88"/>
            <circle cx="180" cy="230" r="14" fill="#00FF88"/>
          </g>

          <!-- VS Divider -->
          <line x1="300" y1="80" x2="300" y2="520" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 8" opacity="0.3"/>
          <circle cx="300" cy="300" r="30" fill="#000000" stroke="#00D4FF" stroke-width="3"/>
          <text x="300" y="308" fill="#FFFFFF" font-family="'Orbitron', sans-serif" font-size="18" font-weight="900" text-anchor="middle">VS</text>

          <!-- Bottom Up Neural Network -->
          <g transform="translate(320, 80)">
            <!-- Layer 1 -->
            <circle cx="40" cy="80" r="14" fill="#00D4FF"/>
            <circle cx="40" cy="160" r="14" fill="#00D4FF"/>
            <circle cx="40" cy="240" r="14" fill="#00D4FF"/>
            <circle cx="40" cy="320" r="14" fill="#00D4FF"/>

            <!-- Layer 2 -->
            <circle cx="130" cy="120" r="16" fill="#00FF88"/>
            <circle cx="130" cy="200" r="16" fill="#00FF88"/>
            <circle cx="130" cy="280" r="16" fill="#00FF88"/>

            <!-- Layer 3 Output -->
            <circle cx="210" cy="160" r="18" fill="#FFFFFF" stroke="#00D4FF" stroke-width="4"/>
            <circle cx="210" cy="240" r="18" fill="#FFFFFF" stroke="#00D4FF" stroke-width="4"/>

            <!-- Synaptic connections -->
            <g stroke="#00D4FF" stroke-width="1.5" opacity="0.5">
              <line x1="40" y1="80" x2="130" y2="120"/><line x1="40" y1="80" x2="130" y2="200"/>
              <line x1="40" y1="160" x2="130" y2="120"/><line x1="40" y1="160" x2="130" y2="200"/><line x1="40" y1="160" x2="130" y2="280"/>
              <line x1="40" y1="240" x2="130" y2="120"/><line x1="40" y1="240" x2="130" y2="200"/><line x1="40" y1="240" x2="130" y2="280"/>
              <line x1="40" y1="320" x2="130" y2="200"/><line x1="40" y1="320" x2="130" y2="280"/>
              <line x1="130" y1="120" x2="210" y2="160"/><line x1="130" y1="120" x2="210" y2="240"/>
              <line x1="130" y1="200" x2="210" y2="160"/><line x1="130" y1="200" x2="210" y2="240"/>
              <line x1="130" y1="280" x2="210" y2="160"/><line x1="130" y1="280" x2="210" y2="240"/>
            </g>
          </g>
        </svg>
        
  </div>

  <div class="bottom-bar">
    <span class="hub-url">🌐 academichubfaiz.in</span>
    <span class="sep">|</span>
    <span>PHILOSOPHY OF ARTIFICIAL INTELLIGENCE</span>
    <span class="sep">|</span>
    <span>100% FREE STUDY PORTAL</span>
  </div>
</body>
</html>
