<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@700;800;900&family=Gayathri:wght@700;900&family=Manjari:wght@700;900&family=Noto+Sans+Malayalam:wght@700;900&family=Orbitron:wght@800;900&family=Outfit:wght@700;900&family=Space+Grotesk:wght@700&family=Syne:wght@800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: linear-gradient(135deg, #1F0505 0%, #380A0A 50%, #520F0F 100%);
      font-family: 'Anek Malayalam', 'Orbitron', sans-serif;
      color: #FFFFFF;
      position: relative;
    }
    
    /* Background subtle grid */
    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Top Left Channel Banner Pill */
    .top-bar {
      position: absolute;
      top: 36px;
      left: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }
    .channel-tag {
      background: rgba(0, 0, 0, 0.6);
      border: 1.5px solid #FF2A2A;
      padding: 8px 18px;
      border-radius: 30px;
      font-family: 'Orbitron', 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
    }
    .channel-tag .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #FF2A2A;
      box-shadow: 0 0 10px #FF2A2A;
    }
    .syllabus-badge {
      background: rgba(56, 10, 10, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 30px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #FF8C00;
      letter-spacing: 0.5px;
    }

    /* Main Left Content Panel */
    .content-panel {
      position: absolute;
      top: 110px;
      left: 56px;
      width: 660px;
      z-index: 10;
    }
    .module-badge {
      display: inline-block;
      font-family: 'Orbitron', 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2.5px;
      color: #FF8C00;
      text-transform: uppercase;
      margin-bottom: 14px;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    .title-malayalam {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.14;
      color: #FFFFFF;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 0 35px rgba(0,0,0,0.6);
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }
    .title-english {
      font-family: 'Outfit', 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #FF2A2A;
      line-height: 1.25;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      margin-bottom: 26px;
      border-left: 4px solid #FF8C00;
      padding-left: 14px;
    }
    .features-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .feature-pill {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 6px 14px;
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #E2E8F0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .feature-pill span {
      color: #FF2A2A;
    }

    /* Right Artwork Container */
    .art-container {
      position: absolute;
      top: 50px;
      right: 30px;
      width: 580px;
      height: 620px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    /* Bottom Status Bar */
    .bottom-bar {
      position: absolute;
      bottom: 26px;
      left: 56px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      color: #94A3B8;
      z-index: 10;
    }
    .bottom-bar .hub-url {
      color: #FFFFFF;
      font-weight: 800;
      letter-spacing: 0.8px;
    }
    .bottom-bar .sep {
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>

  <div class="top-bar">
    <div class="channel-tag">
      <div class="dot"></div>
      ACADEMIC HUB
    </div>
    <div class="syllabus-badge">CALICUT UNIVERSITY FYUGP</div>
    <div class="syllabus-badge" style="color: #FF2A2A;">EXISTENTIAL RISK</div>
  </div>

  <div class="content-panel">
    <div class="module-badge">MODULE 04 · CHAPTER 2</div>
    <h1 class="title-malayalam">എഐ മനുഷ്യരാശിക്ക്<br>ഭീഷണിയാകുമോ?</h1>
    <div class="title-english">Superintelligence & The Alignment Problem</div>
    <div class="features-row">
      <div class="feature-pill"><span>✓</span> സിലബസ് വിശകലനം</div>
      <div class="feature-pill"><span>✓</span> സമഗ്ര മാസ്റ്റർക്ലാസ്</div>
      <div class="feature-pill"><span>✓</span> പരീക്ഷാ ടിപ്പുകൾ</div>
    </div>
  </div>

  <div class="art-container">
    
        <svg viewBox="0 0 600 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FF2A2A" stop-opacity="0.9"/>
              <stop offset="60%" stop-color="#FF8C00" stop-opacity="0.4"/>
              <stop offset="100%" stop-color="#000" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="300" cy="300" r="260" fill="url(#eyeGlow)"/>

          <!-- Colossal Red Cybernetic Superintelligence Eye -->
          <path d="M 80 300 C 180 150 420 150 520 300 C 420 450 180 450 80 300 Z" fill="#000000" stroke="#FF2A2A" stroke-width="6"/>
          <circle cx="300" cy="300" r="100" fill="#1A0000" stroke="#FF8C00" stroke-width="4"/>
          <circle cx="300" cy="300" r="60" fill="#FF2A2A"/>
          <circle cx="300" cy="300" r="25" fill="#FFFFFF"/>

          <!-- Pupil Targeting Reticle -->
          <circle cx="300" cy="300" r="140" fill="none" stroke="#FF2A2A" stroke-width="2" stroke-dasharray="12 12"/>
          <line x1="120" y1="300" x2="480" y2="300" stroke="#FF2A2A" stroke-width="2" stroke-dasharray="6 6"/>
          <line x1="300" y1="120" x2="300" y2="480" stroke="#FF2A2A" stroke-width="2" stroke-dasharray="6 6"/>

          <!-- Planet Earth small in corner at risk -->
          <circle cx="440" cy="420" r="40" fill="#003366" stroke="#0099FF" stroke-width="3"/>
          <path d="M 420 410 Q 435 430 455 425 Q 460 410 440 405 Z" fill="#2E8B57"/>
          <path d="M 435 440 Q 450 450 460 440 Z" fill="#2E8B57"/>

          <!-- Warning Box -->
          <rect x="180" y="490" width="240" height="36" rx="8" fill="#1F0000" stroke="#FF2A2A" stroke-width="3"/>
          <text x="300" y="515" fill="#FFFFFF" font-family="'Orbitron', sans-serif" font-size="15" font-weight="900" text-anchor="middle">EXISTENTIAL RISK</text>
        </svg>
        
  </div>

  <div class="bottom-bar">
    <span class="hub-url">🌐 academichubfaiz.in</span>
    <span class="sep">|</span>
    <span>PHILOSOPHY OF ARTIFICIAL INTELLIGENCE</span>
    <span class="sep">|</span>
    <span>100% FREE STUDY PORTAL</span>
  </div>
</body>
</html>
