<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Chettan+2:wght@600;700;800&family=Manjari:wght@700&display=swap" rel="stylesheet">
<style>
  body {
    background: #00133d;
    color: white;
    margin: 0;
    padding: 30px;
  }
  .test-box {
    margin-bottom: 25px;
  }
  .font-name {
    font-family: sans-serif;
    font-size: 14px;
    color: #ffc837;
    margin-bottom: 8px;
  }
  .baloo-700 {
    font-family: 'Baloo Chettan 2', sans-serif;
    font-size: 80px;
    font-weight: 700;
  }
  .baloo-800 {
    font-family: 'Baloo Chettan 2', sans-serif;
    font-size: 80px;
    font-weight: 800;
  }
  .manjari {
    font-family: 'Manjari', sans-serif;
    font-size: 80px;
    font-weight: 700;
  }
</style>
<style id="hub-universal-protection">
*, *::before, *::after {
  -webkit-touch-callout: none !important;
  -webkit-user-select: none !important;
  -khtml-user-select: none !important;
  -moz-user-select: none !important;
  -ms-user-select: none !important;
  user-select: none !important;
}
img {
  -webkit-user-drag: none !important;
  user-drag: none !important;
}
@media print {
  html, body {
    display: none !important;
    visibility: hidden !important;
  }
}
a[download], button[download], [download], .btn-download, .download, #downloadBtn, #saveBtn, .save {
  display: none !important;
}
</style>
</head>
<body>
  <div class="test-box">
    <div class="font-name">Baloo Chettan 2 Bold (700)</div>
    <div class="baloo-700">എന്റെ ഗുരുനാഥനെ</div>
    <div class="baloo-700" style="color: #ffc837;">ഓർക്കുമ്പോൾ</div>
  </div>
  <div class="test-box">
    <div class="font-name">Baloo Chettan 2 ExtraBold (800)</div>
    <div class="baloo-800">എന്റെ ഗുരുനാഥനെ</div>
    <div class="baloo-800" style="color: #ffc837;">ഓർക്കുമ്പോൾ</div>
  </div>
<script id="hub-universal-protection-script">
(function() {
  window.addEventListener('contextmenu', function(e) { e.preventDefault(); e.stopPropagation(); return false; }, true);
  window.addEventListener('keydown', function(e) {
    var k = e.key ? e.key.toLowerCase() : '';
    if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'u', 'c', 'a', 'x'].indexOf(k) !== -1) {
      e.preventDefault(); e.stopPropagation(); return false;
    }
    if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'j', 'c'].indexOf(k) !== -1)) {
      e.preventDefault(); e.stopPropagation(); return false;
    }
  }, true);
  window.addEventListener('dragstart', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('copy', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('cut', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('selectstart', function(e) { e.preventDefault(); return false; }, true);
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; }, true);
})();
</script>
</body>
</html>
