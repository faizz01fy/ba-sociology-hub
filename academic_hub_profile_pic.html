<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=Cinzel:wght@700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 800px;
    height: 800px;
    background: #060913;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
  }
  .canvas {
    width: 800px;
    height: 800px;
    position: relative;
    background: radial-gradient(circle at 50% 38%, #1e1b4b 0%, #0f172a 45%, #050811 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  /* Outer safe circular guide ring */
  .safe-ring {
    position: absolute;
    width: 740px;
    height: 740px;
    border-radius: 50%;
    border: 2px solid rgba(129, 140, 248, 0.18);
    box-shadow: inset 0 0 60px rgba(99, 102, 241, 0.08), 0 0 80px rgba(79, 70, 229, 0.15);
  }
  .accent-orbit {
    position: absolute;
    width: 700px;
    height: 700px;
    border-radius: 50%;
    border: 1.5px dashed rgba(168, 85, 247, 0.22);
  }
  .glow-backdrop {
    position: absolute;
    width: 380px;
    height: 380px;
    top: 140px;
    background: radial-gradient(circle, rgba(124, 58, 237, 0.35) 0%, rgba(59, 130, 246, 0.2) 50%, transparent 72%);
    filter: blur(28px);
    border-radius: 50%;
    z-index: 1;
  }
  .crest-container {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: -20px;
  }
  .emblem-svg {
    width: 250px;
    height: 250px;
    filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.65)) drop-shadow(0 0 35px rgba(129, 140, 248, 0.45));
  }
  .brand-title {
    margin-top: 24px;
    font-size: 50px;
    font-weight: 900;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 12px;
    text-shadow: 0 4px 16px rgba(0, 0, 0, 0.8), 0 0 30px rgba(168, 85, 247, 0.4);
  }
  .brand-title .hub-pill {
    background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
    color: #ffffff;
    padding: 2px 16px;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(124, 58, 237, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.4);
  }
  .brand-sub {
    margin-top: 10px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #93c5fd;
    opacity: 0.95;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-sub::before, .brand-sub::after {
    content: "";
    width: 24px;
    height: 1.5px;
    background: linear-gradient(90deg, transparent, #38bdf8);
  }
  .brand-sub::after {
    background: linear-gradient(90deg, #38bdf8, transparent);
  }
  .star-badge {
    position: absolute;
    top: 55px;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(147, 197, 253, 0.35);
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #facc15;
    text-transform: uppercase;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    z-index: 3;
  }
</style>
<style id="hub-universal-protection">
*, *::before, *::after {
  -webkit-touch-callout: none !important;
  -webkit-user-select: none !important;
  -khtml-user-select: none !important;
  -moz-user-select: none !important;
  -ms-user-select: none !important;
  user-select: none !important;
}
img {
  -webkit-user-drag: none !important;
  user-drag: none !important;
}
@media print {
  html, body {
    display: none !important;
    visibility: hidden !important;
  }
}
a[download], button[download], [download], .btn-download, .download, #downloadBtn, #saveBtn, .save {
  display: none !important;
}
</style>
</head>
<body>
<div class="canvas">
  <div class="safe-ring"></div>
  <div class="accent-orbit"></div>
  <div class="glow-backdrop"></div>
  
  <div class="star-badge">★ CALICUT UNIVERSITY ★</div>

  <div class="crest-container">
    <svg class="emblem-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fef08a" />
          <stop offset="50%" stop-color="#f59e0b" />
          <stop offset="100%" stop-color="#d97706" />
        </linearGradient>
        <linearGradient id="indigoShield" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#a855f7" />
          <stop offset="50%" stop-color="#6366f1" />
          <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>
        <linearGradient id="bookPage" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="100%" stop-color="#cbd5e1" />
        </linearGradient>
      </defs>

      <!-- Outer Diamond Shield -->
      <path d="M100 8 L185 50 L185 115 C185 158 148 188 100 198 C52 188 15 158 15 115 L15 50 Z" 
            fill="url(#indigoShield)" fill-opacity="0.22" stroke="url(#indigoShield)" stroke-width="3.5" />
      
      <!-- Inner Shield Ring -->
      <path d="M100 20 L172 56 L172 112 C172 148 141 174 100 183 C59 174 28 148 28 112 L28 56 Z" 
            stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" stroke-dasharray="4 4" />

      <!-- Open Book Foundation -->
      <path d="M100 138 C115 125 140 123 162 128 L162 154 C140 149 115 151 100 164 C85 151 60 149 38 154 L38 128 C60 123 85 125 100 138 Z" 
            fill="url(#bookPage)" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.5))" />
      <path d="M100 138 L100 164" stroke="#475569" stroke-width="2.5" />

      <!-- Graduation Cap Mortarboard (3D perspective) -->
      <polygon points="100,42 165,68 100,94 35,68" fill="url(#goldCap)" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.45))" />
      <polygon points="100,94 165,68 152,80 100,103 48,80 35,68" fill="#b45309" />
      <path d="M60 84 L60 112 C60 124 100 132 100 132 C100 132 140 124 140 112 L140 84" 
            fill="#d97706" stroke="#fef08a" stroke-width="1.5" />

      <!-- Cap Tassel -->
      <circle cx="100" cy="68" r="4.5" fill="#fef08a" />
      <path d="M100 68 Q152 75 154 105" stroke="#fef08a" stroke-width="3" fill="none" stroke-linecap="round" />
      <polygon points="151,105 157,105 159,122 149,122" fill="url(#goldCap)" />

      <!-- Central Knowledge Beacon Sparks -->
      <circle cx="100" cy="116" r="3" fill="#ffffff" filter="drop-shadow(0 0 6px #60a5fa)" />
      <circle cx="70" cy="112" r="2" fill="#93c5fd" />
      <circle cx="130" cy="112" r="2" fill="#93c5fd" />
    </svg>

    <div class="brand-title">
      <span>Academic</span>
      <span class="hub-pill">Hub</span>
    </div>
    
    <div class="brand-sub">Notes · MCQs · Audio</div>
  </div>
</div>
<script id="hub-universal-protection-script">
(function() {
  window.addEventListener('contextmenu', function(e) { e.preventDefault(); e.stopPropagation(); return false; }, true);
  window.addEventListener('keydown', function(e) {
    var k = e.key ? e.key.toLowerCase() : '';
    if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'u', 'c', 'a', 'x'].indexOf(k) !== -1) {
      e.preventDefault(); e.stopPropagation(); return false;
    }
    if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'j', 'c'].indexOf(k) !== -1)) {
      e.preventDefault(); e.stopPropagation(); return false;
    }
  }, true);
  window.addEventListener('dragstart', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('copy', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('cut', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('selectstart', function(e) { e.preventDefault(); return false; }, true);
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; }, true);
})();
</script>
</body>
</html>
