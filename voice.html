      --primary-dark: #b91c1c;

      --card-bg: #ffffff;

      --radius: 16px;

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

      font-family: 'Plus Jakarta Sans', 'Noto Sans Malayalam', -apple-system, sans-serif;

      min-height: 100vh;

      padding-bottom: 90px;

    a { color: inherit; text-decoration: none; }

    button { font-family: inherit; cursor: pointer; }



    /* Top Navigation */

    .top-navbar {

      background: rgba(255, 255, 255, 0.95);

      backdrop-filter: blur(12px);

      border-bottom: 1px solid var(--border);

      position: sticky;

      top: 0;

      z-index: 100;

      padding: 12px 20px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 16px;

    }

    .nav-left {

      display: flex;

      align-items: center;

      gap: 14px;

    }

    .back-btn {

      display: inline-flex;

      align-items: center;

      gap: 6px;

      padding: 8px 14px;

      border-radius: 10px;

      background: #f1f5f9;

      color: #334155;

      font-weight: 700;

      font-size: 13.5px;

      transition: all 0.2s;

    }

    .back-btn:hover {

      background: #e2e8f0;

      color: #0f172a;

    }

    .brand-title {

      display: flex;

      align-items: center;

      gap: 8px;

      font-weight: 800;

      font-size: 17px;

      color: #0f172a;

    }

    .brand-icon {

      display: inline-grid;

      place-items: center;

      width: 32px;

      height: 32px;

      border-radius: 9px;

      background: var(--primary);

      color: #fff;

      font-size: 14px;

    }



    .search-bar-wrap {

      flex: 1;

      max-width: 360px;

      position: relative;

    }

    .search-input {

      width: 100%;

      padding: 9px 14px 9px 36px;

      border-radius: 10px;

      border: 1.5px solid var(--border);

      font-size: 13.5px;

      background: #f8fafc;

      transition: all 0.2s;

    }

    .search-input:focus {

      outline: none;

      border-color: var(--primary);

      background: #fff;

      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);

    }

    .search-icon {

      position: absolute;

      left: 12px;

      top: 50%;

      transform: translateY(-50%);

      color: #94a3b8;

      font-size: 14px;

      pointer-events: none;

    }



    /* Container */

    .container {

      max-width: 1180px;

      margin: 24px auto;

      padding: 0 16px;

    }



    /* Subject Switcher Tabs Bar */

    .subject-tabs-scroll {

      display: flex;

      align-items: center;

      gap: 10px;

      overflow-x: auto;

      overflow-y: hidden;

      padding: 4px 4px 10px 4px;

      margin-bottom: 24px;

      scrollbar-width: thin;

      -webkit-overflow-scrolling: touch;

      scroll-behavior: smooth;

    .subject-tabs-scroll::-webkit-scrollbar { height: 5px; }

    .subject-tabs-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }



    .subj-tab-btn {

      align-items: center;

      gap: 9px;

      padding: 10px 18px;

      border: 2px solid var(--border);

      background: #ffffff;

      color: #1e293b;

      font-size: 14px;

      font-weight: 800 !important;

      white-space: nowrap !important;

      flex: 0 0 auto !important;

      flex-shrink: 0 !important;

      min-width: max-content !important;

      transition: all 0.22s ease;

      cursor: pointer;

      user-select: none;

      text-decoration: none;

      letter-spacing: -0.01em;

    }

    .subj-tab-btn:hover {

      transform: translateY(-2px);

      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);

    }

    .subj-tab-icon {

      font-size: 16px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

    .subj-tab-title {

    .subj-badge {

      text-align: center;

      line-height: 1.2;

    /* Active Subject Hero Card */

    .hero-banner {

      background: #ffffff;

      border: 1px solid var(--border);

      border-radius: var(--radius);

      padding: 24px 28px;

      margin-bottom: 28px;

      box-shadow: var(--shadow-sm);

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

      flex-wrap: wrap;

    }

    .hero-title-group h1 {

      font-size: 24px;

      font-weight: 800;

      color: #0f172a;

      display: flex;

      align-items: center;

      gap: 10px;

      margin-bottom: 6px;

    }

    .hero-title-group p {

      color: var(--text-muted);

      font-size: 14.5px;

      line-height: 1.5;

    }

    .hero-stats {

      display: flex;

      gap: 14px;

    }

    .hero-stat-pill {

      background: #f8fafc;

      border: 1px solid var(--border);

      padding: 10px 16px;

      border-radius: 12px;

      text-align: center;

    }

    .hero-stat-pill strong {

      display: block;

      font-size: 20px;

      color: var(--primary);

      font-weight: 800;

    }

    .hero-stat-pill span {

      font-size: 11.5px;

      color: #64748b;

      font-weight: 600;

      text-transform: uppercase;

      letter-spacing: 0.5px;

    }



    /* Modules & Chapters */

    .module-group {

      margin-bottom: 32px;

    }

    .module-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 12px 18px;

      background: #f1f5f9;

      border: 1px solid #e2e8f0;

      border-radius: 12px;

      margin-bottom: 14px;

    }

    .module-title {

      font-weight: 800;

      font-size: 15px;

      color: #1e293b;

      display: flex;

      align-items: center;

      gap: 8px;

    }

    .module-count {

      font-size: 12px;

      font-weight: 700;

      color: #64748b;

      background: #fff;

      padding: 3px 9px;

      border-radius: 999px;

    }



    /* Chapter Grid */

    .chapters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
      align-items: stretch;
    }



    /* Chapter Card */

    

    .chapter-badge-chip {

      display: inline-block;

      font-size: 11px;

      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: 0.5px;

      color: #dc2626;

      background: #fef2f2;

      border: 1px solid #fecaca;

      padding: 2px 8px;

      border-radius: 6px;

      margin-bottom: 5px;

    }



    

    /* Screen Wake Lock Button in Navbar - Blue blinking styling */

    .wake-lock-btn {

      display: inline-flex;

      align-items: center;

      gap: 7px;

      padding: 7px 15px;

      border-radius: 999px;

      border: 1.5px solid #3b82f6;

      background: #eff6ff;

      color: #1d4ed8;

      font-size: 12.5px;

      font-weight: 700;

      cursor: pointer;

      transition: all 0.25s ease;

      white-space: nowrap;

      box-shadow: 0 1px 3px rgba(37, 99, 235, 0.15);

      animation: blueIdleBlink 2.5s infinite ease-in-out;

    }

    .wake-lock-btn:hover {

      background: #dbeafe;

      border-color: #2563eb;

      color: #1e40af;

    }

    .wake-lock-btn .wake-icon {

      font-size: 14px;

      transition: transform 0.2s;

    }

    .wake-lock-btn.active {

      background: #2563eb !important;

      border-color: #1d4ed8 !important;

      color: #ffffff !important;

      box-shadow: 0 0 16px rgba(37, 99, 235, 0.6) !important;

      animation: bluePulseBlink 1.4s infinite ease-in-out !important;

    }

    .wake-lock-btn.active .wake-icon {

      filter: drop-shadow(0 0 6px #93c5fd);

      animation: bulbGlowBlue 1.2s infinite ease-in-out;

    }

    @keyframes blueIdleBlink {

      0%, 100% { border-color: #93c5fd; box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.2); }

      50% { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25); background: #dbeafe; }

    }

    @keyframes bluePulseBlink {

      0% {

        background-color: #2563eb;

        box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7), 0 0 12px rgba(37, 99, 235, 0.5);

      }

      50% {

        background-color: #1d4ed8;

        box-shadow: 0 0 0 6px rgba(37, 99, 235, 0), 0 0 22px rgba(59, 130, 246, 0.9);

      }

      100% {

        background-color: #2563eb;

        box-shadow: 0 0 0 0 rgba(37, 99, 235, 0), 0 0 12px rgba(37, 99, 235, 0.5);

      }

    }

    @keyframes bulbGlowBlue {

      0%, 100% { transform: scale(1); opacity: 1; }

      50% { transform: scale(1.25); opacity: 0.95; }

    }



    /* Chapter Study Notes Box */

    .chapter-notes-box {

      margin-top: 12px;

      border: 1px solid #e2e8f0;

      border-radius: 10px;

      background: #f8fafc;

      overflow: hidden;

      transition: all 0.2s ease;

    .notes-summary {

      font-weight: 700;

      color: #1e293b;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 8px;

      user-select: none;

      list-style: none;

    .notes-title-wrap {

      gap: 7px;

    .notes-chevron {

    .notes-content {

      border-top: 1px solid #e2e8f0;

      font-size: 13px;

      line-height: 1.6;

      color: #334155;

    }

    .notes-list {

      margin: 0;

      gap: 8px;

    /* Voice Mode Audio Player UI inside Card */

    }

    .vpp-wave-bar {

      display: flex;

      align-items: center;

      gap: 14px;

      background: rgba(255, 255, 255, 0.05);

      padding: 10px 14px;

      border-radius: 10px;

      border: 1px solid rgba(255, 255, 255, 0.08);

    }

    .vpp-equalizer {

      display: flex;

      align-items: flex-end;

      gap: 3.5px;

      height: 26px;

      flex-shrink: 0;

    }

    .vpp-equalizer span {

      width: 4px;

      background: #ef4444;

      border-radius: 2px;

      animation: eqWave 1.2s infinite ease-in-out;

    }

    .vpp-equalizer span:nth-child(1) { height: 35%; animation-delay: 0.1s; }

    .vpp-equalizer span:nth-child(2) { height: 85%; animation-delay: 0.3s; }

    .vpp-equalizer span:nth-child(3) { height: 60%; animation-delay: 0.15s; }

    .vpp-equalizer span:nth-child(4) { height: 100%; animation-delay: 0.4s; }

    .vpp-equalizer span:nth-child(5) { height: 75%; animation-delay: 0.25s; }

    .vpp-equalizer span:nth-child(6) { height: 45%; animation-delay: 0.35s; }

    .vpp-equalizer.paused span {

      animation-play-state: paused !important;

      height: 25% !important;

      opacity: 0.5;

    }

    @keyframes eqWave {

      0%, 100% { transform: scaleY(0.3); }

      50% { transform: scaleY(1); }

      font-weight: 700;

    }

      gap: 8px;

      flex-wrap: wrap;

    }

    .vpp-btn-pause, .vpp-btn-video, .vpp-btn-close {

      font-size: 12px;

      padding: 6px 12px;

      align-items: center;

      background: #b91c1c;

    }

    .vpp-btn-video {

    .vpp-btn-close {

      padding: 6px 10px;

    /* Sticky Bottom Audio Bar */

    .bottom-sticky-bar {

      position: fixed;

      bottom: 0;

      left: 0;

      right: 0;

      background: rgba(15, 23, 42, 0.95);

      backdrop-filter: blur(16px);

      color: #ffffff;

      padding: 12px 24px;

      align-items: center;

      justify-content: space-between;

      gap: 16px;

      box-shadow: 0 -4px 20px rgba(0,0,0,0.25);

    .bottom-sticky-bar.visible {

      display: flex;

      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);

    }

    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }



    .sticky-info {

      display: flex;

      align-items: center;

      gap: 12px;

      min-width: 0;

    }

    .sticky-icon {

      width: 36px;

      height: 36px;

      border-radius: 9px;

      background: var(--primary);

      color: #fff;

      display: grid;

      place-items: center;

      font-size: 16px;

      flex-shrink: 0;

    }

    .sticky-texts {

      min-width: 0;

    }

    .sticky-title {

      font-size: 14px;

      font-weight: 700;

      overflow: hidden;

    }

    .sticky-sub {

  <script>

    (function () {

      const data = (typeof window.VOICE_EXPLANATIONS_DATA !== 'undefined') ? window.VOICE_EXPLANATIONS_DATA : ((typeof VOICE_EXPLANATIONS_DATA !== 'undefined') ? VOICE_EXPLANATIONS_DATA : {});



      // Helper to compute live video count accurately
      function getSubjectVideoCount(s) {
        if (!s) return 0;
        let liveCount = 0;
        if (Array.isArray(s.modules)) {
          s.modules.forEach(m => {
            (m.videos || []).forEach(v => {
              if (v && (v.youtubeId || v.audioSrc || v.audioUrl || v.videoUrl)) liveCount++;
            });
          });
        }
        return Math.max(Number(s.totalVideos) || 0, liveCount);
      }

      function getSubjectTotalChapters(s) {
        if (!s || !Array.isArray(s.modules)) return 0;
        return s.modules.reduce((acc, m) => acc + (m.videos || []).length, 0);
      }

      // Determine initial subject from URL query param `?subject=...`
      const urlParams = new URLSearchParams(window.location.search);
      let currentSlug = (urlParams.get('subject') || '').toLowerCase().trim();

      // All subjects displayed in strict descending order of video/lecture count
      const allSubjectSlugs = Object.keys(data).length > 0 ? Object.keys(data) : [
        'malayalam',
        'sociology',
        'philosophy-of-ai',
        'history-of-keralam',
        'fundamentals-of-ethics',
        'english',
        'philosophy-of-education',
        'development-issues-in-indian-economy',
        'microeconomic-foundation',
        'mathematics',
        'hindi',
        'arabic'
      ];

      // Sort ALL subject tabs in descending order of lecture count (with secondary descending chapter count)
      const activeSubjects = allSubjectSlugs.slice().sort((a, b) => {
        const countA = getSubjectVideoCount(data[a]);
        const countB = getSubjectVideoCount(data[b]);
        if (countB !== countA) return countB - countA;
        const totA = getSubjectTotalChapters(data[a]);
        const totB = getSubjectTotalChapters(data[b]);
        if (totB !== totA) return totB - totA;
        return (data[a]?.name || a).localeCompare(data[b]?.name || b);
      });

      // Fallback if slug not found or empty
      if (!currentSlug || !data[currentSlug]) {
        currentSlug = activeSubjects[0] || 'sociology';
      }

      const subjectTabsContainer = document.getElementById('subject-tabs');
      const heroSubjectName = document.getElementById('hero-subject-name');
      const heroSubjectDesc = document.getElementById('hero-subject-desc');
      const statVideoCount = document.getElementById('stat-video-count');
      const statModuleCount = document.getElementById('stat-module-count');
      const chaptersContainer = document.getElementById('chapters-container');
      const searchInput = document.getElementById('chapter-search');

      const stickyBar = document.getElementById('sticky-audio-bar');
      const stickyTitle = document.getElementById('sticky-title');
      const stickySub = document.getElementById('sticky-sub');
      const stickyYtLink = document.getElementById('sticky-yt-link');
      const stickyClose = document.getElementById('sticky-close');

      let currentPlayingCard = null;

      // Smooth center active tab for mobile & desktop touch scrolling
      function centerActiveTab(btn) {
        if (!btn || !subjectTabsContainer) return;
        try {
          btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } catch (e) {
          try {
            const containerRect = subjectTabsContainer.getBoundingClientRect();
            const btnRect = btn.getBoundingClientRect();
            const offset = btnRect.left - containerRect.left - (containerRect.width / 2) + (btnRect.width / 2);
            subjectTabsContainer.scrollBy({ left: offset, behavior: 'smooth' });
          } catch (err) {}
        }
      }

      // Render Subject Tab Buttons in Descending Order with Vibrant Colors & Blinking
      function renderSubjectTabs() {
        subjectTabsContainer.innerHTML = '';
        activeSubjects.forEach(slug => {
          const s = data[slug];
          if (!s) return;
          const btn = document.createElement('button');
          btn.type = 'button';
          const videoCount = getSubjectVideoCount(s);
          const isCurrent = (slug === currentSlug);

          // All inactive tabs have distinct vibrant interval blinking alert; active tab pulses with glowing aura
          btn.className = 'subj-tab-btn subj-tab--' + slug + ' subj-tab--blink' + (isCurrent ? ' active' : '');
          btn.dataset.slug = slug;
          btn.setAttribute('role', 'tab');
          btn.setAttribute('aria-selected', isCurrent ? 'true' : 'false');
          btn.innerHTML = `<span class="subj-tab-icon">${s.badge || '📚'}</span> <span class="subj-tab-title">${s.name}</span> <span class="subj-badge">${videoCount}</span>`;

          btn.addEventListener('click', () => {
            if (currentSlug !== slug) {
              currentSlug = slug;
              const newUrl = new URL(window.location);
              newUrl.searchParams.set('subject', slug);
              window.history.pushState({}, '', newUrl);
              updateUI();
            }
          });

          subjectTabsContainer.append(btn);
        });
      }



                  // Render Chapters for Selected Subject

      function renderChapters(filterQuery = '') {

        const subject = data[currentSlug];

        if (!subject) return;



        heroSubjectName.innerHTML = `${subject.badge} ${subject.name}`;



        const hasEnglish = (subject.modules || []).some(mod => (mod.videos || []).some(v => v.language === 'English'));
        const isBilingualSubject = (currentSlug === 'sociology') || (subject.modules || []).some(mod => (mod.videos || []).some(v => (v.language && v.language.includes('English') && v.language.includes('Malayalam'))));
        const isHindiSubject = (currentSlug === 'hindi') || (subject.name && subject.name.toLowerCase().includes('hindi'));
        const isArabicSubject = (currentSlug === 'arabic') || (subject.name && subject.name.toLowerCase().includes('arabic'));

        const heroChannelBadge = document.querySelector('.hero-channel-badge');

        if (isHindiSubject) {
          heroChannelBadge.innerHTML = `<span class="pulse-dot"></span> Hindi Voice Classes &amp; Video Explanations`;
          heroSubjectDesc.textContent = 'Chapter-by-chapter embedded Hindi voice lectures and video explanations organized by module';
        } else if (isArabicSubject) {
          heroChannelBadge.innerHTML = `<span class="pulse-dot"></span> Arabic Voice Classes &amp; Video Explanations`;
          heroSubjectDesc.textContent = 'Chapter-by-chapter embedded Arabic voice lectures and video explanations organized by module';
        } else {
          heroChannelBadge.innerHTML = `<span class="pulse-dot"></span> ${isBilingualSubject ? 'English &amp; Malayalam' : (hasEnglish ? 'Malayalam &amp; English' : 'Malayalam')} Voice Classes &amp; Video Explanations`;
          heroSubjectDesc.textContent = hasEnglish
            ? 'Watch Malayalam and English video explanations by module. English editions are highlighted in blue.'
            : 'Chapter-by-chapter embedded Malayalam voice lectures organized by module';
        }

        

        let totalChs = 0;

        (subject.modules || []).forEach(m => totalChs += (m.videos || []).length);

        statVideoCount.textContent = (subject.totalVideos > 0) ? `${subject.totalVideos} Live Lectures` : `${totalChs} Chapters`;

        statModuleCount.textContent = (subject.modules || []).length;



        chaptersContainer.innerHTML = '';



        if (!subject.modules || subject.modules.length === 0) {

          chaptersContainer.innerHTML = `

            <div class="empty-state">

              <span class="empty-icon">🎧</span>

              <div class="empty-title">Voice Explanations Coming Soon</div>

              <div class="empty-desc">Malayalam voice lectures and chapter explanations for <strong>${subject.name}</strong> will be embedded here by chapter and module.</div>

            </div>`;

          return;

        }



        const query = filterQuery.trim().toLowerCase();

        let matchedTotal = 0;



        subject.modules.forEach((mod, modIdx) => {

          const filteredVids = (mod.videos || []).filter(v => {

            if (!query) return true;

            return (v.title && v.title.toLowerCase().includes(query)) ||

                   (v.chapter && v.chapter.toLowerCase().includes(query)) ||

                   (mod.moduleName && mod.moduleName.toLowerCase().includes(query)) ||

                   (v.language || 'Malayalam').toLowerCase().includes(query);

          });



          if (filteredVids.length === 0) return;

          matchedTotal += filteredVids.length;



          const group = document.createElement('section');

          group.className = 'module-group';



          const activeCount = filteredVids.filter(v => v.youtubeId || v.audioUrl).length;

          const totalCount = filteredVids.length;

          const countLabel = activeCount > 0 ? `${activeCount} Live / ${totalCount} Chapters` : `${totalCount} Chapters`;



          const mHeader = document.createElement('div');

          mHeader.className = 'module-header';

          mHeader.innerHTML = `

            <div class="module-title">

              <span style="color:var(--primary);font-size:14px;">📁</span>

              <span>${mod.moduleName}</span>

            </div>

            <div class="module-count">${countLabel}</div>

          `;

          group.append(mHeader);



          const grid = document.createElement('div');

          grid.className = 'chapters-grid';



          filteredVids.forEach(v => {

            const defaultLang = (currentSlug === 'hindi') ? 'Hindi' : ((currentSlug === 'arabic') ? 'Arabic' : ((currentSlug === 'sociology') ? 'English & Malayalam' : 'Malayalam'));
            const language = (currentSlug === 'sociology') ? 'English & Malayalam' : (v.language || defaultLang);

            const isEnglish = language === 'English';
            const isBilingual = (currentSlug === 'sociology') || language.includes('Bilingual') || (language.includes('English') && language.includes('Malayalam'));

            const card = document.createElement('article');

            card.className = 'chapter-card' + (isEnglish ? ' chapter-card--english' : '') + (isBilingual ? ' chapter-card--bilingual' : '');

            card.lang = isEnglish ? 'en' : (isBilingual ? 'en' : 'ml');

            card.dataset.language = language;

            card.dataset.ytid = v.youtubeId || '';

            const chRaw = (v.chapterNumber || '').trim();

            const chClean = chRaw.replace(/[^0-9.]/g, '');

            const chNorm = chClean.replace(/^0+([1-9])/, '$1');

            if (chClean) {

              card.id = 'ch-' + chClean.replace(/\./g, '-');

              card.dataset.chapter = chClean;

              card.dataset.chapterNorm = chNorm;

            }



            const hasActiveAudio = !!(v.youtubeId || v.audioUrl);

            const durationText = v.duration ? (String(v.duration).includes(':') ? v.duration : `${v.duration}m`) : 'Audio';

            const thumbUrl = v.thumbnail || (v.youtubeId ? `https://i.ytimg.com/vi/${v.youtubeId}/hqdefault.jpg` : '');

            const chBadge = v.chapterNumber ? `<span class="chapter-badge-chip">${v.chapterNumber}</span>` : '';

            let isHindi = (currentSlug === 'hindi' || (v.language && v.language.toLowerCase() === 'hindi'));
            let isArabic = (currentSlug === 'arabic' || (v.language && v.language.toLowerCase() === 'arabic'));
            let langHeading = 'Malayalam Video';
            let langClass = '';
            if (isHindi) {
              langHeading = '<strong>Hindi Video</strong>';
              langClass = ' hindi-video-heading';
            } else if (isArabic) {
              langHeading = '<strong>Arabic Video</strong>';
              langClass = ' arabic-video-heading';
            } else if (isEnglish) {
              langHeading = '<strong>English Video</strong>';
              langClass = ' english-video-heading';
            } else if (isBilingual) {
              langHeading = '<strong>English &amp; Malayalam Video</strong>';
              langClass = ' bilingual-video-heading';
            }
            const languageLabel = `<div class="video-language-label${langClass}" lang="en" aria-label="${language} Video">${langHeading}</div>`;

            const fullVideoUrl = v.videoUrl || (v.youtubeId ? `https://www.youtube.com/watch?v=${v.youtubeId}` : `https://www.youtube.com/results?search_query=${encodeURIComponent('Calicut University ' + (subject.name || '') + ' ' + (v.title || ''))}`);



            const thumbContent = thumbUrl 

              ? `<img class="thumb-img" src="${thumbUrl}" alt="${v.title}" loading="lazy" />`

              : `<div class="thumb-audio-icon" aria-hidden="true" style="font-size:36px;display:grid;place-items:center;height:100%;width:100%;background:linear-gradient(135deg,#f0fdf4,#dcfce7);color:#15803d;">🎙️</div>`;



            if (hasActiveAudio) {

              card.innerHTML = `

                ${languageLabel}

                <div class="card-top">

                  <div class="thumb-wrap${!thumbUrl ? ' thumb-wrap--audio' : ''}">

                    ${thumbContent}

                    <span class="play-overlay-icon" aria-hidden="true">▶</span>

                    <span class="thumb-duration">${durationText}</span>

                  </div>

                  <div class="card-info">

                    ${chBadge}

                    <div class="card-title" title="${v.title}">${v.title}</div>

                    <div class="card-sub">${v.chapter || mod.moduleName}</div>

                  </div>

                </div>



                <div class="card-actions">

                  <a class="btn-share-card" href="${fullVideoUrl}" target="_blank" rel="noopener noreferrer">▶ Watch Full Video</a>

                  <button type="button" class="btn-play-voice">

                    <span aria-hidden="true">▶</span> ${(v.videoUrl || v.youtubeId) ? 'Play Video' : 'Play Voice'}

                  </button>

                  <button type="button" class="btn-share-card" title="Share this chapter lecture">

                    <span aria-hidden="true">🔗</span> Share

                  </button>

                </div>



                <!-- Compact Embedded Voice Player Tab -->

                <div class="mini-player-tab">

                  <div class="player-frame-wrap" style="${v.youtubeId ? '' : 'display:none;'}">

                    <!-- iframe inserted on play -->

                  </div>



                  <div class="voice-podcast-player">

                    <div class="vpp-top">

                      <div class="vpp-mode-pill">

                        <span class="pulse-dot"></span> <span class="vpp-mode-text">Voice Lecture (Academic Hub)</span>

                      </div>

                      <div class="vpp-channel-tag"><span>🎙️ ${isBilingual ? 'English &amp; Malayalam' : language} Audio Class</span></div>

                    </div>

                    <div class="vpp-wave-bar">

                      <div class="vpp-equalizer">

                        <span></span><span></span><span></span><span></span><span></span><span></span>

                      </div>

                      <div>

                        <div class="vpp-status-text">Playing Voice Lecture...</div>

                        <div class="vpp-status-sub">${v.chapter || mod.moduleName}</div>

                      </div>

                    </div>

                    <div class="vpp-actions">

                      <button type="button" class="vpp-btn-pause" title="Pause / Resume playback">

                        <span class="vpp-pause-icon">⏸</span> Pause Voice

                      </button>

                      <button type="button" class="vpp-btn-skip vpp-skip-back" title="Rewind 10 seconds">

                        ↺ 10s

                      </button>

                      <button type="button" class="vpp-btn-skip vpp-skip-fwd" title="Skip 10 seconds">

                        10s ↻

                      </button>

                      <button type="button" class="vpp-speed-btn" title="Playback Speed">1.0x</button>

                      <button type="button" class="vpp-btn-close" title="Close player">✕ Close</button>

                    </div>

                  </div>

                </div>



                <!-- Chapter Study Notes & Exam Points -->

                ${v.studyPoints && v.studyPoints.length > 0 ? `

                <details class="chapter-notes-box" open>

                  <summary class="notes-summary">

                    <span class="notes-title-wrap">

                      <span aria-hidden="true">📝</span>

                      <span><strong>Study Notes &amp; Exam Points</strong> ${isEnglish ? '(English Edition)' : (isHindi ? '(हिन्दी संस्करण)' : (isArabic ? '(النسخة العربية)' : '(മലയാളം &amp; Eng)'))}</span>

                    </span>

                    <span class="notes-chevron" aria-hidden="true">▼</span>

                  </summary>

                  <div class="notes-content">

                    <ul class="notes-list">

                      ${v.studyPoints.map(p => `<li>${p}</li>`).join('')}

                    </ul>

                    ${v.examTip ? `

                    <div class="exam-tip-badge">

                      <strong>🎯 Exam Revision Highlight:</strong> ${v.examTip}

                    </div>` : ''}

                  </div>

                </details>` : ''}

              `;



              const playBtn = card.querySelector('.btn-play-voice');

              const playerTab = card.querySelector('.mini-player-tab');

              const frameWrap = card.querySelector('.player-frame-wrap');

              const pauseBtn = card.querySelector('.vpp-btn-pause');

              const closeBtn = card.querySelector('.vpp-btn-close');

              const equalizer = card.querySelector('.vpp-equalizer');

              const skipBackBtn = card.querySelector('.vpp-skip-back');

              const skipFwdBtn = card.querySelector('.vpp-skip-fwd');

              const speedBtn = card.querySelector('.vpp-speed-btn');



              if (!window._activeNativeAudio) {

                window._activeNativeAudio = new Audio();

              }

              const nativeAudio = window._activeNativeAudio;

              const speeds = [1.0, 1.25, 1.5, 0.75];

              let speedIndex = 0;

              let isAudioPaused = false;



              function sendCommandToYt(func, args) {

                const iframe = frameWrap.querySelector('iframe');

                if (iframe && iframe.contentWindow) {

                  iframe.contentWindow.postMessage(JSON.stringify({

                    event: 'command',

                    func: func,

                    args: args || ''

                  }), '*');

                }

              }



              // Mobile Lock-Screen & Background Playback Support (MediaSession API)

              function setupMediaSession() {

                if ('mediaSession' in navigator) {

                  const mediaArtwork = thumbUrl ? [

                    { src: thumbUrl, sizes: '512x512', type: 'image/jpeg' }

                  ] : [];

                  navigator.mediaSession.metadata = new MediaMetadata({

                    title: v.title,

                    artist: `${subject.name} (${language} Voice)`,

                    album: mod.moduleName,

                    artwork: mediaArtwork

                  });



                  navigator.mediaSession.setActionHandler('play', () => {

                    if (isAudioPaused) togglePause();

                  });

                  navigator.mediaSession.setActionHandler('pause', () => {

                    if (!isAudioPaused) togglePause();

                  });

                  navigator.mediaSession.setActionHandler('seekbackward', (details) => {

                    const skipTime = details.seekOffset || 10;

                    if (v.audioUrl) {

                      nativeAudio.currentTime = Math.max(0, nativeAudio.currentTime - skipTime);

                    }

                  });

                  navigator.mediaSession.setActionHandler('seekforward', (details) => {

                    const skipTime = details.seekOffset || 10;

                    if (v.audioUrl) {

                      nativeAudio.currentTime = Math.min(nativeAudio.duration || 9999, nativeAudio.currentTime + skipTime);

                    }

                  });

                }

              }



              function startPlayback() {

                // Automatically request screen wake lock to keep screen awake while listening

                if (typeof requestScreenWakeLock === 'function') {

                  requestScreenWakeLock();

                }



                // Deactivate any currently playing card

                if (currentPlayingCard && currentPlayingCard !== card) {

                  const prevTab = currentPlayingCard.querySelector('.mini-player-tab');

                  const prevFrame = currentPlayingCard.querySelector('.player-frame-wrap');

                  const prevPlayBtn = currentPlayingCard.querySelector('.btn-play-voice');

                  if (prevTab) prevTab.classList.remove('active');

                  if (prevFrame) {

                    prevFrame.innerHTML = '';

                    prevFrame.style.display = 'none';

                  }

                  if (prevPlayBtn) prevPlayBtn.innerHTML = '<span aria-hidden="true">▶</span> Play Voice';

                  currentPlayingCard.classList.remove('playing');

                }



                isAudioPaused = false;

                pauseBtn.innerHTML = '<span class="vpp-pause-icon">⏸</span> Pause Voice';

                equalizer.classList.remove('paused');



                if (v.audioUrl) {

                  if (frameWrap) {

                    frameWrap.innerHTML = '';

                    frameWrap.style.display = 'none';

                  }

                  nativeAudio.src = v.audioUrl;

                  nativeAudio.playbackRate = speeds[speedIndex];

                  nativeAudio.play().catch(e => console.warn('Audio play error:', e));

                  nativeAudio.onended = () => {

                    stopPlayback();

                  };

                } else if (v.youtubeId) {

                  if (nativeAudio) {

                    nativeAudio.pause();

                  }

                  if (frameWrap) {

                    frameWrap.style.display = 'block';

                    const currentOrigin = (window.location.origin && window.location.origin !== 'null' && !window.location.origin.startsWith('file:')) 

                      ? window.location.origin 

                      : 'https://academichubfaiz.in';

                    frameWrap.innerHTML = `

                      <iframe src="https://www.youtube-nocookie.com/embed/${v.youtubeId}?autoplay=1&enablejsapi=1&origin=${encodeURIComponent(currentOrigin)}&playsinline=1&rel=0&modestbranding=1"

                              title="${v.title}"

                              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

                              allowfullscreen>

                      </iframe>`;

                  }

                }



                playerTab.classList.add('active');

                card.classList.add('playing');

                playBtn.innerHTML = '<span aria-hidden="true">⏸</span> Playing...';

                currentPlayingCard = card;

                setupMediaSession();



                // Update Bottom Sticky Bar

                stickyTitle.textContent = v.title;

                stickySub.textContent = `🎙️ ${language} · ${subject.name} · ${v.chapter || mod.moduleName}`;

                if (stickyYtLink) {

                  stickyYtLink.href = v.youtubeId ? `https://www.youtube.com/watch?v=${v.youtubeId}` : '#';

                }

                stickyBar.classList.add('visible');

              }



              function stopPlayback() {

                if (nativeAudio) {

                  nativeAudio.pause();

                  nativeAudio.currentTime = 0;

                }

                if (frameWrap) {

                  frameWrap.innerHTML = '';

                  frameWrap.style.display = 'none';

                }

                playerTab.classList.remove('active');

                card.classList.remove('playing');

                playBtn.innerHTML = '<span aria-hidden="true">▶</span> Play Voice';

                if (currentPlayingCard === card) {

                  currentPlayingCard = null;

                  stickyBar.classList.remove('visible');

                }

              }



              function togglePause() {

                if (isAudioPaused) {

                  if (v.audioUrl) {

                    nativeAudio.play().catch(e => console.warn('Audio resume error:', e));

                  } else if (v.youtubeId) {

                    sendCommandToYt('playVideo');

                  }

                  isAudioPaused = false;

                  pauseBtn.innerHTML = '<span class="vpp-pause-icon">⏸</span> Pause Voice';

                  equalizer.classList.remove('paused');

                  playBtn.innerHTML = '<span aria-hidden="true">⏸</span> Playing...';

                } else {

                  if (v.audioUrl) {

                    nativeAudio.pause();

                  } else if (v.youtubeId) {

                    sendCommandToYt('pauseVideo');

                  }

                  isAudioPaused = true;

                  pauseBtn.innerHTML = '<span class="vpp-pause-icon">▶</span> Resume Voice';

                  equalizer.classList.add('paused');

                  playBtn.innerHTML = '<span aria-hidden="true">▶</span> Paused';

                }

              }



              const thumbWrap = card.querySelector('.thumb-wrap');

              if (thumbWrap) {

                thumbWrap.addEventListener('click', () => {

                  if (playerTab.classList.contains('active')) {

                    togglePause();

                  } else {

                    startPlayback();

                  }

                });

              }



              playBtn.addEventListener('click', () => {

                if (playerTab.classList.contains('active')) {

                  togglePause();

                } else {

                  startPlayback();

                }

              });



              pauseBtn.addEventListener('click', togglePause);



              if (skipBackBtn) {

                skipBackBtn.addEventListener('click', (e) => {

                  e.stopPropagation();

                  if (v.audioUrl) {

                    nativeAudio.currentTime = Math.max(0, nativeAudio.currentTime - 10);

                  }

                });

              }



              if (skipFwdBtn) {

                skipFwdBtn.addEventListener('click', (e) => {

                  e.stopPropagation();

                  if (v.audioUrl) {

                    nativeAudio.currentTime = Math.min(nativeAudio.duration || 9999, nativeAudio.currentTime + 10);

                  }

                });

              }



              if (speedBtn) {

                speedBtn.addEventListener('click', (e) => {

                  e.stopPropagation();

                  speedIndex = (speedIndex + 1) % speeds.length;

                  const newSpeed = speeds[speedIndex];

                  speedBtn.textContent = newSpeed + 'x';

                  if (v.audioUrl) {

                    nativeAudio.playbackRate = newSpeed;

                  } else if (v.youtubeId) {

                    const iframe = frameWrap.querySelector('iframe');

                    if (iframe && iframe.contentWindow) {

                      iframe.contentWindow.postMessage(JSON.stringify({

                        event: 'command',

                        func: 'setPlaybackRate',

                        args: [newSpeed]

                      }), '*');

                    }

                  }

                });

              }



              if (closeBtn) {

                closeBtn.addEventListener('click', stopPlayback);

              }



            } else {

              // Chapter without video yet - Clean structured audio card

              card.innerHTML = `

                ${languageLabel}

                <div class="card-top">

                  <div class="thumb-wrap thumb-wrap--audio">

                    <span class="thumb-audio-icon" aria-hidden="true">🎙️</span>

                    <span class="thumb-duration">${durationText}</span>

                  </div>

                  <div class="card-info">

                    ${chBadge}

                    <div class="card-title" title="${v.title}">${v.title}</div>

                    <div class="card-sub">${v.chapter || mod.moduleName}</div>

                  </div>

                </div>



                <div class="card-actions">

                  <a class="btn-share-card" href="${fullVideoUrl}" target="_blank" rel="noopener noreferrer">▶ Watch Full Video</a>

                  <div class="voice-scheduled-pill">

                    <span class="pulse-dot-scheduled"></span>

                    <span>${v.statusText || 'Voice Lecture in Production'}</span>

                  </div>

                  <button type="button" class="btn-share-card" title="Share this chapter lecture">

                    <span aria-hidden="true">🔗</span> Share

                  </button>

                </div>



                ${v.studyPoints && v.studyPoints.length > 0 ? `

                <details class="chapter-notes-box" open>

                  <summary class="notes-summary">

                    <span class="notes-title-wrap">

                      <span aria-hidden="true">📝</span>

                      <span><strong>Study Notes &amp; Exam Points</strong> ${isEnglish ? '(English Edition)' : (isHindi ? '(हिन्दी संस्करण)' : (isArabic ? '(النسخة العربية)' : '(മലയാളം &amp; Eng)'))}</span>

                    </span>

                    <span class="notes-chevron" aria-hidden="true">▼</span>

                  </summary>

                  <div class="notes-content">

                    <ul class="notes-list">

                      ${v.studyPoints.map(p => `<li>${p}</li>`).join('')}

                    </ul>

                    ${v.examTip ? `

                    <div class="exam-tip-badge">

                      <strong>🎯 Exam Revision Highlight:</strong> ${v.examTip}

                    </div>` : ''}

                  </div>

                </details>` : ''}

              `;

            }



            // Setup Share Button Listener with Full Module & Chapter Details

            const shareBtn = card.querySelector('.btn-share-card');

            if (shareBtn) {

              shareBtn.addEventListener('click', (e) => {

                e.stopPropagation();

                const chParam = chClean || chRaw;

                const modMatch = (mod.moduleName || '').match(/MODULE\s*0?(\d+)/i);

                const modClean = modMatch ? modMatch[1] : (modIdx + 1);

                const origin = (window.location.origin && window.location.origin !== 'null' && !window.location.origin.startsWith('file:')) 

                  ? window.location.origin 

                  : 'https://academichubfaiz.in';

                const path = window.location.pathname.includes('voice-explanation.html') ? window.location.pathname : '/voice-explanation.html';

                const shareUrl = `${origin}${path}?subject=${encodeURIComponent(currentSlug)}&mod=${encodeURIComponent(modClean)}&ch=${encodeURIComponent(chParam)}`;



                const chLabel = v.chapterNumber || ('Chapter ' + chClean);

                const modLabel = mod.moduleName || `Module ${modClean}`;

                const shareTitle = `${chLabel}: ${v.title} | ${subject.name}`;

                const shareText = `🎓 Academic Hub Voice Explanation\n` +

                                  `📚 Subject: ${subject.name}\n` +

                                  `📁 Module: ${modLabel}\n` +

                                  `🎙️ ${chLabel}: ${v.title}\n` +

                                  `🔗 Listen: ${shareUrl}`;



                if (navigator.share && /mobile|android|iphone|ipad/i.test(navigator.userAgent)) {

                  navigator.share({

                    title: shareTitle,

                    text: shareText,

                    url: shareUrl

                  }).catch(() => {

                    copyToClipboard(shareText, shareBtn);

                  });

                } else {

                  copyToClipboard(shareText, shareBtn);

                }

              });

            }            grid.append(card);

          });



          group.append(grid);



          // In-Article Study Ad Slot between modules (AdSense Viewability)

          if (modIdx < subject.modules.length - 1) {

            const adSlot = document.createElement('div');

            adSlot.className = 'study-adsense-slot';

            adSlot.innerHTML = `

              <span class="ad-disclaimer">SPONSORED STUDY RESOURCES</span>

              <div class="ad-placeholder-box" style="min-height:90px;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:12px;background:#f8fafc;border-radius:8px;">

                <span>📖 Calicut University FYUGP Official Study Material &amp; Exam Guide</span>

              </div>

            `;

            group.append(adSlot);

          }



          chaptersContainer.append(group);

        });



        if (matchedTotal === 0 && query) {

          chaptersContainer.innerHTML = `

            <div class="empty-state">

              <span class="empty-icon">🔍</span>

              <div class="empty-title">No matching chapters found</div>

              <div class="empty-desc">No voice lectures matched "<strong>${filterQuery}</strong>" in ${subject.name}. Try a different keyword.</div>

            </div>`;

        }

      }



      function updateUI() {

        // Update tab buttons active state

        document.querySelectorAll('.subj-tab-btn').forEach(btn => {

          const isActive = btn.dataset.slug === currentSlug;

          btn.classList.toggle('active', isActive);

          btn.setAttribute('aria-selected', isActive ? 'true' : 'false');

          if (isActive) { centerActiveTab(btn); }

        });



        renderChapters(searchInput.value);

      }



      // Search Filter Event

      searchInput.addEventListener('input', (e) => {

        renderChapters(e.target.value);

      });



      // Sticky Bar Close Event

      stickyClose.addEventListener('click', () => {

        stickyBar.classList.remove('visible');

        if (currentPlayingCard) {

          const frame = currentPlayingCard.querySelector('.player-frame-wrap');

          const tab = currentPlayingCard.querySelector('.mini-player-tab');

          const playBtn = currentPlayingCard.querySelector('.btn-play-voice');

          if (frame) frame.innerHTML = '';

          if (tab) tab.classList.remove('active');

          if (playBtn) playBtn.innerHTML = '<span aria-hidden="true">▶</span> Play Voice';

          currentPlayingCard.classList.remove('playing');

          currentPlayingCard = null;

        }

      });



      // Handle popstate for back/forward navigation

      window.addEventListener('popstate', () => {

        const p = new URLSearchParams(window.location.search);

        const s = (p.get('subject') || 'malayalam').toLowerCase();

        if (data[s] && s !== currentSlug) {

          currentSlug = s;

          updateUI();

        }

      });



      // Sticky Bar Pause/Resume Toggle

      const stickyPauseToggle = document.getElementById('sticky-pause-toggle');

      if (stickyPauseToggle) {

        stickyPauseToggle.addEventListener('click', () => {

          if (currentPlayingCard) {

            const pauseBtn = currentPlayingCard.querySelector('.vpp-btn-pause');

            if (pauseBtn) pauseBtn.click();

          }

        });

      }



      function copyToClipboard(text, btn) {

        if (navigator.clipboard && navigator.clipboard.writeText) {

          navigator.clipboard.writeText(text).then(() => {

            showCopiedFeedback(btn);

          }).catch(() => {

            fallbackCopy(text, btn);

          });

        } else {

          fallbackCopy(text, btn);

        }

      }



      function fallbackCopy(text, btn) {

        const ta = document.createElement('textarea');

        ta.value = text;

        ta.style.position = 'fixed';

        ta.style.opacity = '0';

        document.body.appendChild(ta);

        ta.select();

        try {

          document.execCommand('copy');

          showCopiedFeedback(btn);

        } catch (e) {

          window.prompt('Copy lecture details:', text);

        }

        document.body.removeChild(ta);

      }



      function showCopiedFeedback(btn) {

        const originalHtml = btn.innerHTML;

        btn.innerHTML = '<span aria-hidden="true">✓</span> Copied!';

        btn.classList.add('copied');

        setTimeout(() => {

          btn.innerHTML = originalHtml;

          btn.classList.remove('copied');

        }, 2000);

      }



      function handleDeepLink() {

        const params = new URLSearchParams(window.location.search);

        const targetCh = params.get('ch') || params.get('chapter') || (window.location.hash ? window.location.hash.replace('#', '') : '');

        if (!targetCh) return;



        const normalizedTarget = targetCh.replace(/[^0-9.]/g, '').replace(/^0+([1-9])/, '$1');

        

        const cards = document.querySelectorAll('.chapter-card');

        for (const card of cards) {

          const cNorm = card.dataset.chapterNorm;

          const cRaw = card.dataset.chapter;

          const cardId = card.id;



          if (

            (cNorm && cNorm === normalizedTarget) ||

            (cRaw && cRaw.toLowerCase() === targetCh.toLowerCase()) ||

            (cardId && cardId.toLowerCase() === targetCh.toLowerCase()) ||

            (cardId && cardId.toLowerCase() === ('ch-' + targetCh.replace(/[^0-9.]/g, '').replace(/\./g, '-')).toLowerCase())

          ) {

            card.classList.add('highlight-target');

            card.scrollIntoView({ behavior: 'smooth', block: 'center' });

            

            const cardTitle = card.querySelector('.card-title')?.textContent || '';

            if (cardTitle) {

              document.title = `${targetCh}: ${cardTitle} | Academic Hub Voice Explanation`;

            }



            const playBtn = card.querySelector('.btn-play-voice');

            if (playBtn) {

              setTimeout(() => {

                playBtn.click();

              }, 700);

            }

            break;

          }

        }

      }



      // Initial Mount

      renderSubjectTabs();

      updateUI();

      handleDeepLink();

      // Mobile auto-center active tab on load
      setTimeout(() => {
        const activeBtn = subjectTabsContainer.querySelector(`.subj-tab-btn[data-slug="${currentSlug}"]`);
        if (activeBtn) centerActiveTab(activeBtn);
      }, 150);

    

      // Screen WakeLock API - Keep screen awake while studying & listening

      let wakeLock = null;

      const wakeLockBtn = document.getElementById('wake-lock-toggle');



      async function requestScreenWakeLock() {

        if ('wakeLock' in navigator) {

          try {

            wakeLock = await navigator.wakeLock.request('screen');

            if (wakeLockBtn) {

              wakeLockBtn.classList.add('active');

              wakeLockBtn.setAttribute('aria-pressed', 'true');

              wakeLockBtn.querySelector('.wake-text').textContent = 'Screen Awake: ON';

            }

            wakeLock.addEventListener('release', () => {

              if (wakeLockBtn) {

                wakeLockBtn.classList.remove('active');

                wakeLockBtn.setAttribute('aria-pressed', 'false');

                wakeLockBtn.querySelector('.wake-text').textContent = 'Keep Screen Awake';

              }

              wakeLock = null;

            });

          } catch (err) {

            console.warn('Wake Lock request error:', err);

          }

        }

      }



      async function releaseScreenWakeLock() {

        if (wakeLock !== null) {

          try {

            await wakeLock.release();

          } catch (e) {}

          wakeLock = null;

        }

      }



      if (wakeLockBtn) {

        wakeLockBtn.addEventListener('click', async () => {

          if (wakeLock !== null) {

            await releaseScreenWakeLock();

          } else {

            await requestScreenWakeLock();

          }

        });

      }



      // Re-request wake lock if tab returns to view

      document.addEventListener('visibilitychange', async () => {

        if (wakeLock !== null && document.visibilityState === 'visible') {

          await requestScreenWakeLock();

        }

      });



    })();

  </script>
