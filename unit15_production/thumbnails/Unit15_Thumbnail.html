<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@700&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            width: 1280px;
            height: 720px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 45%, #e0e7ff 100%);
            font-family: 'Outfit', sans-serif;
        }
        .mal-font { font-family: 'Manjari', sans-serif; }
        .en-font { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="relative flex flex-col justify-between p-10 select-none">
    <!-- Header -->
    <div class="flex justify-between items-center bg-white/90 backdrop-blur-md px-6 py-2.5 rounded-2xl border border-sky-300 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white text-xl font-bold">
                💰
            </div>
            <div>
                <span class="font-black text-xl text-slate-900 tracking-tight">ACADEMIC HUB</span>
                <span class="bg-sky-600 text-white text-xs font-bold px-2 py-0.5 rounded-full ml-2">FYUGP 2026</span>
            </div>
        </div>
        <span class="bg-amber-100 text-amber-900 font-black px-4 py-1 rounded-xl text-sm border border-amber-300">
            FULL CHAPTER MASTERCLASS
        </span>
    </div>

    <!-- Main Content -->
    <div class="my-auto space-y-4">
        <div class="inline-block bg-sky-900 text-sky-100 font-extrabold px-4 py-1.5 rounded-lg text-sm tracking-widest uppercase">
            MICROECONOMICS · MODULE 03 · UNIT 15
        </div>
        <h1 class="text-6xl font-black mal-font text-slate-950 leading-tight drop-shadow-sm">
            ചെലവുകളുടെ സ്വഭാവം:<br><span class="bg-gradient-to-r from-sky-600 to-indigo-700 bg-clip-text text-transparent">പ്രത്യക്ഷ & പരോക്ഷ ചിലവുകൾ</span>
        </h1>
        <h2 class="text-3xl font-extrabold en-font text-slate-700">
            Nature of Costs: Explicit, Implicit, Opportunity & Sunk Costs
        </h2>
    </div>

    <!-- Badges Bottom -->
    <div class="flex justify-between items-center bg-white/95 backdrop-blur-md px-8 py-3.5 rounded-2xl border-2 border-sky-400 shadow-xl">
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-2">
                <span class="text-sky-600 font-black text-lg">✦</span>
                <span class="mal-font font-bold text-slate-900 text-lg">അക്കൗണ്ടിംഗ് & സാമ്പത്തിക ലാഭം</span>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-sky-600 font-black text-lg">✦</span>
                <span class="mal-font font-bold text-slate-900 text-lg">അവസരച്ചെലവ് തത്വം</span>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-sky-600 font-black text-lg">✦</span>
                <span class="mal-font font-bold text-slate-900 text-lg">സങ്ക് കോസ്റ്റ് ഫാലസി</span>
            </div>
        </div>
        <span class="bg-rose-600 text-white font-extrabold px-5 py-1.5 rounded-xl text-sm uppercase tracking-wider shadow">
            100% LMS COVERAGE
        </span>
    </div>
</body>
</html>
