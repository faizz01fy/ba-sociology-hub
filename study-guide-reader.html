  <title>Study Guide Reader · Academic Hub</title>
  <script>
    (() => {
      const search = location.search || '';
      let file = '';
      const m = search.match(/[?&]file=(.*?)(?:&(?:tab|voice|v|lang|page|zoom)=|$)/i);
      if (m && m[1]) {
        file = m[1];
      } else {
        file = new URLSearchParams(search).get('file') || '';
      }
      try { file = decodeURIComponent(file); } catch(_) {}
      try { if (file.includes('%')) file = decodeURIComponent(file); } catch(_) {}
      file = file.trim().replace(/^['"]|['"]$/g, '');

      let tab = '';
      const tabMatch = search.match(/[?&]tab=([^&#]*)/i);
      if (tabMatch && tabMatch[1]) tab = tabMatch[1].toLowerCase();
      else tab = (new URLSearchParams(search).get('tab') || '').toLowerCase();

      const voice = new URLSearchParams(search).get('voice');

      if (!file && (tab === 'malayalam_reading' || tab === 'reading' || tab === 'malayalam')) {
        file = 'Malayalam_Complete_Study_Guide.pdf';
      }

      // Voice reading enabled by default for all study guides, LMS PDFs, and Malayalam Reading tabs
      const isVoiceExplicitlyDisabled = (
        voice === '0' ||
        tab === 'mcq' ||
        tab === 'mcq_pdf' ||
        tab === 'mcq-pdf'
      );

      if (isVoiceExplicitlyDisabled) {
        document.documentElement.classList.add('hide-voice-controls');
        window.hideVoiceReader = true;
      } else {
        document.documentElement.classList.remove('hide-voice-controls');
        window.hideVoiceReader = false;
      }
      window.isMalayalamDoc = /(?:malayalam|മലയാളം|_mal|ch\d+.*mal|LiteraryPractice|MODULE4|Module3.*മലയാള)/i.test(file);
    })();
  </script>

          <label for="englishEngineSelect" class="voice-group-label">English Voice:</label>
          <select id="englishEngineSelect" class="voice-select" aria-label="English voice reader options">
            <option value="google" selected>✨ Google Voice Reader (Clear)</option>
            <option value="uk">🇬🇧 UK English (British)</option>
            <option value="us">🇺🇸 US English (American)</option>
          </select>
        </div>

        <!-- Voice tone choices -->
        <div class="voice-control-group">
          <label for="voicePitchSelect" class="voice-group-label">Tone:</label>
          <select id="voicePitchSelect" class="voice-select" aria-label="Voice tone">
            <option value="auto" selected>Automatic by gender</option>
            <option value="1">Natural</option>
            <option value="0.92">Warm</option>
            <option value="0.82">Deeper</option>
            <option value="1.12">Brighter</option>
          </select>
        </div>

        <!-- Speed Dropdown -->
        <div class="voice-control-group">
          <label for="voiceSpeedSelect" class="voice-group-label">സ്പീഡ്:</label>
          <select id="voiceSpeedSelect" class="voice-select" aria-label="Reading Speed">
            <option value="0.85">0.85x</option>
            <option value="1.0" selected>1.0x</option>
            <option value="1.15">1.15x</option>
          </select>
        </div>

        <!-- Continuous Mode Checkbox -->
        <div class="voice-control-group">
          <label class="voice-checkbox-label" title="നിലവിലെ പേജ് കഴിഞ്ഞാൽ അടുത്ത പേജ് സ്വയമേവ വായിക്കുക">
            <input type="checkbox" id="voiceContinuousCheck" checked>
            <span>തുടർച്ചയായി</span>
          </label>

      </div>
    </div>
  </div>

  <p id="status" role="status" aria-live="polite">Loading study guide…</p>
  <main id="reader" aria-label="All study guide pages"></main>

  <script type="module">
    const el = id => document.getElementById(id);
    const pageCanvasCache = new Map();
     // 0ms fast page canvas LRU cache
    
    // Security & interaction controls
    document.addEventListener('contextmenu', event => { event.preventDefault(); return false; }, true);
    document.addEventListener('dragstart', event => event.preventDefault());
    document.addEventListener('keydown', event => {
      if ((event.ctrlKey || event.metaKey) && ['s', 'p', 'u'].includes(event.key.toLowerCase())) {
        event.preventDefault();
      }
    });

        let pdf, pageNumber = 1, generation = 0, observer, pageTrackingObserver, sections = [];
    const activeTasks = new Map();
    let renderQueue = [];
    let isProcessingQueue = false;
    let customZoomScale = null;

    function controls() {
      const hasPdf = Boolean(pdf);
      el('page').disabled = !hasPdf;
      el('prevPage').disabled = !hasPdf || pageNumber <= 1;
      el('nextPage').disabled = !hasPdf || (pdf && pageNumber >= pdf.numPages);
      el('zoom').disabled = !hasPdf;
      el('zoomOut').disabled = !hasPdf;
      el('zoomIn').disabled = !hasPdf;
      el('page').value = pageNumber;
      el('pages').textContent = '/ ' + (pdf ? pdf.numPages : '…');
    }

    const fitScale = (page) => {
      const original = page.getViewport({ scale: 1 });
      const isMobile = window.innerWidth <= 768;
      
      if (customZoomScale !== null) {
        return Math.max(0.3, Math.min(3.5, customZoomScale));
      }
      
      const zVal = el('zoom').value;
      if (zVal === 'fit') {
        const availWidth = el('reader').clientWidth || window.innerWidth;
        const padding = isMobile ? 4 : 32;
        return Math.max(0.25, Math.min(3.0, (availWidth - padding) / original.width));
      }
      if (zVal === 'read') {
        // Dedicated comfortable reading mode: 135% of fit width or minimum 1.25
        const availWidth = el('reader').clientWidth || window.innerWidth;
        const baseFit = (availWidth - 4) / original.width;
        return Math.max(1.20, Math.min(2.5, baseFit * 1.35));
      }
      return Number(zVal);
    };

    function cancelAllActiveTasks() {
      for (const [sec, task] of activeTasks.entries()) {
        try { task.cancel(); } catch(_) {}
      }
      activeTasks.clear();
      renderQueue = [];
      isProcessingQueue = false;
    }

    function enqueuePage(section) {
      if (!section || section.dataset.rendered === 'true' || section.dataset.rendering === 'true') return;
      if (!renderQueue.includes(section)) {
        renderQueue.push(section);
      }
      processRenderQueue();
    }

    const isMobileDevice = window.innerWidth <= 768 || (navigator.maxTouchPoints && navigator.maxTouchPoints > 1 && window.innerWidth <= 1024);
    const CONCURRENT_RENDERS = isMobileDevice ? 1 : 2;
    async function processRenderQueue() {
      if (isProcessingQueue) return;
      isProcessingQueue = true;
      while (renderQueue.length > 0) {
        renderQueue.sort((a, b) => {
          const distA = Math.abs(Number(a.dataset.page) - pageNumber);
          const distB = Math.abs(Number(b.dataset.page) - pageNumber);
          return distA - distB;
        });
        const batch = renderQueue.splice(0, CONCURRENT_RENDERS);
        await Promise.all(batch.map(next => {
          if (next && next.dataset.rendered !== 'true' && next.dataset.rendering !== 'true') {
            return renderPage(next);
          }
          return Promise.resolve();
        }));
      }
      isProcessingQueue = false;
    }

    async function renderPage(section, knownPage) {
      if (section.dataset.rendered === 'true' || section.dataset.rendering === 'true') return;
      const currentGeneration = generation;
      const number = Number(section.dataset.page);

      // 0ms Instant restore from in-memory Page Bitmap Cache
      if (pageCanvasCache.has(number)) {
        const cached = pageCanvasCache.get(number);
        const oldC = section.querySelector('canvas');
        if (oldC) oldC.remove();
        section.append(cached);
        section.dataset.rendered = 'true';
        delete section.dataset.rendering;
        section.querySelector('.page-loading')?.remove();
        return;
      }

      section.dataset.rendering = 'true';

      try {
        const page = knownPage || await pdf.getPage(number);
        if (currentGeneration !== generation) return;

        const viewport = page.getViewport({ scale: fitScale(page) });
        section.style.width = viewport.width + 'px';
        section.style.minHeight = (viewport.height + 24) + 'px';

        // Remove any old canvas or link layers to guarantee zero duplicate rendering
        const oldCanvas = section.querySelector('canvas');
        if (oldCanvas) oldCanvas.remove();
        const oldLinks = section.querySelector('.pdf-link-layer');
        if (oldLinks) oldLinks.remove();

        const canvas = document.createElement('canvas');
        const dpr = window.devicePixelRatio || 1;
        // Optimal rendering scale without WebKit memory exhaustion:
        // Mobile phones: clamp to Math.min(dpr, 1.25) to prevent iOS Jetsam OOM crashes.
        // Desktop: clamp between 1.25 and 1.8 for crisp vector glyphs without GPU buffer overflow.
        const ratio = isMobileDevice ? Math.min(dpr, 1.25) : Math.min(Math.max(dpr, 1.25), 1.8);

        canvas.width = Math.floor(viewport.width * ratio);
        canvas.height = Math.floor(viewport.height * ratio);
        canvas.style.width = viewport.width + 'px';
        canvas.style.height = viewport.height + 'px';
        canvas.style.display = 'block';
        canvas.setAttribute('role', 'img');
        canvas.setAttribute('aria-label', 'Study guide page ' + number + ' of ' + pdf.numPages);

        // Alpha: false provides instant 2x-3x GPU compositor acceleration & eliminates scroll jank
        const ctx = canvas.getContext('2d', { alpha: false });
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        section.append(canvas);

        const task = page.render({
          canvasContext: ctx,
          viewport,
          transform: ratio !== 1 ? [ratio, 0, 0, ratio, 0, 0] : null
        });
        activeTasks.set(section, task);

        try {
          await task.promise;
        } finally {
          activeTasks.delete(section);
        }

        section.dataset.rendered = 'true';
        section.querySelector('.page-loading')?.remove();

        const MAX_CANVAS_CACHE = isMobileDevice ? 4 : 10;
        pageCanvasCache.set(number, canvas);
        while (pageCanvasCache.size > MAX_CANVAS_CACHE) {
          const firstKey = pageCanvasCache.keys().next().value;
          const oldCanvas = pageCanvasCache.get(firstKey);
          if (oldCanvas) {
            oldCanvas.width = 0;
            oldCanvas.height = 0;
          }
          pageCanvasCache.delete(firstKey);
        }

        if (currentGeneration !== generation) return;
        if (Number(section.dataset.page) === pageNumber && el('status')) {
          el('status').textContent = pdf.numPages + ' pages · Scroll or use ‹ › buttons to read';
        }

        // Link Annotation Layer
        try {
          const annotations = await page.getAnnotations();
          if (annotations && annotations.length) {
            const linkLayer = document.createElement('div');
            linkLayer.className = 'pdf-link-layer';
            linkLayer.style.cssText = 'position:absolute;top:0;left:0;width:' + viewport.width + 'px;height:' + viewport.height + 'px;pointer-events:none;';
            annotations.forEach(a => {
              if (a.subtype === 'Link' && a.url) {
                const r = viewport.convertToViewportRectangle(a.rect);
                const l = Math.min(r[0], r[2]);
                const t = Math.min(r[1], r[3]);
                const w = Math.abs(r[2] - r[0]);
                const h = Math.abs(r[3] - r[1]);
                const link = document.createElement('a');
                link.href = a.url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.style.cssText = 'position:absolute;left:' + l + 'px;top:' + t + 'px;width:' + w + 'px;height:' + h + 'px;pointer-events:auto;cursor:pointer;background:rgba(59,130,246,0.12);border-radius:3px;transition:background 0.15s;';
                link.title = (a.url.includes('youtu') ? 'Watch video: ' : 'Open link: ') + a.url;
                link.onmouseenter = () => link.style.background = 'rgba(59,130,246,0.28)';
                link.onmouseleave = () => link.style.background = 'rgba(59,130,246,0.12)';
                linkLayer.append(link);
              }
            });
            section.append(linkLayer);
          }
        } catch (err) {
          console.error('Annotation layer error:', err);
        }
      } catch (error) {
        if (currentGeneration !== generation || error?.name === 'RenderingCancelledException') return;
        section.querySelector('canvas')?.remove();
        const label = section.querySelector('.page-loading');
        if (label) label.textContent = 'Could not display this page. Tap Retry to try again.';
        el('retry').hidden = false;
      } finally {
        delete section.dataset.rendering;
      }
    }

    async function render() {
      if (!pdf) return;
      const currentGeneration = ++generation;
      const resumePage = Math.max(1, Math.min(pdf.numPages, pageNumber));

      if (observer) observer.disconnect();
      if (pageTrackingObserver) pageTrackingObserver.disconnect();
      cancelAllActiveTasks();
      pageCanvasCache.clear();

      el('reader').replaceChildren();
      sections = [];
      el('status').textContent = 'Loading page ' + resumePage + ' of ' + pdf.numPages + '…';

      const firstPage = await pdf.getPage(1);
      if (currentGeneration !== generation) return;

      const isMobile = window.innerWidth <= 768;
      const estimate = firstPage.getViewport({ scale: fitScale(firstPage) });

      // Synchronously generate placeholder cards using DocumentFragment (single reflow)
      const fragment = document.createDocumentFragment();
      for (let number = 1; number <= pdf.numPages; number++) {
        const section = document.createElement('section');
        section.className = 'pdf-page';
        section.dataset.page = number;
        section.setAttribute('aria-label', 'Page ' + number);
        section.style.width = estimate.width + 'px';
        section.style.minHeight = (estimate.height + 24) + 'px';

        const label = document.createElement('div');
        label.className = 'page-label';
        label.textContent = 'Page ' + number + ' of ' + pdf.numPages;

        const loading = document.createElement('div');
        loading.className = 'page-loading';
        loading.textContent = 'Loading page ' + number + '…';

        section.append(label, loading);
        fragment.append(section);
        sections.push(section);
      }
      el('reader').append(fragment);

      pageNumber = resumePage;
      controls();
      pageNumber = resumePage;
      controls();

      // Render the current/resume page immediately with zero lag
      const resumeSec = sections[resumePage - 1];
      await renderPage(resumeSec, resumePage === 1 ? firstPage : null);
      if (currentGeneration !== generation) return;

      if (resumeSec.dataset.rendered === 'true') {
        el('status').textContent = pdf.numPages + ' pages · Scroll or use ‹ › buttons to read';
        // Pre-warm immediate adjacent pages only (1 ahead, 1 behind)
        if (sections[resumePage]) {
          enqueuePage(sections[resumePage]);
        }
        if (resumePage > 1 && sections[resumePage - 2]) {
          enqueuePage(sections[resumePage - 2]);
        }
      } else if (resumeSec.dataset.rendering !== 'true') {
        el('status').textContent = 'Could not display page ' + resumePage + '. Tap Retry to try again.';
      }

      // Efficient view observer for on-demand lazy rendering
      observer = new IntersectionObserver(entries => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          observer.unobserve(entry.target);
          enqueuePage(entry.target);
        }
      }, { rootMargin: isMobileDevice ? '600px 0px' : '1000px 0px' });

      sections.forEach(sec => {
        if (sec.dataset.rendered !== 'true') observer.observe(sec);
      });

      // Off-main-thread active page tracker (zero layout reflow) with mobile memory recycling
      pageTrackingObserver = new IntersectionObserver((entries) => {
        const intersecting = entries.filter(e => e.isIntersecting);
        if (intersecting.length > 0) {
          intersecting.sort((a, b) => Math.abs(a.boundingClientRect.top) - Math.abs(b.boundingClientRect.top));
          const p = Number(intersecting[0].target.dataset.page);
          if (p && p !== pageNumber && document.activeElement !== el('page')) {
            pageNumber = p;
            el('page').value = pageNumber;
            controls();

            // Mobile memory virtualizer: recycle canvases that are > 4 pages away from current view
            if (isMobileDevice) {
              sections.forEach(sec => {
                const sPage = Number(sec.dataset.page);
                if (Math.abs(sPage - pageNumber) > 4 && sec.dataset.rendered === 'true') {
                  const oldCanvas = sec.querySelector('canvas');
                  if (oldCanvas) {
                    oldCanvas.remove();
                    oldCanvas.width = 0;
                    oldCanvas.height = 0;
                  }
                  delete sec.dataset.rendered;
                  if (observer) observer.observe(sec);
                }
              });
            }
          }
        }
      }, { rootMargin: '-10% 0px -70% 0px' });

      sections.forEach(sec => pageTrackingObserver.observe(sec));
    }

    function go(number, smooth = true) {
      if (!pdf) return;
      pageNumber = Math.max(1, Math.min(pdf.numPages, Math.round(Number(number) || 1)));
      const targetSec = sections[pageNumber - 1];
      if (targetSec) {
        targetSec.scrollIntoView({ block: 'start', behavior: smooth ? 'smooth' : 'auto' });
        if (targetSec.dataset.rendered !== 'true') {
          enqueuePage(targetSec);
        }
      }
      controls();
    }

    // Event listeners for page navigation
    el('page').onchange = event => go(event.target.value);
    el('prevPage').onclick = () => { if (pageNumber > 1) go(pageNumber - 1); };
    el('nextPage').onclick = () => { if (pdf && pageNumber < pdf.numPages) go(pageNumber + 1); };

    // --- ZOOM & PINCH CONTROLLER ---
    let hudTimeout = null;
    function showZoomHud(scale, text) {
      const hud = el('zoomHud');
      if (!hud) return;
      const display = text || (Math.round(scale * 100) + '%');
      hud.textContent = '🔍 ' + display;
      hud.classList.add('visible');
      clearTimeout(hudTimeout);
      hudTimeout = setTimeout(() => {
        hud.classList.remove('visible');
      }, 1200);
    }

    function updateZoomDropdown(scale) {
      const zoomSel = el('zoom');
      if (!zoomSel) return;
      const percent = Math.round(scale * 100);
      let customOpt = zoomSel.querySelector('option[data-pinch="true"]');
      if (!customOpt) {
        customOpt = document.createElement('option');
        customOpt.setAttribute('data-pinch', 'true');
        zoomSel.insertBefore(customOpt, zoomSel.children[2] || null);
      }
      customOpt.value = scale.toFixed(2);
      customOpt.textContent = '🔍 ' + percent + '%';
      zoomSel.value = customOpt.value;
    }

    function getCurrentScale() {
      if (customZoomScale !== null) return customZoomScale;
      if (sections[0]) {
        try {
          const w = parseFloat(sections[0].style.width);
          if (w && w > 0) {
            // Calculate effective scale based on first page section
            return Math.max(0.35, Math.min(3.8, w / 595.0));
          }
        } catch (e) {}
      }
      return 1.0;
    }

    // Zoom event listeners
    el('zoom').onchange = () => {
      customZoomScale = null;
      render();
    };

    el('zoomIn').onclick = () => {
      if (!pdf) return;
      const current = getCurrentScale();
      const next = Math.min(3.8, Math.round((current + 0.20) * 100) / 100);
      customZoomScale = next;
      updateZoomDropdown(next);
      showZoomHud(next);
      render();
    };

    el('zoomOut').onclick = () => {
      if (!pdf) return;
      const current = getCurrentScale();
      const next = Math.max(0.35, Math.round((current - 0.20) * 100) / 100);
      customZoomScale = next;
      updateZoomDropdown(next);
      showZoomHud(next);
      render();
    };

    // Touch Pinch-to-Zoom (2-Finger Smooth Scaling & Sharp Snapping)
    let isPinching = false;
    let pinchStartDist = 0;
    let pinchStartScale = 1;
    let pinchCenter = { x: 0, y: 0 };
    let currentPinchRatio = 1;
    const readerEl = el('reader');

    function getTouchDist(t1, t2) {
      return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    }

    function getTouchMid(t1, t2) {
      return {
        x: (t1.clientX + t2.clientX) / 2,
        y: (t1.clientY + t2.clientY) / 2
      };
    }

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2 && pdf) {
        isPinching = true;
        e.preventDefault();
        pinchStartDist = getTouchDist(e.touches[0], e.touches[1]);
        const mid = getTouchMid(e.touches[0], e.touches[1]);
        const rect = readerEl.getBoundingClientRect();
        pinchCenter = {
          x: Math.max(0, mid.x - rect.left),
          y: Math.max(0, mid.y - rect.top)
        };
        pinchStartScale = getCurrentScale();
        currentPinchRatio = 1;
        readerEl.style.transition = 'none';
        readerEl.style.transformOrigin = pinchCenter.x + 'px ' + pinchCenter.y + 'px';
        showZoomHud(pinchStartScale);
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (isPinching && e.touches.length === 2 && pdf) {
        e.preventDefault();
        const dist = getTouchDist(e.touches[0], e.touches[1]);
        if (pinchStartDist > 0) {
          currentPinchRatio = dist / pinchStartDist;
          const candidateScale = pinchStartScale * currentPinchRatio;
          const clampedScale = Math.max(0.4, Math.min(4.0, candidateScale));
          const effectiveRatio = clampedScale / pinchStartScale;
          
          readerEl.style.transform = 'scale(' + effectiveRatio.toFixed(3) + ')';
          showZoomHud(clampedScale);
        }
      }
    }, { passive: false });

    let pinchDebounceTimer = null;
    const finishPinch = () => {
      if (!isPinching) return;
      isPinching = false;
      
      const targetScale = Math.max(0.4, Math.min(3.8, pinchStartScale * currentPinchRatio));
      if (Math.abs(targetScale - pinchStartScale) > 0.04) {
        customZoomScale = Math.round(targetScale * 100) / 100;
        updateZoomDropdown(customZoomScale);
        showZoomHud(customZoomScale);
        clearTimeout(pinchDebounceTimer);
        pinchDebounceTimer = setTimeout(() => {
          readerEl.style.transform = '';
          readerEl.style.transformOrigin = '';
          render();
        }, 50);
      } else {
        readerEl.style.transition = 'transform 0.15s ease-out';
        readerEl.style.transform = 'scale(1)';
        setTimeout(() => {
          readerEl.style.transform = '';
          readerEl.style.transformOrigin = '';
          readerEl.style.transition = '';
        }, 150);
      }
    };

    window.addEventListener('touchend', (e) => {
      if (isPinching && e.touches.length < 2) {
        finishPinch();
      }
    }, { passive: false });

    window.addEventListener('touchcancel', () => {
      if (isPinching) finishPinch();
    }, { passive: false });

    // Prevent iOS Safari gesture interference
    window.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
    window.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
    window.addEventListener('gestureend', (e) => e.preventDefault(), { passive: false });

    // Trackpad Pinch / Ctrl + Wheel
    let wheelZoomTimer = null;
    window.addEventListener('wheel', (e) => {
      if (e.ctrlKey) {
        e.preventDefault();
        if (!pdf) return;
        const cur = getCurrentScale();
        const factor = e.deltaY < 0 ? 1.08 : 0.92;
        const next = Math.max(0.35, Math.min(3.8, Math.round(cur * factor * 100) / 100));
        customZoomScale = next;
        updateZoomDropdown(next);
        showZoomHud(next);
        clearTimeout(wheelZoomTimer);
        wheelZoomTimer = setTimeout(() => { render(); }, 120);
      }
    }, { passive: false });

    // Double-Tap to Zoom / Fit
    let lastTapTime = 0;
    let lastTapPos = { x: 0, y: 0 };
    readerEl.addEventListener('touchend', (e) => {
      if (isPinching) return;
      if (e.changedTouches.length !== 1 || !pdf) return;
      const now = Date.now();
      const t = e.changedTouches[0];
      const dist = Math.hypot(t.clientX - lastTapPos.x, t.clientY - lastTapPos.y);
      if (now - lastTapTime < 320 && dist < 32) {
        e.preventDefault();
        const cur = getCurrentScale();
        if (cur > 1.35) {
          customZoomScale = null;
          el('zoom').value = 'fit';
          showZoomHud(1.0, 'Fit Width');
          render();
        } else {
          customZoomScale = 1.75;
          updateZoomDropdown(1.75);
          showZoomHud(1.75, '175%');
          render();
        }
        lastTapTime = 0;
        return;
      }
      lastTapTime = now;
      lastTapPos = { x: t.clientX, y: t.clientY };
    }, { passive: false });

    // Cross-frame messaging from parent modal zoom buttons
    window.addEventListener('message', (event) => {
      if (!pdf) return;
      if (event.data?.action === 'zoom') {
        const cur = getCurrentScale();
        const delta = Number(event.data.delta) || 0.2;
        const next = Math.max(0.35, Math.min(3.8, Math.round((cur + delta) * 100) / 100));
        customZoomScale = next;
        updateZoomDropdown(next);
        showZoomHud(next);
        render();
      } else if (event.data?.action === 'resetZoom') {
        customZoomScale = null;
        el('zoom').value = 'fit';
        showZoomHud(1.0, 'Fit Width');
        render();
      }
    });

    // Fullscreen and External New Tab
    el('fullscreenBtn').onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    el('openExternalBtn').onclick = () => {
      window.open(location.href, '_blank');
    };

    // Active page tracking handled off-thread via pageTrackingObserver

    // Resize listener
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (el('zoom').value === 'fit' || el('zoom').value === 'read') render();
      }, 200);
    });

    async function loadScript(src) {
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.async = true;
        script.onload = resolve;
        script.onerror = () => reject(Error('Could not load the document viewer'));
        document.head.append(script);
      });
    }

    // --- VOICE READING (TTS) & LIVE TRANSLATION ENGINE ---
    let allVoices = [];

    // --- MALAYALAM UNICODE SANITIZER & REPAIR ---
    // Fixes broken, duplicated diacritics, split chillus, and invalid combining characters extracted from PDFs
    function sanitizeMalayalam(text) {
      if (!text) return '';
      let s = text
        .replace(/\xad/g, '')
        .replace(/\u200b/g, '')
        .replace(/\u200c/g, '')
        .replace(/\0/g, '')
        .replace(/([\u0D00-\u0D7F])-\s*\n\s*([\u0D00-\u0D7F])/g, '$1$2')
        // Deduplicate doubled matras / signs (Chromium PDF printing artifact): ൈൈ -> ൈ, െെ -> െ, േേ -> േ, ാാ -> ാ, ിി -> ി, ീീ -> ീ, ംം -> ം, ുു -> ു, ൂൂ -> ൂ
        .replace(/([\u0D3E-\u0D4D\u0D57\u0D02\u0D03])\1+/g, '$1')
        .replace(/([െേൈ])\1+/g, '$1')
        .replace(/([ാിീുൂൃംഃ])\1+/g, '$1')
        // Fix isolated vowel signs preceded by space: മ ൊ -> മൊ
        .replace(/([\u0D00-\u0D7F])\s+([\u0D3E-\u0D4D\u0D57\u0D02\u0D03])/g, '$1$2')
        // Repair split words and syllables broken across space/newline
        .replace(/ഹൈ\s+ദരാലി/g, 'ഹൈദരാലി')
        .replace(/സെ\s+പ്റ്റംബർ/g, 'സെപ്റ്റംബർ')
        .replace(/സാഹിത്യാ\s*നുശീലനം/g, 'സാഹിത്യാനുശീലനം')
        .replace(/അധ്യാ\s*യം/g, 'അധ്യായം')
        .replace(/ഗുരു\s*നാഥനെ/g, 'ഗുരുനാഥനെ')
        .replace(/ഓർക്കു\s*മ്പോൾ/g, 'ഓർക്കുമ്പോൾ')
        .replace(/കലാ\s*മണ്ഡലം/g, 'കലാമണ്ഡലം')
        .replace(/അങ്ക\s*മാലി/g, 'അങ്കമാലി')
        .replace(/കമ്മട്ടി\s*പ്പാടം/g, 'കമ്മട്ടിപ്പാടം')
        .replace(/വിസ്മ\s*യം/g, 'വിസ്മയം')
        .replace(/ജീവി\s*തം/g, 'ജീവിതം')
        .replace(/ആത്മ\s*കഥ/g, 'ആത്മകഥ')
        .replace(/പ്രവേ\s*ശനം/g, 'പ്രവേശനം')
        .replace(/നിഷേ\s*ധം/g, 'നിഷേധം')
        .replace(/വിദ്വേ\s*ഷമോ/g, 'വിദ്വേഷമോ')
        .replace(/സന്ദേ\s*ശം/g, 'സന്ദേശം')
        .replace(/ഉള്ള\s*ടക്കം/g, 'ഉള്ളടക്കം')
        .replace(/ണ്‍/g, 'ൺ')
        .replace(/ന്‍/g, 'ൻ')
        .replace(/ര്‍/g, 'ർ')
        .replace(/ല്‍/g, 'ൽ')
        .replace(/ള്‍/g, 'ൾ')
        .replace(/ക്‍/g, 'ൿ')
        .replace(/[ \t]+/g, ' ')
        .normalize('NFC');
      return s;
    }

    // --- LIVE ENGLISH TO MALAYALAM TRANSLATION ENGINE ---
    // Translates pristine English sentences from the PDF to fluent, natural Malayalam in real-time
    async function translateEnglishToMalayalam(text) {
      const clean = text.trim();
      if (!clean) return '';
      if (translationCache[clean]) return translationCache[clean];

      // If predominantly Malayalam already, sanitize and return
      const mlMatches = clean.match(/[ഀ-ൿ]/g) || [];
      if (mlMatches.length > clean.length * 0.4) {
        const san = sanitizeMalayalam(clean);
        translationCache[clean] = san;
        return san;
      }

      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ml&dt=t&q=${encodeURIComponent(clean)}`;
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8000);
        try {
          const res = await fetch(url, { signal: controller.signal });
          if (res.ok) {
            const data = await res.json();
            const translated = (data[0] || []).map(p => p[0]).filter(Boolean).join('');
            if (translated) {
              const san = sanitizeMalayalam(translated);
              translationCache[clean] = san;
              return san;
            }
          }
        } finally {
          clearTimeout(timeout);
        }
      } catch (err) {
        console.warn('Live translation fallback to sanitized:', err);
      }
      return sanitizeMalayalam(clean);
    }

    function getVoiceKey(voice) {
      return voice.voiceURI || String((voice.lang || '') + '::' + (voice.name || ''));

    function getUKEnglishVoices() {
      return allVoices.filter(v => /^en-gb(?:-|$)/i.test((v.lang || '').replace(/_/g, '-')));

    const maleVoiceName = /\b(?:male|man|boy|aaron|ryan|daniel|arthur|oliver|thomas|james|george|david|mark|guy|brian|andrew|matthew|peter|richard|stephen|edward|henry|alfie|callum|noah|liam|rory|sean|darren|nathan|christopher|patrick|midhun|prabhat|ravi)\b/i;
    const femaleVoiceName = /\b(?:female|woman|girl|sonia|hazel|susan|libby|mia|emma|amy|natasha|neerja|heera|zira|jenny|aria|siri|sangeeta|serena|moira|joanna|kate|tessa|victoria|alice|sophie|hannah|freya|rachel|fiona|martha|megan|sally|samantha)\b/i;

    function isVoiceForGender(voice, gender) {
      const label = (voice.name || '') + ' ' + (voice.voiceURI || '');
      return gender === 'male' ? maleVoiceName.test(label) : femaleVoiceName.test(label);
    }

        function getSmartVoice(gender, isMalayalam) {
      if (!allVoices.length) return null;
      if (isMalayalam) {
        const mlVoices = allVoices.filter(v => (v.lang || '').toLowerCase().startsWith('ml'));
        if (mlVoices.length) {
          const gMatch = mlVoices.find(v => isVoiceForGender(v, gender));
          if (gMatch) return gMatch;
          return mlVoices[0];
        }
        const indVoices = allVoices.filter(v => /(?:-in\b|india|hindi|tamil)/i.test((v.lang || '') + ' ' + (v.name || '')));
        if (indVoices.length) {
          const gMatch = indVoices.find(v => isVoiceForGender(v, gender));
          if (gMatch) return gMatch;
          return indVoices[0];
        }
        return null;
      }

      const ukEnglishVoices = getUKEnglishVoices();
      if (!isMalayalam && selectedUKVoiceKey !== 'auto') {
        const chosen = ukEnglishVoices.find(v => getVoiceKey(v) === selectedUKVoiceKey);
        if (chosen) return chosen;
      }
      const matchingGender = ukEnglishVoices.filter(v => isVoiceForGender(v, gender));
      const naturalMatch = matchingGender.find(v => /natural|neural|online|google/i.test((v.name || '') + ' ' + (v.voiceURI || '')));
      if (naturalMatch || matchingGender.length) return naturalMatch || matchingGender[0];

      const saferFallback = ukEnglishVoices.find(v => gender === 'male'
        ? !femaleVoiceName.test((v.name || '') + ' ' + (v.voiceURI || ''))
        : !maleVoiceName.test((v.name || '') + ' ' + (v.voiceURI || '')));
      return saferFallback || ukEnglishVoices[0] || null;
    }

    function getEnglishVoiceByDialect(targetLang, gender) {
      if (!allVoices.length) return null;
      const prefix = targetLang.toLowerCase();
      const dialectVoices = allVoices.filter(v => (v.lang || '').replace(/_/g, '-').toLowerCase().startsWith(prefix));
      const pool = dialectVoices.length ? dialectVoices : allVoices.filter(v => (v.lang || '').toLowerCase().startsWith('en'));

      const genderPool = pool.filter(v => isVoiceForGender(v, gender));
      const neuralGender = genderPool.find(v => /natural|neural|online|google/i.test((v.name || '') + ' ' + (v.voiceURI || '')));
      if (neuralGender) return neuralGender;
      if (genderPool.length) return genderPool[0];

      const neuralAny = pool.find(v => /natural|neural|online|google/i.test((v.name || '') + ' ' + (v.voiceURI || '')));
      if (neuralAny) return neuralAny;
      return pool[0] || null;
    }

    function updateUKVoiceHint() {
      const hint = el('ukVoiceHint');
      if (!hint) return;
      const voices = getUKEnglishVoices();
      const matchingGender = voices.some(voice => isVoiceForGender(voice, selectedGender));
      hint.textContent = voices.length
        ? voices.length + ' UK voice option' + (voices.length === 1 ? '' : 's') +
          (matchingGender ? '' : ' · gender switch uses tone fallback')
        : 'No UK voice installed · gender switch uses tone fallback';
    }

    function populateVoiceList() {
      if (!('speechSynthesis' in window)) {
        updateUKVoiceHint();
        return;
      }
      allVoices = window.speechSynthesis.getVoices() || [];
      const select = el('ukVoiceSelect');
      if (select) {
        const previousKey = selectedUKVoiceKey || select.value || 'auto';
        const ukVoices = getUKEnglishVoices().slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        select.replaceChildren(new Option('Automatic best match', 'auto'));
        ukVoices.forEach(voice => {
          select.add(new Option((voice.name || 'UK English voice') + ' — ' + (voice.lang || 'en-GB'), getVoiceKey(voice)));
        });
        selectedUKVoiceKey = ukVoices.some(v => getVoiceKey(v) === previousKey) ? previousKey : 'auto';
        select.value = selectedUKVoiceKey;
      }
      updateUKVoiceHint();
    }

    async function waitForVoices() {
      if (!('speechSynthesis' in window)) return [];
      populateVoiceList();

      if (allVoices.length) return allVoices;
      const synth = window.speechSynthesis;
      if (typeof synth.addEventListener !== 'function') {
        await new Promise(resolve => setTimeout(resolve, 900));
      } else {
        await new Promise(resolve => {
          let finished = false;
          let timer;
          const finish = () => {
            if (finished) return;
            finished = true;
            clearTimeout(timer);
            synth.removeEventListener('voiceschanged', finish);
            populateVoiceList();

            resolve();
          };
          timer = setTimeout(finish, 1200);
          synth.addEventListener('voiceschanged', finish, { once: true });
        });
      }
      populateVoiceList();

      return allVoices;
    }

    if ('speechSynthesis' in window) {
      populateVoiceList();

    function splitIntoNaturalSentences(text) {
      if (!text) return [];
      const prepared = text.replace(/(^|\n)[ \t]*(Introductory\s+Notes?|Intro\s+Notes?|Introduction(?:\s+Note)?)[ \t]*(?=\n|$)/gim, '\n\n$2\n\n');
      const rawChunks = prepared.split(/(?<=[.!?।])\s+|\n{2,}/);
      const result = [];
      for (const chunk of rawChunks) {
        const t = chunk.trim();
        if (!t) continue;
        if (t.length > 150) {
          const sub = t.split(/(?<=[,;:\-])\s+/);
          let buf = '';
          for (const s of sub) {
            const st = s.trim();
            if (!st) continue;
            if (buf && (buf.length + st.length > 140)) {
              result.push(buf.trim());
              buf = st;
            } else {
              buf = buf ? (buf + ' ' + st) : st;
            }
          }
          if (buf.trim()) result.push(buf.trim());
        } else {
          result.push(t);
        }
      }
      return result.filter(s => s && s.length > 1);
    }

        for (const lk of sortedMlttLigatures) {

            out.push(MLTT_LIGATURES[lk]);
            i += lk.length;
            matched = true;
            break;
          }
        }
        if (matched) continue;

        // Check 2-char prebase (ss, sm, tm, su)
        if (i + 1 < n && ['ss', 'sm', 'tm', 'su'].includes(s.slice(i, i + 2))) {
          const pb = s.slice(i, i + 2);
          const vowel = { 'ss': 'ൈ', 'sm': 'ൊ', 'tm': 'ോ', 'su': 'ൌ' }[pb];
          i += 2;
          if (i < n) {
            const c = s[i];
            if (MLTT_GLYPHS[c]) { out.push(MLTT_GLYPHS[c] + vowel); i++; }
            else if (MLTT_CHARS[c]) { out.push(MLTT_CHARS[c] + vowel); i++; }
            else { out.push(c + vowel); i++; }
          }
          continue;
        }

        // Check 1-char prebase (s = െ, t = േ)
        if ((s[i] === 's' || s[i] === 't') && i + 1 < n && (MLTT_CHARS[s[i + 1]] || MLTT_GLYPHS[s[i + 1]])) {
          const vowel = s[i] === 's' ? 'െ' : 'േ';
          i++;
          const c = s[i];
          if (MLTT_GLYPHS[c]) { out.push(MLTT_GLYPHS[c] + vowel); i++; }
          else if (MLTT_CHARS[c]) { out.push(MLTT_CHARS[c] + vowel); i++; }
          else { out.push(c + vowel); i++; }
          continue;
        }

        const c = s[i];
        if (MLTT_GLYPHS[c]) out.push(MLTT_GLYPHS[c]);
        else if (MLTT_CHARS[c]) out.push(MLTT_CHARS[c]);
        else out.push(c);
        i++;
      }

      let res = out.join('');
      // Strip intra-word syllable hyphens
      res = res.replace(/([\u0D00-\u0D7F])-([\u0D00-\u0D7F])/g, '$1$2');
      return res;
    }

    function normalizeMalayalamUnicode(text) {
      if (!text) return '';
      return text.replace(/([\u0D00-\u0D7F])\s+([\u0D3E-\u0D4D\u0D57\u0D02\u0D03])/g, '$1$2').normalize('NFC');
    }

    async function getPageSentences(pNum) {
      if (pageTextCache[pNum]) return pageTextCache[pNum];
      let rawText = '';
      if (pdf && pNum <= pdf.numPages) {
        const page = await pdf.getPage(pNum);
        const content = await page.getTextContent();
        const parts = [];
        for (const it of content.items) {
          const itemText = (it.str || '').replace(/\s+/g, ' ').trim();
          if (!itemText) continue;
          if (parts.length) parts.push(it.hasEOL ? '\n' : ' ');
          parts.push(itemText);
        }
        rawText = parts.join('');
      } else {
        rawText = el('reader')?.innerText || '';
      }

      const clean = rawText
        .replace(/\0/g, '')
        .replace(/(\b[a-zA-Z]+)-[ \t]*\n[ \t]*([a-zA-Z]+\b)/g, '$1$2')
        .replace(/[ \t]+/g, ' ')
        .replace(/ *\n */g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .replace(/\s+([,.;:!?])/g, '$1')
        .replace(/([([{])\s+/g, '$1')
        .normalize('NFC')
        .trim();

      let processedText = clean;
      // Only run ML-TT ASCII converter if the text does NOT already contain genuine Malayalam Unicode
      // AND explicitly contains ML-TT font signatures
      const hasMalayalamUnicode = /[\u0D00-\u0D7F]/.test(processedText);
      const hasMlttSignature = /(?:ae-bmf|kmln-|samUyqÄ|Bß-|F¶|XmWv|s\s*k\s*a\s*-\s*Ì|sNdp-IY|tIÄ¡m|PohnXw|Fgp-Xp|DÛ-hw|tNÀ¶mWv|sslZ-cm-en)/.test(processedText);
      if (!hasMalayalamUnicode && hasMlttSignature) {
        processedText = convertMlttToMalayalam(processedText);
      }
      processedText = sanitizeMalayalam(processedText);
      processedText = normalizeMalayalamUnicode(processedText);

      const sentences = splitIntoNaturalSentences(processedText);
      pageTextCache[pNum] = sentences;
      return sentences;
    }

    // --- HIGH-FIDELITY MALAYALAM SPEECH PLAYER ---
    // Uses Google's neural Malayalam TTS audio stream with automatic sentence chunking & SpeechSynthesis fallback
        // --- HIGH-FIDELITY MALAYALAM SPEECH PLAYER ---
    // Uses Google's neural Malayalam TTS audio stream with automatic sentence chunking & robust multi-source fallbacks
    function playMalayalamSpeechQueue(text, speed, onComplete, runToken) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }

      const clean = sanitizeMalayalam(text).trim();
      if (!clean) {
        if (onComplete && runToken === voiceRunToken) onComplete();
        return;
      }

      const words = clean.split(/\s+/);
      const chunks = [];
      let current = '';
      for (const w of words) {
        if ((current + ' ' + w).trim().length > 150) {
          if (current) chunks.push(current.trim());
          current = w;
        } else {
          current = current ? (current + ' ' + w) : w;
        }
      }
      if (current) chunks.push(current.trim());

      let chunkIdx = 0;
      const isCurrent = () => runToken === voiceRunToken && isVoicePlaying && !isVoicePaused;

      function playNextChunk() {
        if (!isCurrent()) return;
        if (chunkIdx >= chunks.length) {
          currentAudio = null;
          if (onComplete) onComplete();
          return;
        }

        const chunk = chunks[chunkIdx++];
        const baseRate = Math.max(0.8, Math.min(1.4, (speed || 1.0) * (selectedGender === 'male' ? 0.94 : 1.0)));
        let chunkFinished = false;

        const advance = () => {
          if (chunkFinished || !isCurrent()) return;
          chunkFinished = true;
          currentAudio = null;
          playNextChunk();
        };

        // Source 1: Cloudflare Worker / Google TTS proxy
        const workerUrl = '/api/tts?tl=ml&q=' + encodeURIComponent(chunk);
        const audioWorker = new Audio(workerUrl);
        audioWorker.playbackRate = baseRate;
        currentAudio = audioWorker;

        let fallback1Started = false;
        const tryDirectGoogle = () => {
          if (fallback1Started || !isCurrent()) return;
          fallback1Started = true;
          audioWorker.pause();
          currentAudio = null;

          // Source 2: Direct Google Translate TTS
          const directUrl = 'https://translate.google.com/translate_tts?ie=UTF-8&tl=ml&client=tw-ob&q=' + encodeURIComponent(chunk);
          const audioDirect = new Audio(directUrl);
          audioDirect.playbackRate = baseRate;
          currentAudio = audioDirect;

          let fallback2Started = false;
          const tryGoogleGtx = () => {
            if (fallback2Started || !isCurrent()) return;
            fallback2Started = true;
            audioDirect.pause();
            currentAudio = null;

            // Source 3: Google APIs GTX TTS
            const gtxUrl = 'https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=ml&q=' + encodeURIComponent(chunk);
            const audioGtx = new Audio(gtxUrl);
            audioGtx.playbackRate = baseRate;
            currentAudio = audioGtx;

            let fallback3Started = false;
            const trySpeechSynthesis = () => {
              if (fallback3Started || !isCurrent()) return;
              fallback3Started = true;
              audioGtx.pause();
              currentAudio = null;

              // Source 4: Microsoft Online / Browser SpeechSynthesis
              if ('speechSynthesis' in window) {
                const ut = new SpeechSynthesisUtterance(chunk);
                ut.lang = 'ml-IN';
                ut.rate = (speed || 1.0) * 0.90;
                ut.pitch = selectedGender === 'male' ? 0.86 : 1.08;
                const mlVoice = getSmartVoice(selectedGender, true);
                if (mlVoice) ut.voice = mlVoice;
                currentUtterance = ut;
                ut.onend = advance;
                ut.onerror = advance;
                try {
                  window.speechSynthesis.speak(ut);
                } catch (_) {
                  advance();
                }
              } else {
                advance();
              }
            };

            audioGtx.onended = advance;
            audioGtx.onerror = trySpeechSynthesis;
            audioGtx.play().catch(trySpeechSynthesis);
          };

          audioDirect.onended = advance;
          audioDirect.onerror = tryGoogleGtx;
          audioDirect.play().catch(tryGoogleGtx);
        };

        audioWorker.onended = advance;
        audioWorker.onerror = tryDirectGoogle;
        audioWorker.play().catch(tryDirectGoogle);
      }

      playNextChunk();
    }

    async function playBrowserEnglishTTS(text, speed, onComplete, runToken) {
      if (!('speechSynthesis' in window)) {
        if (onComplete && runToken === voiceRunToken) onComplete();
        return;
      }
      await waitForVoices();

    async function speakSentence(sentences, idx, pNum) {
      if (!isVoicePlaying || isVoicePaused) return;

      const runToken = ++voiceRunToken;
      const isCurrent = () => runToken === voiceRunToken && isVoicePlaying && !isVoicePaused;
      if (idx >= sentences.length) {
        if (el('voiceContinuousCheck').checked && pdf && pNum < pdf.numPages) {
          go(pNum + 1);
          startReadingPage(pNum + 1, 0);
        } else {
          stopVoice();
          el('voiceStatusText').textContent = 'വായന പൂർത്തിയായി (Finished reading)';
          const tEn = el('teleprompterEn');
          const tMl = el('teleprompterMl');

          if (tMl) tMl.textContent = 'ആവശ്യമെങ്കിൽ വീണ്ടും പ്ലേ ചെയ്യുക.';
        }
        return;
      }

      currentSentenceIdx = idx;
      currentReadingPage = pNum;
      const sentence = sentences[idx];

      // Auto-scroll to the current reading page and highlight it
      document.querySelectorAll('.pdf-page').forEach(p => p.classList.remove('active-reading-page'));
      const activeSection = sections[pNum - 1] || document.querySelector(`.pdf-page[data-page="${pNum}"]`);
      if (activeSection) {
        activeSection.classList.add('active-reading-page');
        activeSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      if (pageNumber !== pNum) {
        pageNumber = pNum;
        controls();
      }

      const totalP = pdf ? pdf.numPages : 1;
      const genderLabel = selectedGender === 'female' ? 'സ്ത്രീ സ്വരം' : 'പുരുഷ സ്വരം';
      const modeLabel = voiceMode === 'mal' ? '🇮🇳 മലയാളം വോയ്സ് (Google Reader)' : voiceMode === 'both' ? '🗣️ ദ്വിഭാഷ (English + Google Mal)' : voiceMode === 'en2ml' ? '🌐 ഇംഗ്ലീഷ് ➔ മലയാളം' : '🇬🇧 English Reading';
      el('voiceStatusText').textContent = '🔊 ' + genderLabel + ' · ' + modeLabel + ' · പേജ് ' + pNum + '/' + totalP + ' · വാചകം ' + (idx + 1) + '/' + sentences.length;

      if (currentAudio) {

        currentAudio = null;
      }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      const speed = Number(el('voiceSpeedSelect').value) || 1.0;
      const isEnglish = /[a-zA-Z]{3,}/.test(sentence);
      const tEn = el('teleprompterEn');
      const tMl = el('teleprompterMl');
      const onNext = () => {

          malText = await translateEnglishToMalayalam(sentence);

        playMalayalamSpeechQueue(malText, speed, onNext, runToken);
      } else if (voiceMode === 'both') {
        if (tEn) tEn.textContent = '🇬🇧 ' + sentence;
        if (isEnglish) {
          playEnglishSpeech(sentence, speed, async () => {
            if (!isCurrent()) return;
            if (tMl) tMl.textContent = '⏳ മലയാളത്തിലേക്ക് മാറ്റുന്നു…';
            const malText = await translateEnglishToMalayalam(sentence);
            if (!isCurrent()) return;
            if (tMl) tMl.textContent = '🔊 ' + malText;
            playMalayalamSpeechQueue(malText, speed, onNext, runToken);
          }, runToken);
        } else {
          const san = sanitizeMalayalam(sentence);
          if (tMl) tMl.textContent = '🔊 ' + san;
          playMalayalamSpeechQueue(san, speed, onNext, runToken);
        }
      } else if (voiceMode === 'en2ml') {
        if (isEnglish) {
          if (tEn) tEn.textContent = '🇬🇧 ' + sentence;
          if (tMl) tMl.textContent = '⏳ മലയാളത്തിലേക്ക് മാറ്റുന്നു…';
          const malText = await translateEnglishToMalayalam(sentence);
          if (!isCurrent()) return;
          if (tMl) tMl.textContent = '🔊 ' + malText;
          playMalayalamSpeechQueue(malText, speed, onNext, runToken);

          const san = sanitizeMalayalam(sentence);
          if (tEn) tEn.textContent = '';
          if (tMl) tMl.textContent = '🔊 ' + san;
          playMalayalamSpeechQueue(san, speed, onNext, runToken);
        }
      } else {
        // English only
        if (tEn) tEn.textContent = '🇬🇧 ' + sentence;
        if (tMl) tMl.textContent = '';
        if (isEnglish) {
          playEnglishSpeech(sentence, speed, onNext, runToken);
        } else {
          const san = sanitizeMalayalam(sentence);
          if (tMl) tMl.textContent = '🔊 ' + san;
          playMalayalamSpeechQueue(san, speed, onNext, runToken);
        }
      }

    async function startReadingPage(pageNum, startIdx = 0) {

    // Automatically finds the actual chapter start, skipping cover pages and headers
    async function findChapterIntroStart() {
      if (!pdf) return { page: pageNumber || 1, index: 0 };
      // If user is already reading a later page, start from that current page!
      if (pageNumber > 1) {
        return { page: pageNumber, index: 0 };
      }
      const searchLimit = Math.min(pdf.numPages, 10);
      const chapterHeading = /^(?:chapter|unit|module|അധ്യായം|പാഠം|മൊഡ്യൂൾ|ഭാഗം|overview|introduction|learning objectives|1\.[0-9]+)\b/i;
      const skipKeywords = /^(?:university of calicut|school of distance education|study material|prepared by|scrutinized by|contents|syllabus|b\.a\.|b\.com)\b/i;

      for (let page = 1; page <= searchLimit; page++) {
        const sentences = await getPageSentences(page);
        if (!sentences || !sentences.length) continue;
        
        // Find if this page has a chapter heading
        const idx = sentences.findIndex(s => chapterHeading.test(s.trim()));
        if (idx >= 0) {
          return { page, index: idx };
        }
        
        // If not page 1 and not purely cover material, start from this page
        if (page > 1) {
          const hasCoverWords = sentences.slice(0, 3).some(s => skipKeywords.test(s.trim()));
          if (!hasCoverWords) {
            return { page, index: 0 };
          }
        }
      }
      return { page: 1, index: 0 };
    }

    async function startChapterReading() {
      const scanToken = ++voiceRunToken;
      isVoicePlaying = true;
      isVoicePaused = false;
      updateVoiceUIState();
      el('voiceStatusText').textContent = 'അധ്യായം കണ്ടെത്തുന്നു…';
      el('voiceDot').className = 'voice-indicator-dot active';
      try {
        const start = await findChapterIntroStart();
        if (scanToken !== voiceRunToken || !isVoicePlaying || isVoicePaused) return;
        go(start.page);
        await startReadingPage(start.page, start.index);
      } catch (err) {
        if (scanToken === voiceRunToken) {
          console.error('Chapter search error:', err);
          el('voiceStatusText').textContent = 'വായനയിൽ തടസ്സം: ' + (err.message || '');
          stopVoice();
        }
      }
    }

    function pauseVoice() {

    function resumeVoice() {
      if (!isVoicePlaying) {
        startChapterReading();

    // Subjects Drawer Controller
    document.getElementById('readerBackBtn')?.addEventListener('click', () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html#subjects';
      }
    });
    const subjectsBtn = document.getElementById('subjectsBtn');
    const closeDrawerBtn = document.getElementById('closeDrawerBtn');
    const drawerBackdrop = document.getElementById('subjectsDrawerBackdrop');
    const drawer = document.getElementById('subjectsDrawer');
    const drawerContent = document.getElementById('drawerContent');
    const drawerSearchInput = document.getElementById('drawerSearchInput');
    const activeDocBadge = document.getElementById('activeDocBadge');

    function toggleSubjectsDrawer(forceState) {
      const open = typeof forceState === 'boolean' ? forceState : !drawer.classList.contains('open');
      drawer.classList.toggle('open', open);
      drawerBackdrop.classList.toggle('open', open);
      if (open) {
        drawerSearchInput.focus();
        renderDrawerList(drawerSearchInput.value);
      }
    }

    if (subjectsBtn) subjectsBtn.onclick = () => toggleSubjectsDrawer();
    if (closeDrawerBtn) closeDrawerBtn.onclick = () => toggleSubjectsDrawer(false);
    if (drawerBackdrop) drawerBackdrop.onclick = () => toggleSubjectsDrawer(false);

    // Filter pills in drawer
    let activeCategoryFilter = 'all';
    document.querySelectorAll('.drawer-pill-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.drawer-pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategoryFilter = btn.dataset.cat;
        renderDrawerList(drawerSearchInput.value);
      };
    });

    if (drawerSearchInput) {
      drawerSearchInput.oninput = (e) => renderDrawerList(e.target.value);
    }

    function renderDrawerList(filterText = '') {
      drawerContent.replaceChildren();
      const term = filterText.toLowerCase().trim();
      const curFile = (new URLSearchParams(location.search).get('file') || '').toLowerCase();

      ALL_SUBJECTS_CATALOG.forEach(subj => {
        if (activeCategoryFilter !== 'all' && subj.category !== activeCategoryFilter) return;

        // Check search match
        const matchesSubj = subj.name.toLowerCase().includes(term) || (subj.description && subj.description.toLowerCase().includes(term));
        const matchedModules = [];

        subj.modules.forEach(mod => {
          const matchedChapters = mod.chapters.filter(ch => 
            matchesSubj || ch.title.toLowerCase().includes(term) || (ch.desc && ch.desc.toLowerCase().includes(term)) || ch.file.toLowerCase().includes(term)
          );
          if (matchedChapters.length > 0) {
            matchedModules.push({ name: mod.name, chapters: matchedChapters });
          }
        });

        if (term && matchedModules.length === 0) return;

        const isCurrentSubj = curFile && subj.modules.some(m => m.chapters.some(c => curFile.includes(c.file.toLowerCase().split('/').pop())));

        const card = document.createElement('div');
        card.className = 'drawer-subject-card' + (isCurrentSubj ? ' active-subject expanded' : (term ? ' expanded' : ''));

        const header = document.createElement('div');
        header.className = 'drawer-subject-header';
        header.innerHTML = `
          <div class="drawer-subject-info">
            <span class="drawer-subject-icon">${subj.icon}</span>
            <div>
              <div class="drawer-subject-name">${subj.name}</div>
              <div style="font-size:11px;color:#64748b;">${subj.modules.length} Modules · ${subj.modules.reduce((a,m)=>a+m.chapters.length,0)} PDFs</div>
            </div>
          </div>
          <span class="drawer-subject-badge">${subj.tag}</span>
        `;
        header.onclick = () => card.classList.toggle('expanded');

        const modContainer = document.createElement('div');
        modContainer.className = 'drawer-subject-modules';

        const modulesToShow = term ? matchedModules : subj.modules;
        modulesToShow.forEach(mod => {
          const mb = document.createElement('div');
          mb.className = 'drawer-mod-block';
          mb.innerHTML = `<div class="drawer-mod-title">${mod.name}</div>`;

          mod.chapters.forEach(ch => {
            const chLink = document.createElement('div');
            const isActiveCh = curFile && curFile.includes(ch.file.toLowerCase().split('/').pop());
            chLink.className = 'drawer-chapter-link' + (isActiveCh ? ' active-chapter' : '');
            chLink.innerHTML = `
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">📄 ${ch.title}</span>
              <span style="font-size:10.5px;opacity:0.7;flex-shrink:0;">Read ➔</span>
            `;
            chLink.onclick = (e) => {
              e.stopPropagation();
              toggleSubjectsDrawer(false);
              switchDocument(ch.file, ch.title, subj.name);
            };
            mb.append(chLink);
          });
          modContainer.append(mb);
        });

        card.append(header, modContainer);
        drawerContent.append(card);
      });
    }

    // Switch Document Function (0ms reload, in-place streaming)
    function switchDocument(relPath, title, subjectName) {
      const newUrl = new URL(location.href);
      newUrl.searchParams.set('file', relPath);
      history.pushState(null, title || '', newUrl.href);

      if (activeDocBadge) {
        activeDocBadge.textContent = (subjectName ? subjectName + ' · ' : '') + (title || relPath.split('/').pop());
      }
      document.title = (title || relPath.split('/').pop()) + ' · Academic Hub';

      // Clear current canvas cache and re-initialize
      pageCanvasCache.clear();
      initDocument();
    }

    // Render Welcome Subject Hub when no file is selected
    function showWelcomeSubjectHub() {
      const reader = el('reader');
      reader.replaceChildren();
      document.querySelector('.toolbar').hidden = false;
      el('status').textContent = '📚 Select any of the 11 subjects to start reading';

      const hub = document.createElement('div');
      hub.className = 'welcome-hub';
      hub.innerHTML = `
        <div class="welcome-hero">
          <h1>📚 Calicut University Academic Hub — PDF Reader</h1>
          <p>Instant high-speed reader for all 11 Subjects & 173 Chapters. Choose a subject below or use the search bar.</p>
          <div class="welcome-search-box">
            <input type="search" id="welcomeSearch" class="welcome-search-input" placeholder="🔍 Search subjects, chapters or topics...">
          </div>
        </div>
        <div id="welcomeGrid" class="welcome-grid"></div>
      `;

      const grid = hub.querySelector('#welcomeGrid');
      const search = hub.querySelector('#welcomeSearch');

      function renderGrid(term = '') {
        grid.replaceChildren();
        const t = term.toLowerCase().trim();

        ALL_SUBJECTS_CATALOG.forEach(subj => {
          const matchSubj = subj.name.toLowerCase().includes(t) || (subj.description && subj.description.toLowerCase().includes(t));
          const allChs = [];
          subj.modules.forEach(m => m.chapters.forEach(c => {
            if (!t || matchSubj || c.title.toLowerCase().includes(t) || c.file.toLowerCase().includes(t)) {
              allChs.push(c);
            }
          }));

          if (t && allChs.length === 0) return;

          const card = document.createElement('div');
          card.className = 'welcome-card';
          card.innerHTML = `
            <div class="welcome-card-header">
              <span class="welcome-card-icon">${subj.icon}</span>
              <div>
                <div class="welcome-card-title">${subj.name}</div>
                <div class="welcome-card-desc">${subj.description || subj.tag}</div>
              </div>
            </div>
            <div style="font-size:11px;font-weight:750;color:#2563eb;margin-top:4px;">
              ${subj.modules.length} Modules · ${allChs.length} Chapters
            </div>
            <div class="welcome-card-chapters">
              ${allChs.slice(0, 5).map(c => `
                <a href="?file=${encodeURIComponent(c.file)}" class="welcome-ch-btn" data-file="${c.file}" data-title="${c.title}">
                  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">📄 ${c.title}</span>
                  <span>➔</span>
                </a>
              `).join('')}
              ${allChs.length > 5 ? `<div style="text-align:center;font-size:11px;color:#64748b;margin-top:2px;">+ ${allChs.length - 5} more chapters in drawer</div>` : ''}
            </div>
          `;

          card.querySelectorAll('.welcome-ch-btn').forEach(btn => {
            btn.onclick = (e) => {
              e.preventDefault();
              switchDocument(btn.dataset.file, btn.dataset.title, subj.name);
            };
          });

          grid.append(card);
        });
      }

      search.oninput = (e) => renderGrid(e.target.value);
      renderGrid();
      reader.append(hub);
    }
  
    // Expose helpers globally
    window.switchDocument = switchDocument;
    window.toggleSubjectsDrawer = toggleSubjectsDrawer;
    window.showWelcomeSubjectHub = showWelcomeSubjectHub;

    // Run document initialization
    initDocument();
  

    window.toggleNativeReader = function() {
      const fileParam = new URLSearchParams(location.search).get('file');
      if (!fileParam) return;
      const cleanUrl = fileParam.split('#')[0];
      const nativeContainer = document.getElementById('nativePdfContainer');
      const customReader = document.getElementById('reader');
      const btn = document.getElementById('fastNativeBtn');
      
      if (nativeContainer && nativeContainer.style.display !== 'none') {
        nativeContainer.style.display = 'none';
        nativeContainer.innerHTML = '';
        if (customReader) customReader.style.display = 'flex';
        if (btn) { btn.innerHTML = '⚡ Fast View'; btn.style.background = 'linear-gradient(135deg, #059669, #10b981)'; }
        if (el('status')) el('status').textContent = 'Enhanced Reader active';
      } else {
        let nc = nativeContainer;
        if (!nc) {
          nc = document.createElement('div');
          nc.id = 'nativePdfContainer';
          nc.style.cssText = 'position:fixed; top:48px; left:0; width:100%; height:calc(100% - 48px); z-index:90; background:#525659;';
          document.body.append(nc);
        }
        nc.innerHTML = '<iframe src="' + cleanUrl + '#toolbar=1&navpanes=1&zoom=page-width" style="width:100%; height:100%; border:none;" title="Fast Native PDF View"></iframe>';
        nc.style.display = 'block';
        if (customReader) customReader.style.display = 'none';
        if (btn) { btn.innerHTML = '📖 Enhanced View'; btn.style.background = 'linear-gradient(135deg, #4338ca, #6366f1)'; }
        if (el('status')) el('status').textContent = '⚡ Instant Native Reader active';
      }
    };
    
</script>
  <div id="zoomHud" role="status" aria-live="polite">🔍 100%</div>


</body>
</html>
