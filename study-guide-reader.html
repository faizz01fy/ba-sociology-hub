  <title>Study Guide Reader · Academic Hub</title>
  <script>
    (() => {
      const search = location.search || '';
      let file = '';
      const m = search.match(/[?&]file=(.*?)(?:&(?:tab|voice|v|lang|page|zoom)=|$)/i);
      if (m && m[1]) {
        file = m[1];
      } else {
        file = new URLSearchParams(search).get('file') || '';
      }
      try { file = decodeURIComponent(file); } catch(_) {}
      try { if (file.includes('%')) file = decodeURIComponent(file); } catch(_) {}
      file = file.trim().replace(/^['"]|['"]$/g, '');

      let tab = '';
      const tabMatch = search.match(/[?&]tab=([^&#]*)/i);
      if (tabMatch && tabMatch[1]) tab = tabMatch[1].toLowerCase();
      else tab = (new URLSearchParams(search).get('tab') || '').toLowerCase();

      const voice = new URLSearchParams(search).get('voice');

      if (!file && (tab === 'malayalam_reading' || tab === 'reading' || tab === 'malayalam')) {
        file = 'Malayalam_Complete_Study_Guide.pdf';
      }

      // Voice reading is ONLY enabled for Malayalam subject LMS PDF tab (mal-pdf.html).
      // For Malayalam Reading tabs of all subjects, voice reading is strictly disabled & hidden.
      const isLmsTab = (tab === 'lms' || tab === 'lmspdf' || tab === 'lms-pdf');
      const isNonLmsTab = (
        tab === 'malayalam_reading' ||
        tab === 'reading' ||
        tab === 'study_guide' ||
        tab === 'study-guide' ||
        tab === 'mcq' ||
        tab === 'mcq_pdf' ||
        tab === 'mcq-pdf' ||
        voice === '0'
      );

      if (!isLmsTab || isNonLmsTab) {
        document.documentElement.classList.add('hide-voice-controls');
        window.hideVoiceReader = true;
      } else {
        document.documentElement.classList.remove('hide-voice-controls');
        window.hideVoiceReader = false;
      }
      window.isMalayalamDoc = /(?:malayalam|മലയാളം|_mal|ch\d+.*mal|LiteraryPractice|MODULE4|Module3.*മലയാള)/i.test(file);
    })();
  </script>

  <p id="status" role="status" aria-live="polite">Loading study guide…</p>
  <main id="reader" aria-label="All study guide pages"></main>

  <script type="module">
    const el = id => document.getElementById(id);
    
    // Security & interaction controls
    document.addEventListener('contextmenu', event => { event.preventDefault(); return false; }, true);
    document.addEventListener('dragstart', event => event.preventDefault());
    document.addEventListener('keydown', event => {
      if ((event.ctrlKey || event.metaKey) && ['s', 'p', 'u'].includes(event.key.toLowerCase())) {
        event.preventDefault();
      }
    });

        let pdf, pageNumber = 1, generation = 0, observer, pageTrackingObserver, sections = [];
    const activeTasks = new Map();
    let renderQueue = [];
    let isProcessingQueue = false;
    let customZoomScale = null;

    function controls() {
      const hasPdf = Boolean(pdf);
      el('page').disabled = !hasPdf;
      el('prevPage').disabled = !hasPdf || pageNumber <= 1;
      el('nextPage').disabled = !hasPdf || (pdf && pageNumber >= pdf.numPages);
      el('zoom').disabled = !hasPdf;
      el('zoomOut').disabled = !hasPdf;
      el('zoomIn').disabled = !hasPdf;
      el('page').value = pageNumber;
      el('pages').textContent = '/ ' + (pdf ? pdf.numPages : '…');
    }

    const fitScale = (page) => {
      const original = page.getViewport({ scale: 1 });
      const isMobile = window.innerWidth <= 768;
      
      if (customZoomScale !== null) {
        return Math.max(0.3, Math.min(3.5, customZoomScale));
      }
      
      const zVal = el('zoom').value;
      if (zVal === 'fit') {
        const availWidth = el('reader').clientWidth || window.innerWidth;
        const padding = isMobile ? 4 : 32;
        return Math.max(0.25, Math.min(3.0, (availWidth - padding) / original.width));
      }
      if (zVal === 'read') {
        // Dedicated comfortable reading mode: 135% of fit width or minimum 1.25
        const availWidth = el('reader').clientWidth || window.innerWidth;
        const baseFit = (availWidth - 4) / original.width;
        return Math.max(1.20, Math.min(2.5, baseFit * 1.35));
      }
      return Number(zVal);
    };

    function cancelAllActiveTasks() {
      for (const [sec, task] of activeTasks.entries()) {
        try { task.cancel(); } catch(_) {}
      }
      activeTasks.clear();
      renderQueue = [];
      isProcessingQueue = false;
    }

    function enqueuePage(section) {
      if (!section || section.dataset.rendered === 'true' || section.dataset.rendering === 'true') return;
      if (!renderQueue.includes(section)) {
        renderQueue.push(section);
      }
      processRenderQueue();
    }

    async function processRenderQueue() {
      if (isProcessingQueue) return;
      isProcessingQueue = true;
      while (renderQueue.length > 0) {
        // Sort queue dynamically so pages closest to currently viewed pageNumber render FIRST
        renderQueue.sort((a, b) => {
          const distA = Math.abs(Number(a.dataset.page) - pageNumber);
          const distB = Math.abs(Number(b.dataset.page) - pageNumber);
          return distA - distB;
        });
        const next = renderQueue.shift();
        if (next && next.dataset.rendered !== 'true' && next.dataset.rendering !== 'true') {
          await renderPage(next);
        }
      }
      isProcessingQueue = false;
    }

    async function renderPage(section, knownPage) {
      if (section.dataset.rendered === 'true' || section.dataset.rendering === 'true') return;
      const currentGeneration = generation;
      const number = Number(section.dataset.page);
      section.dataset.rendering = 'true';

      try {
        const page = knownPage || await pdf.getPage(number);
        if (currentGeneration !== generation) return;

        const viewport = page.getViewport({ scale: fitScale(page) });
        section.style.width = viewport.width + 'px';
        section.style.minHeight = (viewport.height + 24) + 'px';

        // Remove any old canvas or link layers to guarantee zero duplicate rendering
        const oldCanvas = section.querySelector('canvas');
        if (oldCanvas) oldCanvas.remove();
        const oldLinks = section.querySelector('.pdf-link-layer');
        if (oldLinks) oldLinks.remove();

        const canvas = document.createElement('canvas');
        // Ultra-fast mobile rendering (1.0x ratio on phones cuts render time & memory by 55%)
        const isMobileScreen = window.innerWidth <= 768;
        const dpr = window.devicePixelRatio || 1;
        const ratio = isMobileScreen ? 1.0 : Math.min(Math.max(dpr, 1), 1.5);

        canvas.width = Math.floor(viewport.width * ratio);
        canvas.height = Math.floor(viewport.height * ratio);
        canvas.style.width = viewport.width + 'px';
        canvas.style.height = viewport.height + 'px';
        canvas.setAttribute('role', 'img');
        canvas.setAttribute('aria-label', 'Study guide page ' + number + ' of ' + pdf.numPages);

        // Alpha: false provides instant 2x-3x GPU compositor acceleration & eliminates scroll jank
        const ctx = canvas.getContext('2d', { alpha: false });
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        section.append(canvas);

        const task = page.render({
          canvasContext: ctx,
          viewport,
          transform: ratio !== 1 ? [ratio, 0, 0, ratio, 0, 0] : null
        });
        activeTasks.set(section, task);

        try {
          await task.promise;
        } finally {
          activeTasks.delete(section);
        }

        if (currentGeneration !== generation) return;
        section.dataset.rendered = 'true';
        section.querySelector('.page-loading')?.remove();
        if (Number(section.dataset.page) === pageNumber && el('status')) {
          el('status').textContent = pdf.numPages + ' pages · Scroll or use ‹ › buttons to read';
        }

        // Link Annotation Layer
        try {
          const annotations = await page.getAnnotations();
          if (annotations && annotations.length) {
            const linkLayer = document.createElement('div');
            linkLayer.className = 'pdf-link-layer';
            linkLayer.style.cssText = 'position:absolute;top:0;left:0;width:' + viewport.width + 'px;height:' + viewport.height + 'px;pointer-events:none;';
            annotations.forEach(a => {
              if (a.subtype === 'Link' && a.url) {
                const r = viewport.convertToViewportRectangle(a.rect);
                const l = Math.min(r[0], r[2]);
                const t = Math.min(r[1], r[3]);
                const w = Math.abs(r[2] - r[0]);
                const h = Math.abs(r[3] - r[1]);
                const link = document.createElement('a');
                link.href = a.url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.style.cssText = 'position:absolute;left:' + l + 'px;top:' + t + 'px;width:' + w + 'px;height:' + h + 'px;pointer-events:auto;cursor:pointer;background:rgba(59,130,246,0.12);border-radius:3px;transition:background 0.15s;';
                link.title = (a.url.includes('youtu') ? 'Watch video: ' : 'Open link: ') + a.url;
                link.onmouseenter = () => link.style.background = 'rgba(59,130,246,0.28)';
                link.onmouseleave = () => link.style.background = 'rgba(59,130,246,0.12)';
                linkLayer.append(link);
              }
            });
            section.append(linkLayer);
          }
        } catch (err) {
          console.error('Annotation layer error:', err);
        }
      } catch (error) {
        if (currentGeneration !== generation || error?.name === 'RenderingCancelledException') return;
        section.querySelector('canvas')?.remove();
        const label = section.querySelector('.page-loading');
        if (label) label.textContent = 'Could not display this page. Tap Retry to try again.';
        el('retry').hidden = false;
      } finally {
        delete section.dataset.rendering;
      }
    }

    async function render() {
      if (!pdf) return;
      const currentGeneration = ++generation;
      const resumePage = Math.max(1, Math.min(pdf.numPages, pageNumber));

      if (observer) observer.disconnect();
      if (pageTrackingObserver) pageTrackingObserver.disconnect();
      cancelAllActiveTasks();

      el('reader').replaceChildren();
      sections = [];
      el('status').textContent = 'Loading page ' + resumePage + ' of ' + pdf.numPages + '…';

      const firstPage = await pdf.getPage(1);
      if (currentGeneration !== generation) return;

      const isMobile = window.innerWidth <= 768;
      const estimate = firstPage.getViewport({ scale: fitScale(firstPage) });

      // Synchronously generate placeholder cards using DocumentFragment (single reflow)
      const fragment = document.createDocumentFragment();
      for (let number = 1; number <= pdf.numPages; number++) {
        const section = document.createElement('section');
        section.className = 'pdf-page';
        section.dataset.page = number;
        section.setAttribute('aria-label', 'Page ' + number);
        section.style.width = estimate.width + 'px';
        section.style.minHeight = (estimate.height + 24) + 'px';

        const label = document.createElement('div');
        label.className = 'page-label';
        label.textContent = 'Page ' + number + ' of ' + pdf.numPages;

        const loading = document.createElement('div');
        loading.className = 'page-loading';
        loading.textContent = 'Loading page ' + number + '…';

        section.append(label, loading);
        fragment.append(section);
        sections.push(section);
      }
      el('reader').append(fragment);

      pageNumber = resumePage;
      controls();
      pageNumber = resumePage;
      controls();

      // Render the current/resume page immediately with zero lag
      const resumeSec = sections[resumePage - 1];
      await renderPage(resumeSec, resumePage === 1 ? firstPage : null);
      if (currentGeneration !== generation) return;

      if (resumeSec.dataset.rendered === 'true') {
        el('status').textContent = pdf.numPages + ' pages · Scroll or use ‹ › buttons to read';
      } else if (resumeSec.dataset.rendering !== 'true') {
        el('status').textContent = 'Could not display page ' + resumePage + '. Tap Retry to try again.';
      }

      // Efficient view observer for on-demand lazy rendering
      observer = new IntersectionObserver(entries => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          observer.unobserve(entry.target);
          enqueuePage(entry.target);
        }
      }, { rootMargin: '350px 0px' });

      sections.forEach(sec => {
        if (sec.dataset.rendered !== 'true') observer.observe(sec);
      });

      // Off-main-thread active page tracker (zero layout reflow)
      pageTrackingObserver = new IntersectionObserver((entries) => {
        const intersecting = entries.filter(e => e.isIntersecting);
        if (intersecting.length > 0) {
          intersecting.sort((a, b) => Math.abs(a.boundingClientRect.top) - Math.abs(b.boundingClientRect.top));
          const p = Number(intersecting[0].target.dataset.page);
          if (p && p !== pageNumber && document.activeElement !== el('page')) {
            pageNumber = p;
            el('page').value = pageNumber;
            controls();
          }
        }
      }, { rootMargin: '-10% 0px -70% 0px' });

      sections.forEach(sec => pageTrackingObserver.observe(sec));
    }

    function go(number, smooth = true) {
      if (!pdf) return;
      pageNumber = Math.max(1, Math.min(pdf.numPages, Math.round(Number(number) || 1)));
      const targetSec = sections[pageNumber - 1];
      if (targetSec) {
        targetSec.scrollIntoView({ block: 'start', behavior: smooth ? 'smooth' : 'auto' });
        if (targetSec.dataset.rendered !== 'true') {
          enqueuePage(targetSec);
        }
      }
      controls();
    }

    // Event listeners for page navigation
    el('page').onchange = event => go(event.target.value);
    el('prevPage').onclick = () => { if (pageNumber > 1) go(pageNumber - 1); };
    el('nextPage').onclick = () => { if (pdf && pageNumber < pdf.numPages) go(pageNumber + 1); };

    // --- ZOOM & PINCH CONTROLLER ---
    let hudTimeout = null;
    function showZoomHud(scale, text) {
      const hud = el('zoomHud');
      if (!hud) return;
      const display = text || (Math.round(scale * 100) + '%');
      hud.textContent = '🔍 ' + display;
      hud.classList.add('visible');
      clearTimeout(hudTimeout);
      hudTimeout = setTimeout(() => {
        hud.classList.remove('visible');
      }, 1200);
    }

    function updateZoomDropdown(scale) {
      const zoomSel = el('zoom');
      if (!zoomSel) return;
      const percent = Math.round(scale * 100);
      let customOpt = zoomSel.querySelector('option[data-pinch="true"]');
      if (!customOpt) {
        customOpt = document.createElement('option');
        customOpt.setAttribute('data-pinch', 'true');
        zoomSel.insertBefore(customOpt, zoomSel.children[2] || null);
      }
      customOpt.value = scale.toFixed(2);
      customOpt.textContent = '🔍 ' + percent + '%';
      zoomSel.value = customOpt.value;
    }

    function getCurrentScale() {
      if (customZoomScale !== null) return customZoomScale;
      if (sections[0]) {
        try {
          const w = parseFloat(sections[0].style.width);
          if (w && w > 0) {
            // Calculate effective scale based on first page section
            return Math.max(0.35, Math.min(3.8, w / 595.0));
          }
        } catch (e) {}
      }
      return 1.0;
    }

    // Zoom event listeners
    el('zoom').onchange = () => {
      customZoomScale = null;
      render();
    };

    el('zoomIn').onclick = () => {
      if (!pdf) return;
      const current = getCurrentScale();
      const next = Math.min(3.8, Math.round((current + 0.20) * 100) / 100);
      customZoomScale = next;
      updateZoomDropdown(next);
      showZoomHud(next);
      render();
    };

    el('zoomOut').onclick = () => {
      if (!pdf) return;
      const current = getCurrentScale();
      const next = Math.max(0.35, Math.round((current - 0.20) * 100) / 100);
      customZoomScale = next;
      updateZoomDropdown(next);
      showZoomHud(next);
      render();
    };

    // Touch Pinch-to-Zoom (2-Finger Smooth Scaling & Sharp Snapping)
    let isPinching = false;
    let pinchStartDist = 0;
    let pinchStartScale = 1;
    let pinchCenter = { x: 0, y: 0 };
    let currentPinchRatio = 1;
    const readerEl = el('reader');

    function getTouchDist(t1, t2) {
      return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    }

    function getTouchMid(t1, t2) {
      return {
        x: (t1.clientX + t2.clientX) / 2,
        y: (t1.clientY + t2.clientY) / 2
      };
    }

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2 && pdf) {
        isPinching = true;
        pinchStartDist = getTouchDist(e.touches[0], e.touches[1]);
        pinchCenter = getTouchMid(e.touches[0], e.touches[1]);
        pinchStartScale = getCurrentScale();
        currentPinchRatio = 1;
        readerEl.style.transition = 'none';
        showZoomHud(pinchStartScale);
      }
    }, { passive: false });

    // --- MALAYALAM UNICODE SANITIZER & REPAIR ---
    // Fixes broken, duplicated diacritics, split chillus, and invalid combining characters extracted from PDFs
    function sanitizeMalayalam(text) {
      if (!text) return '';
      let s = text
        .replace(/\xad/g, '')
        .replace(/\u200b/g, '')
        .replace(/\u200c/g, '')
        .replace(/\0/g, '')
        .replace(/([\u0D00-\u0D7F])-\s*\n\s*([\u0D00-\u0D7F])/g, '$1$2')
        // Deduplicate doubled matras / signs (Chromium PDF printing artifact): ൈൈ -> ൈ, െെ -> െ, േേ -> േ, ാാ -> ാ, ിി -> ി, ീീ -> ീ, ംം -> ം, ുു -> ു, ൂൂ -> ൂ
        .replace(/([\u0D3E-\u0D4D\u0D57\u0D02\u0D03])\1+/g, '$1')
        .replace(/([െേൈ])\1+/g, '$1')
        .replace(/([ാിീുൂൃംഃ])\1+/g, '$1')
        // Fix isolated vowel signs preceded by space: മ ൊ -> മൊ
        .replace(/([\u0D00-\u0D7F])\s+([\u0D3E-\u0D4D\u0D57\u0D02\u0D03])/g, '$1$2')
        // Repair split words and syllables broken across space/newline
        .replace(/ഹൈ\s+ദരാലി/g, 'ഹൈദരാലി')
        .replace(/സെ\s+പ്റ്റംബർ/g, 'സെപ്റ്റംബർ')
        .replace(/സാഹിത്യാ\s*നുശീലനം/g, 'സാഹിത്യാനുശീലനം')
        .replace(/അധ്യാ\s*യം/g, 'അധ്യായം')
        .replace(/ഗുരു\s*നാഥനെ/g, 'ഗുരുനാഥനെ')
        .replace(/ഓർക്കു\s*മ്പോൾ/g, 'ഓർക്കുമ്പോൾ')
        .replace(/കലാ\s*മണ്ഡലം/g, 'കലാമണ്ഡലം')
        .replace(/അങ്ക\s*മാലി/g, 'അങ്കമാലി')
        .replace(/കമ്മട്ടി\s*പ്പാടം/g, 'കമ്മട്ടിപ്പാടം')
        .replace(/വിസ്മ\s*യം/g, 'വിസ്മയം')
        .replace(/ജീവി\s*തം/g, 'ജീവിതം')
        .replace(/ആത്മ\s*കഥ/g, 'ആത്മകഥ')
        .replace(/പ്രവേ\s*ശനം/g, 'പ്രവേശനം')
        .replace(/നിഷേ\s*ധം/g, 'നിഷേധം')
        .replace(/വിദ്വേ\s*ഷമോ/g, 'വിദ്വേഷമോ')
        .replace(/സന്ദേ\s*ശം/g, 'സന്ദേശം')
        .replace(/ഉള്ള\s*ടക്കം/g, 'ഉള്ളടക്കം')
        .replace(/ണ്‍/g, 'ൺ')
        .replace(/ന്‍/g, 'ൻ')
        .replace(/ര്‍/g, 'ർ')
        .replace(/ല്‍/g, 'ൽ')
        .replace(/ള്‍/g, 'ൾ')
        .replace(/ക്‍/g, 'ൿ')
        .replace(/[ \t]+/g, ' ')
        .normalize('NFC');
      return s;
    }

    // --- LIVE ENGLISH TO MALAYALAM TRANSLATION ENGINE ---
    // Translates pristine English sentences from the PDF to fluent, natural Malayalam in real-time
    async function translateEnglishToMalayalam(text) {
      const clean = text.trim();
      if (!clean) return '';
      if (translationCache[clean]) return translationCache[clean];

      // If predominantly Malayalam already, sanitize and return
      const mlMatches = clean.match(/[ഀ-ൿ]/g) || [];
      if (mlMatches.length > clean.length * 0.4) {
        const san = sanitizeMalayalam(clean);
        translationCache[clean] = san;
        return san;
      }

      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ml&dt=t&q=${encodeURIComponent(clean)}`;
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8000);
        try {
          const res = await fetch(url, { signal: controller.signal });
          if (res.ok) {
            const data = await res.json();
            const translated = (data[0] || []).map(p => p[0]).filter(Boolean).join('');
            if (translated) {
              const san = sanitizeMalayalam(translated);
              translationCache[clean] = san;
              return san;
            }
          }
        } finally {
          clearTimeout(timeout);
        }
      } catch (err) {
        console.warn('Live translation fallback to sanitized:', err);
      }
      return sanitizeMalayalam(clean);
    }

    function isVoiceForGender(voice, gender) {
      const label = (voice.name || '') + ' ' + (voice.voiceURI || '');
      return gender === 'male' ? maleVoiceName.test(label) : femaleVoiceName.test(label);
    }

        function getSmartVoice(gender, isMalayalam) {
      if (!allVoices.length) return null;
      if (isMalayalam) {
        const mlVoices = allVoices.filter(v => (v.lang || '').toLowerCase().startsWith('ml'));
        if (mlVoices.length) {
          const gMatch = mlVoices.find(v => isVoiceForGender(v, gender));
          if (gMatch) return gMatch;
          return mlVoices[0];
        }
        const indVoices = allVoices.filter(v => /(?:-in\b|india|hindi|tamil)/i.test((v.lang || '') + ' ' + (v.name || '')));
        if (indVoices.length) {
          const gMatch = indVoices.find(v => isVoiceForGender(v, gender));
          if (gMatch) return gMatch;
          return indVoices[0];
        }
        return null;
      }

      const ukEnglishVoices = getUKEnglishVoices();
      if (!isMalayalam && selectedUKVoiceKey !== 'auto') {
        const chosen = ukEnglishVoices.find(v => getVoiceKey(v) === selectedUKVoiceKey);
        if (chosen) return chosen;
      }
      const matchingGender = ukEnglishVoices.filter(v => isVoiceForGender(v, gender));
      const naturalMatch = matchingGender.find(v => /natural|neural|online|google/i.test((v.name || '') + ' ' + (v.voiceURI || '')));
      if (naturalMatch || matchingGender.length) return naturalMatch || matchingGender[0];

      const saferFallback = ukEnglishVoices.find(v => gender === 'male'
        ? !femaleVoiceName.test((v.name || '') + ' ' + (v.voiceURI || ''))
        : !maleVoiceName.test((v.name || '') + ' ' + (v.voiceURI || '')));
      return saferFallback || ukEnglishVoices[0] || null;
    }

    function getEnglishVoiceByDialect(targetLang, gender) {
      if (!allVoices.length) return null;
      const prefix = targetLang.toLowerCase();
      const dialectVoices = allVoices.filter(v => (v.lang || '').replace(/_/g, '-').toLowerCase().startsWith(prefix));
      const pool = dialectVoices.length ? dialectVoices : allVoices.filter(v => (v.lang || '').toLowerCase().startsWith('en'));

      const genderPool = pool.filter(v => isVoiceForGender(v, gender));
      const neuralGender = genderPool.find(v => /natural|neural|online|google/i.test((v.name || '') + ' ' + (v.voiceURI || '')));
      if (neuralGender) return neuralGender;
      if (genderPool.length) return genderPool[0];

      const neuralAny = pool.find(v => /natural|neural|online|google/i.test((v.name || '') + ' ' + (v.voiceURI || '')));
      if (neuralAny) return neuralAny;
      return pool[0] || null;
    }

    function splitIntoNaturalSentences(text) {
      if (!text) return [];
      const prepared = text.replace(/(^|\n)[ \t]*(Introductory\s+Notes?|Intro\s+Notes?|Introduction(?:\s+Note)?)[ \t]*(?=\n|$)/gim, '\n\n$2\n\n');
      const rawChunks = prepared.split(/(?<=[.!?।])\s+|\n{2,}/);
      const result = [];
      for (const chunk of rawChunks) {
        const t = chunk.trim();
        if (!t) continue;
        if (t.length > 150) {
          const sub = t.split(/(?<=[,;:\-])\s+/);
          let buf = '';
          for (const s of sub) {
            const st = s.trim();
            if (!st) continue;
            if (buf && (buf.length + st.length > 140)) {
              result.push(buf.trim());
              buf = st;
            } else {
              buf = buf ? (buf + ' ' + st) : st;
            }
          }
          if (buf.trim()) result.push(buf.trim());
        } else {
          result.push(t);
        }
      }
      return result.filter(s => s && s.length > 1);
    }

    const sortedMlttLigatures = Object.keys(MLTT_LIGATURES).sort((a, b) => b.length - a.length);

    function convertMlttToMalayalam(s) {
      if (!s) return '';
      const out = [];
      let i = 0;
      const n = s.length;
      while (i < n) {
        let matched = false;
        for (const lk of sortedMlttLigatures) {
          if (s.startsWith(lk, i)) {
            out.push(MLTT_LIGATURES[lk]);
            i += lk.length;
            matched = true;
            break;
          }
        }
        if (matched) continue;

        // Check 2-char prebase (ss, sm, tm, su)
        if (i + 1 < n && ['ss', 'sm', 'tm', 'su'].includes(s.slice(i, i + 2))) {
          const pb = s.slice(i, i + 2);
          const vowel = { 'ss': 'ൈ', 'sm': 'ൊ', 'tm': 'ോ', 'su': 'ൌ' }[pb];
          i += 2;
          if (i < n) {
            const c = s[i];
            if (MLTT_GLYPHS[c]) { out.push(MLTT_GLYPHS[c] + vowel); i++; }
            else if (MLTT_CHARS[c]) { out.push(MLTT_CHARS[c] + vowel); i++; }
            else { out.push(c + vowel); i++; }
          }
          continue;
        }

        // Check 1-char prebase (s = െ, t = േ)
        if ((s[i] === 's' || s[i] === 't') && i + 1 < n && (MLTT_CHARS[s[i + 1]] || MLTT_GLYPHS[s[i + 1]])) {
          const vowel = s[i] === 's' ? 'െ' : 'േ';
          i++;
          const c = s[i];
          if (MLTT_GLYPHS[c]) { out.push(MLTT_GLYPHS[c] + vowel); i++; }
          else if (MLTT_CHARS[c]) { out.push(MLTT_CHARS[c] + vowel); i++; }
          else { out.push(c + vowel); i++; }
          continue;
        }

        const c = s[i];
        if (MLTT_GLYPHS[c]) out.push(MLTT_GLYPHS[c]);
        else if (MLTT_CHARS[c]) out.push(MLTT_CHARS[c]);
        else out.push(c);
        i++;
      }

      let res = out.join('');
      // Strip intra-word syllable hyphens
      res = res.replace(/([\u0D00-\u0D7F])-([\u0D00-\u0D7F])/g, '$1$2');
      return res;
    }

    function normalizeMalayalamUnicode(text) {
      if (!text) return '';
      return text.replace(/([\u0D00-\u0D7F])\s+([\u0D3E-\u0D4D\u0D57\u0D02\u0D03])/g, '$1$2').normalize('NFC');
    }

    async function getPageSentences(pNum) {
      if (pageTextCache[pNum]) return pageTextCache[pNum];
      let rawText = '';
      if (pdf && pNum <= pdf.numPages) {
        const page = await pdf.getPage(pNum);
        const content = await page.getTextContent();
        const parts = [];
        for (const it of content.items) {
          const itemText = (it.str || '').replace(/\s+/g, ' ').trim();
          if (!itemText) continue;
          if (parts.length) parts.push(it.hasEOL ? '\n' : ' ');
          parts.push(itemText);
        }
        rawText = parts.join('');
      } else {
        rawText = el('reader')?.innerText || '';
      }

      const clean = rawText
        .replace(/\0/g, '')
        .replace(/(\b[a-zA-Z]+)-[ \t]*\n[ \t]*([a-zA-Z]+\b)/g, '$1$2')
        .replace(/[ \t]+/g, ' ')
        .replace(/ *\n */g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .replace(/\s+([,.;:!?])/g, '$1')
        .replace(/([([{])\s+/g, '$1')
        .normalize('NFC')
        .trim();

      let processedText = clean;
      // Only run ML-TT ASCII converter if the text does NOT already contain genuine Malayalam Unicode
      // AND explicitly contains ML-TT font signatures
      const hasMalayalamUnicode = /[\u0D00-\u0D7F]/.test(processedText);
      const hasMlttSignature = /(?:ae-bmf|kmln-|samUyqÄ|Bß-|F¶|XmWv|s\s*k\s*a\s*-\s*Ì|sNdp-IY|tIÄ¡m|PohnXw|Fgp-Xp|DÛ-hw|tNÀ¶mWv|sslZ-cm-en)/.test(processedText);
      if (!hasMalayalamUnicode && hasMlttSignature) {
        processedText = convertMlttToMalayalam(processedText);
      }
      processedText = sanitizeMalayalam(processedText);
      processedText = normalizeMalayalamUnicode(processedText);

      const sentences = splitIntoNaturalSentences(processedText);
      pageTextCache[pNum] = sentences;
      return sentences;
    }

        // --- HIGH-FIDELITY MALAYALAM SPEECH PLAYER ---

    function playMalayalamSpeechQueue(text, speed, onComplete, runToken) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }

      const clean = sanitizeMalayalam(text).trim();
      if (!clean) {
        if (onComplete && runToken === voiceRunToken) onComplete();
        return;
      }

      const words = clean.split(/\s+/);
      const chunks = [];
      let current = '';
      for (const w of words) {
        if ((current + ' ' + w).trim().length > 150) {
          if (current) chunks.push(current.trim());
          current = w;
        } else {
          current = current ? (current + ' ' + w) : w;
        }
      }
      if (current) chunks.push(current.trim());

      let chunkIdx = 0;
      const isCurrent = () => runToken === voiceRunToken && isVoicePlaying && !isVoicePaused;

      function playNextChunk() {
        if (!isCurrent()) return;
        if (chunkIdx >= chunks.length) {
          currentAudio = null;
          if (onComplete) onComplete();
          return;
        }

        const chunk = chunks[chunkIdx++];
        const baseRate = Math.max(0.8, Math.min(1.4, (speed || 1.0) * (selectedGender === 'male' ? 0.94 : 1.0)));
        let chunkFinished = false;

        const advance = () => {
          if (chunkFinished || !isCurrent()) return;
          chunkFinished = true;
          currentAudio = null;
          playNextChunk();
        };

        // Source 1: Cloudflare Worker / Google TTS proxy
        const workerUrl = '/api/tts?tl=ml&q=' + encodeURIComponent(chunk);
        const audioWorker = new Audio(workerUrl);
        audioWorker.playbackRate = baseRate;
        currentAudio = audioWorker;

        let fallback1Started = false;
        const tryDirectGoogle = () => {
          if (fallback1Started || !isCurrent()) return;
          fallback1Started = true;
          audioWorker.pause();
          currentAudio = null;

          // Source 2: Direct Google Translate TTS
          const directUrl = 'https://translate.google.com/translate_tts?ie=UTF-8&tl=ml&client=tw-ob&q=' + encodeURIComponent(chunk);
          const audioDirect = new Audio(directUrl);
          audioDirect.playbackRate = baseRate;
          currentAudio = audioDirect;

          let fallback2Started = false;
          const tryGoogleGtx = () => {
            if (fallback2Started || !isCurrent()) return;
            fallback2Started = true;
            audioDirect.pause();
            currentAudio = null;

            // Source 3: Google APIs GTX TTS
            const gtxUrl = 'https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=ml&q=' + encodeURIComponent(chunk);
            const audioGtx = new Audio(gtxUrl);
            audioGtx.playbackRate = baseRate;
            currentAudio = audioGtx;

            let fallback3Started = false;
            const trySpeechSynthesis = () => {
              if (fallback3Started || !isCurrent()) return;
              fallback3Started = true;
              audioGtx.pause();
              currentAudio = null;

              // Source 4: Microsoft Online / Browser SpeechSynthesis
              if ('speechSynthesis' in window) {
                const ut = new SpeechSynthesisUtterance(chunk);
                ut.lang = 'ml-IN';
                ut.rate = (speed || 1.0) * 0.90;
                ut.pitch = selectedGender === 'male' ? 0.86 : 1.08;
                const mlVoice = getSmartVoice(selectedGender, true);
                if (mlVoice) ut.voice = mlVoice;
                currentUtterance = ut;
                ut.onend = advance;
                ut.onerror = advance;
                try {
                  window.speechSynthesis.speak(ut);
                } catch (_) {
                  advance();
                }
              } else {
                advance();
              }
            };

            audioGtx.onended = advance;
            audioGtx.onerror = trySpeechSynthesis;
            audioGtx.play().catch(trySpeechSynthesis);
          };

          audioDirect.onended = advance;
          audioDirect.onerror = tryGoogleGtx;
          audioDirect.play().catch(tryGoogleGtx);
        };

        audioWorker.onended = advance;
        audioWorker.onerror = tryDirectGoogle;
        audioWorker.play().catch(tryDirectGoogle);
      }

      playNextChunk();
    }

    async function playBrowserEnglishTTS(text, speed, onComplete, runToken) {
      if (!('speechSynthesis' in window)) {
        if (onComplete && runToken === voiceRunToken) onComplete();
        return;
      }
      await waitForVoices();
      if (runToken !== voiceRunToken || !isVoicePlaying || isVoicePaused) return;

      const engEngine = el('englishEngineSelect')?.value || 'uk';
      const targetLang = engEngine === 'us' ? 'en-US' : 'en-GB';

      ut.lang = targetLang;
      const enVoice = getEnglishVoiceByDialect(targetLang, selectedGender);

        ? (selectedGender === 'male' ? 0.88 : 1.12)

        if (completed || runToken !== voiceRunToken || !isVoicePlaying || isVoicePaused) return;

      } else if (voiceMode === 'en2ml') {
        if (isEnglish) {
          if (tEn) tEn.textContent = '🇬🇧 ' + sentence;
          if (tMl) tMl.textContent = '⏳ മലയാളത്തിലേക്ക് മാറ്റുന്നു…';
          const malText = await translateEnglishToMalayalam(sentence);
          if (!isCurrent()) return;
          if (tMl) tMl.textContent = '🔊 ' + malText;
          playMalayalamSpeechQueue(malText, speed, onNext, runToken);
        } else {
          const san = sanitizeMalayalam(sentence);
          if (tEn) tEn.textContent = '';
          if (tMl) tMl.textContent = '🔊 ' + san;
          playMalayalamSpeechQueue(san, speed, onNext, runToken);
        }
      } else {
        // English only
        if (tEn) tEn.textContent = '🇬🇧 ' + sentence;
        if (tMl) tMl.textContent = '';
        if (isEnglish) {
          playEnglishSpeech(sentence, speed, onNext, runToken);
        } else {
          const san = sanitizeMalayalam(sentence);
          if (tMl) tMl.textContent = '🔊 ' + san;
          playMalayalamSpeechQueue(san, speed, onNext, runToken);
        }
      }
    }

    async function startReadingPage(pageNum, startIdx = 0) {
      isVoicePlaying = true;
      isVoicePaused = false;
      currentReadingPage = pageNum;
      updateVoiceUIState();

      el('voiceStatusText').textContent = `പേജ് ${pageNum} ടെക്സ്റ്റ് ലോഡ് ചെയ്യുന്നു…`;
      el('voiceDot').className = 'voice-indicator-dot active';

      try {
        const sentences = await getPageSentences(pageNum);
        currentSentences = sentences;
        if (!sentences || sentences.length === 0) {
          const tEn = el('teleprompterEn');
          const tMl = el('teleprompterMl');
          if (tEn) tEn.textContent = `(പേജ് ${pageNum}-ൽ വായിക്കാവുന്ന വാചകങ്ങൾ ലഭ്യമല്ല)`;
          if (tMl) tMl.textContent = '';
          if (el('voiceContinuousCheck').checked && pdf && pageNum < pdf.numPages) {
            setTimeout(() => {
              if (isVoicePlaying) {
                go(pageNum + 1);
                startReadingPage(pageNum + 1, 0);
              }
            }, 1000);
          } else {
            stopVoice();
            el('voiceStatusText').textContent = `പേജ് ${pageNum}-ൽ ടെക്സ്റ്റ് ലഭ്യമല്ല`;
          }
          return;
        }

        currentSentenceIdx = Math.max(0, Math.min(sentences.length - 1, startIdx));
        speakSentence(sentences, currentSentenceIdx, pageNum);
      } catch (err) {
        console.error('Text extraction error:', err);
        el('voiceStatusText').textContent = 'വായനയിൽ തടസ്സം: ' + (err.message || '');
        stopVoice();
      }
    }

    // Automatically finds the actual chapter start, skipping cover pages and headers
    async function findChapterIntroStart() {
      if (!pdf) return { page: pageNumber || 1, index: 0 };
      // If user is already reading a later page, start from that current page!
      if (pageNumber > 1) {
        return { page: pageNumber, index: 0 };
      }
      const searchLimit = Math.min(pdf.numPages, 10);
      const chapterHeading = /^(?:chapter|unit|module|അധ്യായം|പാഠം|മൊഡ്യൂൾ|ഭാഗം|overview|introduction|learning objectives|1\.[0-9]+)\b/i;
      const skipKeywords = /^(?:university of calicut|school of distance education|study material|prepared by|scrutinized by|contents|syllabus|b\.a\.|b\.com)\b/i;

      for (let page = 1; page <= searchLimit; page++) {
        const sentences = await getPageSentences(page);
        if (!sentences || !sentences.length) continue;
        
        // Find if this page has a chapter heading
        const idx = sentences.findIndex(s => chapterHeading.test(s.trim()));
        if (idx >= 0) {
          return { page, index: idx };
        }
        
        // If not page 1 and not purely cover material, start from this page
        if (page > 1) {
          const hasCoverWords = sentences.slice(0, 3).some(s => skipKeywords.test(s.trim()));
          if (!hasCoverWords) {
            return { page, index: 0 };
          }
        }
      }
      return { page: 1, index: 0 };
    }

    async function startChapterReading() {
      const scanToken = ++voiceRunToken;
      isVoicePlaying = true;
      isVoicePaused = false;
      updateVoiceUIState();
      el('voiceStatusText').textContent = 'അധ്യായം കണ്ടെത്തുന്നു…';
      el('voiceDot').className = 'voice-indicator-dot active';
      try {
        const start = await findChapterIntroStart();
        if (scanToken !== voiceRunToken || !isVoicePlaying || isVoicePaused) return;
        go(start.page);
        await startReadingPage(start.page, start.index);
      } catch (err) {
        if (scanToken === voiceRunToken) {
          console.error('Chapter search error:', err);
          el('voiceStatusText').textContent = 'വായനയിൽ തടസ്സം: ' + (err.message || '');
          stopVoice();
        }
      }
    }

    function pauseVoice() {
      if (!isVoicePlaying) return;
      isVoicePaused = true;
      if (currentAudio) {
        currentAudio.pause();
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.pause();
      }
      updateVoiceUIState();
      el('voiceStatusText').textContent = `⏸ താത്കാലികമായി നിർത്തി (Paused at sentence ${currentSentenceIdx + 1})`;
    }

    function resumeVoice() {
      if (!isVoicePlaying) {
        startChapterReading();
        return;
      }
      isVoicePaused = false;
      if (currentAudio && currentAudio.paused) {
        currentAudio.play().catch(() => {
          speakSentence(currentSentences, currentSentenceIdx, currentReadingPage);
        });
      } else if (window.speechSynthesis && window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      } else if (currentSentences.length > 0) {
        speakSentence(currentSentences, currentSentenceIdx, currentReadingPage);
      }
      updateVoiceUIState();
    }

    function stopVoice() {
      isVoicePlaying = false;
      isVoicePaused = false;
      voiceRunToken++;
      currentUtterance = null;
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      updateVoiceUIState();
    }

    function toggleVoicePanel(forceOpen = false) {
      if (window.hideVoiceReader) return;
      const panel = el('voicePanel');
      const btn = el('voiceToggleBtn');
      const shouldOpen = forceOpen ? true : panel.hidden;
      panel.hidden = !shouldOpen;
      if (shouldOpen) {
        btn.classList.add('active');
        if (!isVoicePlaying) {
          startChapterReading();
        }
      } else {
        btn.classList.remove('active');
      }
    }

    // Voice UI Event Listeners
    el('voiceToggleBtn').onclick = () => toggleVoicePanel();
    el('closeVoicePanelBtn').onclick = () => {
      el('voicePanel').hidden = true;
      el('voiceToggleBtn').classList.remove('active');
    };

    el('voicePlayBtn').onclick = () => {
      if (isVoicePlaying && !isVoicePaused) {
        pauseVoice();
      } else if (isVoicePlaying && isVoicePaused) {
        resumeVoice();
      } else {
        startChapterReading();
      }
    };

    el('voiceStopBtn').onclick = () => {
      stopVoice();
      const tEn = el('teleprompterEn');
      const tMl = el('teleprompterMl');
      if (tEn) tEn.textContent = 'വായന നിർത്തി. വീണ്ടും ആരംഭിക്കാൻ ▶ അമർത്തുക.';
      if (tMl) tMl.textContent = '';
      el('voiceStatusText').textContent = 'ശബ്ദ വായന നിർത്തി (Stopped)';
    };

    el('voicePrevSentBtn').onclick = () => {
      if (currentSentenceIdx > 0) {
        speakSentence(currentSentences, currentSentenceIdx - 1, currentReadingPage);
      } else if (currentReadingPage > 1) {
        go(currentReadingPage - 1);
        startReadingPage(currentReadingPage - 1, 0);
      }
    };

    el('voiceNextSentBtn').onclick = () => {
      if (currentSentenceIdx < currentSentences.length - 1) {
        speakSentence(currentSentences, currentSentenceIdx + 1, currentReadingPage);
      } else if (pdf && currentReadingPage < pdf.numPages) {
        go(currentReadingPage + 1);
        startReadingPage(currentReadingPage + 1, 0);
      }
    };

    // Voice Mode Buttons
    const modeBtns = [el('modeEn2MlBtn'), el('modeEnBtn'), el('modeBothBtn')].filter(Boolean);
    modeBtns.forEach(btn => {
      btn.onclick = () => {
        modeBtns.forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-checked', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-checked', 'true');
        voiceMode = btn.dataset.mode;
        if (isVoicePlaying && !isVoicePaused && currentSentences.length) {
          speakSentence(currentSentences, currentSentenceIdx, currentReadingPage);
        }
      };
    });

    function restartCurrentSentenceForVoiceChange() {
      if (!isVoicePlaying || !currentSentences.length) return;
      // Restart the current sentence so changes also apply while playback is paused.
      isVoicePaused = false;
      updateVoiceUIState();
      speakSentence(currentSentences, currentSentenceIdx, currentReadingPage);
    }

    // Gender Switcher
        // Mode pills event listeners
    document.querySelectorAll('.mode-pill').forEach(pill => {
      pill.onclick = () => {
        document.querySelectorAll('.mode-pill').forEach(p => {
          p.classList.remove('active');
          p.setAttribute('aria-checked', 'false');
        });
        pill.classList.add('active');
        pill.setAttribute('aria-checked', 'true');
        voiceMode = pill.getAttribute('data-mode') || 'en';
        if (isVoicePlaying && !isVoicePaused && currentSentences.length) {
          speakSentence(currentSentences, currentSentenceIdx, currentReadingPage);
        }
      };
    });

    const gFem = el('genderFemaleBtn');
    const gMale = el('genderMaleBtn');
    if (gFem && gMale) {
      const selectGender = gender => {
        selectedGender = gender;
        selectedUKVoiceKey = 'auto';
        if (el('ukVoiceSelect')) el('ukVoiceSelect').value = 'auto';
        // Return to the gender-aware tone so switching always has an audible effect
        // when the system has no gender-labelled UK voice installed.
        if (el('voicePitchSelect')) el('voicePitchSelect').value = 'auto';
        updateUKVoiceHint();
        const female = gender === 'female';
        gFem.classList.toggle('active', female);
        gFem.setAttribute('aria-checked', String(female));
        gMale.classList.toggle('active', !female);
        gMale.setAttribute('aria-checked', String(!female));
        restartCurrentSentenceForVoiceChange();
      };
      gFem.onclick = () => selectGender('female');
      gMale.onclick = () => selectGender('male');
    }

    if (el('ukVoiceSelect')) el('ukVoiceSelect').onchange = () => {
      selectedUKVoiceKey = el('ukVoiceSelect').value || 'auto';
      updateUKVoiceHint();
      restartCurrentSentenceForVoiceChange();
    };

    el('voicePitchSelect').onchange = restartCurrentSentenceForVoiceChange;
    if (el('englishEngineSelect')) {
      el('englishEngineSelect').onchange = () => {
        if (isVoicePlaying && !isVoicePaused && currentSentences.length) {
          speakSentence(currentSentences, currentSentenceIdx, currentReadingPage);
        }
      };
    }
    el('voiceSpeedSelect').onchange = restartCurrentSentenceForVoiceChange;

    // Cross-frame message bus
    window.addEventListener('message', event => {
      if (!event.data) return;
      if (window.hideVoiceReader) return;
      if (event.data.action === 'toggleVoiceReader') {
        toggleVoicePanel(true);
      } else if (event.data.action === 'stopVoiceReader') {
        stopVoice();
      }
    });

    window.addEventListener('beforeunload', () => {
      stopVoice();
    });
    window.addEventListener('pagehide', () => {
      stopVoice();
    });


    el('retry').onclick = () => location.reload();

    async function initDocument() {
    try {
      const search = location.search || '';
      if (new URLSearchParams(search).get('prewarm') === '1') {
        // Prewarm PDF.js engine and worker in background
        const localDistUrl = new URL('assets/pdfjs/pdf.min.mjs', location.href).href;
        const localWorkerUrl = new URL('assets/pdfjs/pdf.worker.min.mjs', location.href).href;
        try {
          const lib = await import(localDistUrl);
          lib.GlobalWorkerOptions.workerSrc = localWorkerUrl;
        } catch(_) {}
        return;
      }
      let rawParam = '';

      // Match ?file=... or &file=... stopping only at recognized next query parameters or end of string
      const fileMatch = search.match(/[?&]file=(.*?)(?:&(?:tab|voice|v|lang|page|zoom)=|$)/i);
      if (fileMatch && fileMatch[1]) {
        rawParam = fileMatch[1];
      } else {
        rawParam = new URLSearchParams(search).get('file') || '';
      }

      // If truncated before .pdf / .docx (due to unescaped '&' in filename like Q&A.pdf), recover from full search
      if (!rawParam.toLowerCase().includes('.pdf') && !rawParam.toLowerCase().includes('.docx')) {
        const fallbackMatch = search.match(/[?&]file=([^#]+)/i);
        if (fallbackMatch && fallbackMatch[1]) {
          const candidate = fallbackMatch[1].split('&tab=')[0].split('&voice=')[0].split('&v=')[0];
          if (candidate.toLowerCase().includes('.pdf') || candidate.toLowerCase().includes('.docx')) {
            rawParam = candidate;
          }
        }
      }

      // Decode URI components safely (handles single or double encoding e.g. %2526, %2520, %E0...)
      try {
        rawParam = decodeURIComponent(rawParam);
      } catch (_) {}
      try {
        if (rawParam.includes('%25') || rawParam.includes('%20') || rawParam.includes('%26') || /%[0-9a-fA-F]{2}/.test(rawParam)) {
          rawParam = decodeURIComponent(rawParam);
        }
      } catch (_) {}

      rawParam = rawParam.trim().replace(/^['"]|['"]$/g, '');

      // Check tab parameter
      let tabParam = '';
      const tabMatch = search.match(/[?&]tab=([^&#]*)/i);
      if (tabMatch && tabMatch[1]) tabParam = tabMatch[1].toLowerCase();
      else tabParam = (new URLSearchParams(search).get('tab') || '').toLowerCase();

      // If file parameter is empty or unspecified, provide intelligent default or clean empty state
      if (!rawParam || rawParam === 'study-guide-reader.html') {
        if (tabParam === 'malayalam_reading' || tabParam === 'malayalam' || tabParam === 'reading') {
          rawParam = 'Malayalam_Complete_Study_Guide.pdf';
        } else {
          document.querySelector('.toolbar').hidden = false;
          el('retry').hidden = true;
          el('status').textContent = 'പഠന സഹായി തിരഞ്ഞെടുക്കുക · Please select a study guide or chapter to read.';
          return;
        }
      }

      // Strip internal query or hash strings from inside filename (e.g. file.pdf?v=123)
      const cleanParam = rawParam.split('?')[0].split('#')[0].trim();

      const file = new URL(cleanParam, location.href);
      if (location.origin && location.origin !== 'null' && file.origin !== location.origin) {
        throw Error('Invalid study guide');
      }

      const normPath = decodeURIComponent(file.pathname).trim().toLowerCase();
      const normParam = cleanParam.toLowerCase();

      const isDocx = normPath.endsWith('.docx') || normParam.endsWith('.docx') || normPath.includes('.docx');
      const isPdf = normPath.endsWith('.pdf') || normParam.endsWith('.pdf') || normPath.includes('.pdf') || normParam.includes('.pdf');
      const isHtml = normPath.endsWith('.html') || normPath.endsWith('.htm') || normParam.endsWith('.html');

      if (isHtml) {
        location.replace(file.href);
        return;
      }

      if (isDocx) {
        document.querySelector('.toolbar').hidden = false;
        document.body.classList.add('docx-mode');
        const vGrp = el('voiceToolbarGroup');
        if (vGrp) vGrp.style.display = 'flex';
        el('pages').textContent = '/ Docx';
        el('page').value = '1';
        el('prevPage').disabled = true;
        el('nextPage').disabled = true;
        el('zoomOut').disabled = true;
        el('zoom').disabled = true;
        el('zoomIn').disabled = true;
        el('status').textContent = 'Loading Word document…';
        const font = document.createElement('link');
        font.rel = 'stylesheet';
        font.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;500;600;700;800&display=swap';
        document.head.append(font);

        if (!window.JSZip) await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
        if (!window.docx?.renderAsync) await loadScript('https://cdn.jsdelivr.net/npm/docx-preview@0.3.6/dist/docx-preview.min.js');

        const response = await fetch(file.href);
        if (!response.ok) throw Error('Could not fetch Word document (HTTP ' + response.status + ')');
        if (!window.docx?.renderAsync) throw Error('Word document viewer did not load');

        await window.docx.renderAsync(await response.arrayBuffer(), el('reader'), el('reader'), {
          className: 'docx',
          inWrapper: true,
          breakPages: true,
          ignoreLastRenderedPageBreak: false
        });
        el('status').textContent = 'Word document loaded · Scroll to read the complete module';

      } else if (isPdf) {
        let lib;
        const localDistUrl = new URL('assets/pdfjs/pdf.min.mjs', location.href).href;
        const localWorkerUrl = new URL('assets/pdfjs/pdf.worker.min.mjs', location.href).href;
        try {
          lib = await import(localDistUrl);
          lib.GlobalWorkerOptions.workerSrc = localWorkerUrl;
        } catch (localErr) {
          console.warn('Local PDF engine failed to load, falling back to CDN...', localErr);
          let cdn = 'https://cdn.jsdelivr.net/npm';
          try {
            lib = await import(cdn + '/pdfjs-dist@4.10.38/build/pdf.min.mjs');
          } catch (error) {
            cdn = 'https://unpkg.com';
            lib = await import(cdn + '/pdfjs-dist@4.10.38/build/pdf.min.mjs');
          }
          lib.GlobalWorkerOptions.workerSrc = cdn + '/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
        }
        
                        // Lightning-fast streaming loader: Progressive Page 1 first-paint
        const cMapUrl = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/cmaps/';
        pdf = await lib.getDocument({
          url: file.href,
          cMapUrl: cMapUrl,
          cMapPacked: true,
          enableXfa: false,
          isEvalSupported: false,
          disableAutoFetch: true,
          disableStream: false
        }).promise;

        el('page').max = pdf.numPages;
        // Default to "fit" on mobile, takes 100% of the screen width with high-DPI crisp rendering
        if (window.innerWidth <= 768) {
          el('zoom').value = 'fit';
        }
                controls();
        await render();

        if (!window.hideVoiceReader && (new URLSearchParams(location.search).get('voice') === '1')) {
          setTimeout(() => {
            toggleVoicePanel(true);
          }, 350);
        }

      } else {
        throw Error('Unsupported study guide format');
      }
    } catch (error) {
      console.error(error);
      document.querySelector('.toolbar').hidden = false;
      el('retry').hidden = false;
      el('status').textContent = 'Reader error: ' + (error?.message || 'Unknown error') + '. Tap Retry to try again.';
    }
    }
    initDocument();
  </script>
  <div id="zoomHud" role="status" aria-live="polite">🔍 100%</div>
</body>
