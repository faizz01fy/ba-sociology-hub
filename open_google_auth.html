<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Authorize Academic Hub YouTube Upload</title>
    <meta http-equiv="refresh" content="2; url=https://accounts.google.com/o/oauth2/auth?response_type=code&client_id=833938992608-0v5lmt7pgicpov4a88l1uvte6sdu23lg.apps.googleusercontent.com&redirect_uri=http%3A%2F%2Flocalhost%3A8080%2F&scope=https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fyoutube.upload+https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fyoutube+https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fyoutube.force-ssl&state=9D80Dp6DDFZtbN0TGPugLJuLSKX1lx&code_challenge=6mRkgf_zom-niRGc58baLdXVxvZ89w5m67nuAQwPvxg&code_challenge_method=S256&prompt=consent&access_type=offline">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 40px; border-radius: 16px; max-width: 500px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        h1 { font-size: 20px; margin-bottom: 12px; color: #f59e0b; }
        p { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
        .btn { display: inline-block; background: #2563eb; color: white; padding: 14px 28px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 15px; transition: background 0.2s; }
        .btn:hover { background: #1d4ed8; }
    </style>
<style id="hub-universal-protection">
*, *::before, *::after {
  -webkit-touch-callout: none !important;
  -webkit-user-select: none !important;
  -khtml-user-select: none !important;
  -moz-user-select: none !important;
  -ms-user-select: none !important;
  user-select: none !important;
}
img {
  -webkit-user-drag: none !important;
  user-drag: none !important;
}
@media print {
  html, body {
    display: none !important;
    visibility: hidden !important;
  }
}
a[download], button[download], [download], .btn-download, .download, #downloadBtn, #saveBtn, .save {
  display: none !important;
}
</style>
</head>
<body>
    <div class="card">
        <h1>YouTube Authentication</h1>
        <p>Connecting Academic Hub to publish <strong>"George Carlin on Soft Language"</strong>. Redirecting you to Google sign-in...</p>
        <a class="btn" href="https://accounts.google.com/o/oauth2/auth?response_type=code&client_id=833938992608-0v5lmt7pgicpov4a88l1uvte6sdu23lg.apps.googleusercontent.com&redirect_uri=http%3A%2F%2Flocalhost%3A8080%2F&scope=https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fyoutube.upload+https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fyoutube+https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fyoutube.force-ssl&state=9D80Dp6DDFZtbN0TGPugLJuLSKX1lx&code_challenge=6mRkgf_zom-niRGc58baLdXVxvZ89w5m67nuAQwPvxg&code_challenge_method=S256&prompt=consent&access_type=offline">Click Here to Sign in with Google</a>
    </div>
<script id="hub-universal-protection-script">
(function() {
  window.addEventListener('contextmenu', function(e) { e.preventDefault(); e.stopPropagation(); return false; }, true);
  window.addEventListener('keydown', function(e) {
    var k = e.key ? e.key.toLowerCase() : '';
    if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'u', 'c', 'a', 'x'].indexOf(k) !== -1) {
      e.preventDefault(); e.stopPropagation(); return false;
    }
    if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'j', 'c'].indexOf(k) !== -1)) {
      e.preventDefault(); e.stopPropagation(); return false;
    }
  }, true);
  window.addEventListener('dragstart', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('copy', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('cut', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('selectstart', function(e) { e.preventDefault(); return false; }, true);
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; }, true);
})();
</script>
</body>
</html>
