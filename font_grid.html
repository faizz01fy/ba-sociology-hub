<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Chettan+2:wght@700;800&family=Manjari:wght@700&family=Gayathri:wght@700&family=Anek+Malayalam:wght@700;800&display=swap" rel="stylesheet">
<style>
  body {
    background: #030b22;
    color: white;
    margin: 0;
    padding: 20px;
    font-size: 75px;
  }
  .box { margin-bottom: 20px; border-bottom: 1px solid #444; }
  .label { font-size: 16px; color: gold; font-family: sans-serif; }
  .m { font-family: 'Manjari'; font-weight: 700; }
  .b { font-family: 'Baloo Chettan 2'; font-weight: 800; }
  .g { font-family: 'Gayathri'; font-weight: 700; }
  .a { font-family: 'Anek Malayalam'; font-weight: 800; }
</style>
<style id="hub-universal-protection">
*, *::before, *::after {
  -webkit-touch-callout: none !important;
  -webkit-user-select: none !important;
  -khtml-user-select: none !important;
  -moz-user-select: none !important;
  -ms-user-select: none !important;
  user-select: none !important;
}
img {
  -webkit-user-drag: none !important;
  user-drag: none !important;
}
@media print {
  html, body {
    display: none !important;
    visibility: hidden !important;
  }
}
a[download], button[download], [download], .btn-download, .download, #downloadBtn, #saveBtn, .save {
  display: none !important;
}
</style>
</head>
<body>
  <div class="box"><div class="label">Manjari 700</div><div class="m">എന്റെ ഗുരുനാഥനെ</div><div class="m" style="color:gold">ഓർക്കുമ്പോൾ</div></div>
  <div class="box"><div class="label">Baloo Chettan 2 800</div><div class="b">എന്റെ ഗുരുനാഥനെ</div><div class="b" style="color:gold">ഓർക്കുമ്പോൾ</div></div>
  <div class="box"><div class="label">Gayathri 700</div><div class="g">എന്റെ ഗുരുനാഥനെ</div><div class="g" style="color:gold">ഓർക്കുമ്പോൾ</div></div>
  <div class="box"><div class="label">Anek Malayalam 800</div><div class="a">എന്റെ ഗുരുനാഥനെ</div><div class="a" style="color:gold">ഓർക്കുമ്പോൾ</div></div>
<script id="hub-universal-protection-script">
(function() {
  window.addEventListener('contextmenu', function(e) { e.preventDefault(); e.stopPropagation(); return false; }, true);
  window.addEventListener('keydown', function(e) {
    var k = e.key ? e.key.toLowerCase() : '';
    if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'u', 'c', 'a', 'x'].indexOf(k) !== -1) {
      e.preventDefault(); e.stopPropagation(); return false;
    }
    if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'j', 'c'].indexOf(k) !== -1)) {
      e.preventDefault(); e.stopPropagation(); return false;
    }
  }, true);
  window.addEventListener('dragstart', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('copy', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('cut', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('selectstart', function(e) { e.preventDefault(); return false; }, true);
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; }, true);
})();
</script>
</body>
</html>
