<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@700;800;900&family=Outfit:wght@800;900&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 1280px;
            height: 720px;
            background: linear-gradient(135deg, #03102C 0%, #08225E 50%, #0D3691 100%);
            font-family: 'Anek Malayalam', 'Outfit', sans-serif;
            color: #ffffff;
            padding: 40px 52px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
            top: -120px;
            right: -120px;
            z-index: 1;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 2;
        }

        .badge-group {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .badge-uni {
            background: rgba(15, 23, 42, 0.7);
            border: 1.5px solid #38BDF8;
            color: #e0f2fe;
            font-size: 16px;
            font-weight: 800;
            padding: 8px 20px;
            border-radius: 999px;
            letter-spacing: 0.8px;
        }

        .badge-mod {
            background: #FACC15;
            color: #03102C;
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 22px;
            padding: 8px 22px;
            border-radius: 10px;
            letter-spacing: 0.8px;
            box-shadow: 0 4px 12px rgba(250, 204, 21, 0.4);
        }

        .badge-hub {
            background: rgba(255, 255, 255, 0.12);
            color: #38BDF8;
            font-weight: 900;
            font-size: 20px;
            padding: 8px 20px;
            border-radius: 12px;
            border: 1.5px solid rgba(56, 189, 248, 0.5);
        }

        .main-content {
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .mal-title {
            font-family: 'Anek Malayalam', sans-serif;
            font-weight: 900;
            font-size: 62px;
            line-height: 1.15;
            color: #ffffff;
            text-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
        }

        .highlight-yellow {
            color: #FACC15;
        }

        .en-box {
            background: rgba(3, 16, 44, 0.7);
            border-left: 6px solid #FACC15;
            padding: 14px 24px;
            border-radius: 0 14px 14px 0;
            width: fit-content;
        }

        .en-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 56px;
            line-height: 1.1;
            color: #38BDF8;
            text-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
        }

        .pill-container {
            display: flex;
            gap: 16px;
            margin-top: 8px;
        }

        .pill {
            background: rgba(15, 23, 42, 0.8);
            border: 1.5px solid #38BDF8;
            padding: 10px 22px;
            border-radius: 9999px;
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
        }

        .bottom-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
            padding-top: 16px;
            z-index: 2;
        }

        .bottom-left {
            font-family: 'Anek Malayalam', sans-serif;
            font-weight: 800;
            font-size: 24px;
            color: #bae6fd;
        }

        .bottom-right {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 22px;
            color: #FACC15;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="top-bar">
        <div class="badge-group">
            <span class="badge-uni">CALICUT UNIVERSITY FYUGP</span>
            <span class="badge-mod">MODULE 04 · UNIT 11</span>
        </div>
        <span class="badge-hub">● ACADEMIC HUB</span>
    </div>

    <div class="main-content">
        <h1 class="mal-title">കുത്തക വിപണിയും<br><span class="highlight-yellow">വിപണി ശക്തി &amp; ക്ഷേമ നഷ്ടവും</span></h1>
        <div class="en-box">
            <h2 class="en-title">MONOPOLY &amp; WELFARE LOSS</h2>
        </div>
        <div class="pill-container">
            <span class="pill">MR = MC തത്വം</span>
            <span class="pill">ലെർണർ സൂചിക</span>
            <span class="pill">ഡെഡ്‌വെയ്റ്റ് ലോസ്</span>
        </div>
    </div>

    <div class="bottom-bar">
        <span class="bottom-left">MICROECONOMICS MASTERCLASS (1080P)</span>
        <span class="bottom-right">FULL SYLLABUS COVERAGE</span>
    </div>
</body>
</html>
