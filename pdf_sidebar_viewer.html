<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Study PDF Library & Sidebar Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1B365D;
      --primary-light: #2A4D7E;
      --accent: #007acc;
      --bg-sidebar: #0f172a;
      --bg-sidebar-hover: #1e293b;
      --bg-sidebar-active: #2563eb;
      --text-sidebar: #cbd5e1;
      --text-muted: #64748b;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background-color: #0b0f19;
      color: #f1f5f9;
    }
    /* SIDEBAR */
    #sidebar {
      width: 380px;
      min-width: 300px;
      max-width: 500px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: margin-left 0.25s ease, width 0.2s ease;
      z-index: 20;
    }
    #sidebar.collapsed {
      margin-left: -380px;
    }
    .sidebar-header {
      padding: 16px 20px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .total-badge {
      font-size: 11px;
      background: #334155;
      color: #94a3b8;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .search-box {
      position: relative;
    }
    .search-box input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 9px 12px 9px 34px;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      fill: #64748b;
      pointer-events: none;
    }
    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
    }
    .sidebar-content::-webkit-scrollbar {
      width: 6px;
    }
    .sidebar-content::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    .category-group {
      margin-bottom: 10px;
    }
    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      user-select: none;
      transition: background 0.15s;
    }
    .category-header:hover {
      background: var(--bg-sidebar-hover);
      color: #e2e8f0;
    }
    .cat-count {
      font-size: 10px;
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 10px;
    }
    .pdf-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 4px;
      padding-left: 6px;
    }
    .pdf-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-sidebar);
      font-size: 13px;
      text-decoration: none;
      transition: all 0.15s ease;
      gap: 8px;
    }
    .pdf-item:hover {
      background: var(--bg-sidebar-hover);
      color: #f8fafc;
      transform: translateX(2px);
    }
    .pdf-item.active {
      background: var(--bg-sidebar-active);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }
    .pdf-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .pdf-size {
      font-size: 10px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .pdf-item.active .pdf-size {
      color: #bfdbfe;
    }

    /* MAIN VIEWER */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #1e293b;
      overflow: hidden;
    }
    .topbar {
      height: 54px;
      background: #0f172a;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }
    .btn-toggle {
      background: #1e293b;
      border: 1px solid var(--border);
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .btn-toggle:hover {
      color: #f8fafc;
      border-color: #475569;
    }
    .active-pdf-info {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .active-title {
      font-size: 14px;
      font-weight: 600;
      color: #f8fafc;
      margin-right: 8px;
    }
    .active-meta {
      font-size: 11px;
      color: #64748b;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn-action {
      background: #1e293b;
      border: 1px solid var(--border);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .btn-action:hover {
      background: #334155;
      color: #ffffff;
    }
    .btn-action.primary {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
    }
    .btn-action.primary:hover {
      background: #1d4ed8;
    }
    .viewer-container {
      flex: 1;
      position: relative;
      background: #334155;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #525659;
    }

    /* MOBILE-FIRST RESPONSIVE DESIGN (< 768px) */
    @media (max-width: 768px) {
      body {
        position: relative;
        overflow: hidden;
      }
      #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 86vw;
        max-width: 320px;
        min-width: 0;
        z-index: 1000;
        transform: translateX(0);
        margin-left: 0 !important;
        box-shadow: 8px 0 24px rgba(0, 0, 0, 0.6);
        transition: transform 0.24s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #sidebar.collapsed {
        transform: translateX(-100%) !important;
      }
      .sidebar-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        z-index: 999;
        backdrop-filter: blur(2px);
      }
      .sidebar-backdrop.active {
        display: block;
      }
      .topbar {
        height: 52px;
        padding: max(4px, env(safe-area-inset-top, 0px)) 10px 4px;
        gap: 8px;
      }
      .btn-toggle {
        padding: 6px 10px;
        font-size: 11.5px;
        min-height: 38px;
      }
      .active-title {
        font-size: 12.5px;
        max-width: 140px;
      }
      .btn-action {
        padding: 6px 10px;
        font-size: 11px;
        min-height: 38px;
      }
    }
  </style>

    const sidebarContent = document.getElementById('sidebarContent');
    const searchInput = document.getElementById('searchInput');
    const pdfFrame = document.getElementById('pdfFrame');
    const activeTitle = document.getElementById('activeTitle');
    const activeMeta = document.getElementById('activeMeta');
    const openNewTabBtn = document.getElementById('openNewTabBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const toggleBtn = document.getElementById('toggleBtn');
    const sidebar = document.getElementById('sidebar');

    let currentActiveItem = null;

    function renderSidebar(filterText = '') {
      sidebarContent.innerHTML = '';
      const filter = filterText.toLowerCase().trim();
      let matches = 0;

      for (const [catName, files] of Object.entries(PDF_DATA.categories)) {
        const matchedFiles = files.filter(f => 
          f.title.toLowerCase().includes(filter) || 
          f.category.toLowerCase().includes(filter) ||
          f.path.toLowerCase().includes(filter)
        );

        if (matchedFiles.length === 0) continue;
        matches += matchedFiles.length;

        const group = document.createElement('div');
        group.className = 'category-group';

        const header = document.createElement('div');
        header.className = 'category-header';
        header.innerHTML = `<span>${catName}</span><span class="cat-count">${matchedFiles.length}</span>`;

        const list = document.createElement('div');
        list.className = 'pdf-list';

        matchedFiles.forEach(pdf => {
          const item = document.createElement('div');
          item.className = 'pdf-item';
          item.dataset.path = pdf.path;
          item.dataset.title = pdf.title;
          item.dataset.size = pdf.size_kb + ' KB';
          item.innerHTML = `
            <span class="pdf-title" title="${pdf.title}">${pdf.title}</span>
            <span class="pdf-size">${pdf.size_kb > 1024 ? (pdf.size_kb/1024).toFixed(1) + ' MB' : pdf.size_kb + ' KB'}</span>
          `;

          item.addEventListener('click', () => {
            loadPdf(pdf.path, pdf.title, pdf.size_kb);
            setActive(item);
          });

          list.appendChild(item);
        });

        group.appendChild(header);
        group.appendChild(list);
        sidebarContent.appendChild(group);
      }

      if (matches === 0) {
        sidebarContent.innerHTML = `<div style="padding: 24px 16px; text-align: center; color: #64748b; font-size: 13px;">No matching PDFs found for "${filterText}"</div>`;
      }
    }

    function loadPdf(relPath, title, sizeKb) {
      const readerUrl = 'study-guide-reader.html?file=' + encodeURIComponent(relPath) + '&tab=lms';
      pdfFrame.src = readerUrl;
      activeTitle.textContent = title;
      const sizeStr = sizeKb > 1024 ? (sizeKb / 1024).toFixed(1) + ' MB' : sizeKb + ' KB';
      activeMeta.textContent = `• ${sizeStr} • ${relPath}`;
      openNewTabBtn.href = readerUrl;
      downloadBtn.href = relPath;
      downloadBtn.setAttribute('download', relPath.split('/').pop());
      document.title = `${title} - PDF Explorer`;
    }

    function setActive(itemElement) {
      if (currentActiveItem) {
        currentActiveItem.classList.remove('active');
      }
      currentActiveItem = itemElement;
      if (itemElement) {
        itemElement.classList.add('active');
        itemElement.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    // Toggle Sidebar
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');

    function updateBackdrop() {
      if (window.innerWidth <= 768 && !sidebar.classList.contains('collapsed')) {
        sidebarBackdrop.classList.add('active');
      } else {
        sidebarBackdrop.classList.remove('active');
      }
    }

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      updateBackdrop();
    });

    if (sidebarBackdrop) {
      sidebarBackdrop.addEventListener('click', () => {
        sidebar.classList.add('collapsed');
        updateBackdrop();
      });
    }

    // Collapse sidebar by default on mobile phones
    if (window.innerWidth <= 768) {
      sidebar.classList.add('collapsed');
    }

    // Keyboard shortcut F or [ to toggle sidebar
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key.toLowerCase() === 'f' || e.key === '[') {
        sidebar.classList.toggle('collapsed');
      }
    });

    // Live search
    searchInput.addEventListener('input', (e) => {
      renderSidebar(e.target.value);
    });

    // Initial render
    renderSidebar();

    // Default load: Prioritize Horizons - I or first PDF
    const horizonsPdf = PDF_DATA.all_pdfs.find(p => p.filename.includes('Horizons_I')) || PDF_DATA.all_pdfs[0];
    if (horizonsPdf) {
      loadPdf(horizonsPdf.path, horizonsPdf.title, horizonsPdf.size_kb);
      // Find element and mark active
      setTimeout(() => {
        const el = document.querySelector(`.pdf-item[data-path="${horizonsPdf.path}"]`);
        if (el) setActive(el);
      }, 100);
    }
  </script>
