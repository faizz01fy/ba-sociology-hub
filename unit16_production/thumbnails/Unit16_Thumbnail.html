<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manjari:wght@700&family=Outfit:wght@800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 1280px;
            height: 720px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 40%, #0f172a 100%);
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
            top: -100px;
            right: -100px;
            z-index: 1;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 2;
        }

        .badge-mod {
            background: #f59e0b;
            color: #000000;
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 26px;
            padding: 8px 24px;
            border-radius: 12px;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }

        .badge-hub {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            color: #38bdf8;
            font-weight: 800;
            font-size: 22px;
            padding: 8px 20px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        .main-content {
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mal-title {
            font-family: 'Manjari', sans-serif;
            font-weight: 700;
            font-size: 64px;
            line-height: 1.15;
            color: #ffffff;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }

        .highlight-yellow {
            color: #fbbf24;
        }

        .en-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 40px;
            color: #38bdf8;
            letter-spacing: 0.5px;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.4);
        }

        .pill-container {
            display: flex;
            gap: 16px;
            margin-top: 10px;
        }

        .pill {
            background: rgba(15, 23, 42, 0.7);
            border: 1.5px solid #0284c7;
            padding: 10px 22px;
            border-radius: 9999px;
            font-size: 22px;
            font-weight: 700;
            color: #e2e8f0;
        }

        .bottom-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1.5px solid rgba(255, 255, 255, 0.2);
            padding-top: 18px;
            z-index: 2;
        }

        .bottom-left {
            font-family: 'Manjari', sans-serif;
            font-weight: 700;
            font-size: 24px;
            color: #cbd5e1;
        }

        .bottom-right {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 22px;
            color: #fbbf24;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="top-bar">
        <span class="badge-mod">MODULE 03 · UNIT 16</span>
        <span class="badge-hub">ACADEMIC HUB</span>
    </div>

    <div class="main-content">
        <h1 class="mal-title">ഹ്രസ്വകാല ചെലവ് കർവുകൾ<br><span class="highlight-yellow">TC, MC, AVC & ATC സിദ്ധാന്തങ്ങൾ</span></h1>
        <h2 class="en-title">SHORT-RUN COSTS & U-SHAPED CURVES</h2>
        <div class="pill-container">
            <span class="pill">FC & VC കർവുകൾ</span>
            <span class="pill">MC cuts AVC/ATC at Min</span>
            <span class="pill">പരീക്ഷാ വിശകലനം</span>
        </div>
    </div>

    <div class="bottom-bar">
        <span class="bottom-left">കാലിക്കറ്റ് സർവ്വകലാശാല FYUGP 1st Sem മൈക്രോ ഇക്കണോമിക്സ്</span>
        <span class="bottom-right">FULL 1080P MASTERCLASS</span>
    </div>
</body>
</html>
