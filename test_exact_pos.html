<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manjari:wght@700&display=swap" rel="stylesheet">
<style>
  body {
    width: 1280px;
    height: 720px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    position: relative;
    background: #010617;
    font-family: 'Manjari', sans-serif;
  }
  .title-line-1 {
    position: absolute;
    top: 134px;
    left: 35px;
    font-size: 88px;
    font-weight: 700;
    color: #ffffff;
    -webkit-text-stroke: 1.5px #ffffff;
    line-height: 1.0;
    letter-spacing: -1.2px;
    text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95);
    white-space: nowrap;
  }
  .title-line-2 {
    position: absolute;
    top: 268px;
    left: 35px;
    font-size: 132px;
    font-weight: 700;
    background: linear-gradient(180deg, #ffe675 0%, #ffb703 45%, #e67e22 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 2.5px rgba(255, 183, 3, 0.6);
    filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.95));
    line-height: 1.0;
    letter-spacing: -2px;
    white-space: nowrap;
  }
  .author-row {
    position: absolute;
    top: 428px;
    left: 35px;
    width: 640px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .author-name {
    font-size: 38px;
    font-weight: 700;
    color: #ffffff;
    -webkit-text-stroke: 0.8px #ffffff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
  }
</style>
<style id="hub-universal-protection">
*, *::before, *::after {
  -webkit-touch-callout: none !important;
  -webkit-user-select: none !important;
  -khtml-user-select: none !important;
  -moz-user-select: none !important;
  -ms-user-select: none !important;
  user-select: none !important;
}
img {
  -webkit-user-drag: none !important;
  user-drag: none !important;
}
@media print {
  html, body {
    display: none !important;
    visibility: hidden !important;
  }
}
a[download], button[download], [download], .btn-download, .download, #downloadBtn, #saveBtn, .save {
  display: none !important;
}
</style>
</head>
<body>
  <div class="title-line-1">എന്റെ ഗുരുനാഥനെ</div>
  <div class="title-line-2">ഓർക്കുമ്പോൾ</div>
  <div class="author-row">
    <div class="author-name">കലാമണ്ഡലം ഹൈദരാലി</div>
  </div>
<script id="hub-universal-protection-script">
(function() {
  window.addEventListener('contextmenu', function(e) { e.preventDefault(); e.stopPropagation(); return false; }, true);
  window.addEventListener('keydown', function(e) {
    var k = e.key ? e.key.toLowerCase() : '';
    if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'u', 'c', 'a', 'x'].indexOf(k) !== -1) {
      e.preventDefault(); e.stopPropagation(); return false;
    }
    if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'j', 'c'].indexOf(k) !== -1)) {
      e.preventDefault(); e.stopPropagation(); return false;
    }
  }, true);
  window.addEventListener('dragstart', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('copy', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('cut', function(e) { e.preventDefault(); return false; }, true);
  window.addEventListener('selectstart', function(e) { e.preventDefault(); return false; }, true);
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; }, true);
})();
</script>
</body>
</html>
