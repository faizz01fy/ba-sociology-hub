<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Anek+Malayalam:wght@800;900&family=Outfit:wght@800;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 1280px; height: 720px;
            background: linear-gradient(135deg, #022c22 0%, #064e3b 50%, #022c22 100%);
            font-family: 'Anek Malayalam', 'Outfit', sans-serif;
            color: #ffffff;
            padding: 40px 52px;
            display: flex; flex-direction: column; justify-content: space-between;
            overflow: hidden; position: relative;
        }
        .bg-glow {
            position: absolute; width: 620px; height: 620px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
            top: -120px; right: -120px; z-index: 1;
        }
        .top-bar { display: flex; align-items: center; justify-content: space-between; z-index: 2; }
        .badge {
            background: #10b981; color: #022c22;
            font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 24px;
            padding: 8px 22px; border-radius: 9999px; letter-spacing: 1.5px;
        }
        .meta-pill {
            background: rgba(255, 255, 255, 0.12); color: #a7f3d0;
            font-family: 'Amiri', serif; font-size: 32px; font-weight: 700;
            padding: 6px 24px; border-radius: 12px; border: 1.5px solid rgba(16, 185, 129, 0.4);
            direction: rtl;
        }
        .main-content { z-index: 2; display: flex; flex-direction: column; gap: 14px; margin-top: 10px; }
        .hero-ar {
            font-family: 'Amiri', serif; font-size: 68px; font-weight: 700;
            line-height: 1.25; color: #34d399; direction: rtl; text-align: left;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
        }
        .hero-mal {
            font-family: 'Anek Malayalam', sans-serif; font-size: 56px; font-weight: 900;
            line-height: 1.15; color: #ffffff; text-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
        }
        .hero-en {
            font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 800;
            color: #94a3b8; letter-spacing: 0.5px;
        }
        .bottom-bar { display: flex; align-items: center; justify-content: space-between; z-index: 2; }
        .pills { display: flex; gap: 14px; }
        .pill {
            background: rgba(16, 185, 129, 0.2); color: #6ee7b7;
            font-size: 20px; font-weight: 800; padding: 6px 18px; border-radius: 9999px;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }
        .channel-tag {
            font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 900;
            color: #10b981; letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="top-bar">
        <span class="badge">ARABIC · MOD 02 · CH 03</span>
        <span class="meta-pill">الفصل الثالث: طرائف عربية</span>
    </div>
    <div class="main-content">
        <div class="hero-ar">طَرَائِفُ عَرَبِيَّةٌ كَلَاسِيكِيَّةٌ</div>
        <div class="hero-mal">അറബിക് നർമ്മകഥകൾ : സാഹിത്യ ഭംഗിയും ചോദ്യങ്ങളും</div>
        <div class="hero-en">Classical Arabic Wit, Anecdotes & Textbook Exercises</div>
    </div>
    <div class="bottom-bar">
        <div class="pills">
            <span class="pill">5 ക്ലാസിക്കൽ കഥകൾ</span>
            <span class="pill">വ്യാകരണ വിശകലനം</span>
            <span class="pill">പരീക്ഷാ ചോദ്യോത്തരങ്ങൾ</span>
        </div>
        <span class="channel-tag">CALICUT UNIVERSITY FYUGP</span>
    </div>
</body>
</html>
